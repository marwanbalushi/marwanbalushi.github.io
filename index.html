<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مروان يوسف البلوشي</title>
<meta name="description" content="نكتبُ عن الفقدِ.. كي لا يبردَ في القلبِ شوقٌ.. ولا تتحجّرَ ذكرى">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
 --paper:#F8F4EE;--paper2:#F1EBE2;--ink:#241F1E;--accent:#5A1F28;--gold:#A8834B;
 --muted:#6B5A56;--rule:#E2D8CD;--scale:1;--body:calc(20px*var(--scale));--measure:32em;
 --display:"Amiri",serif;--text:"Scheherazade New",serif;
}
@media(min-width:760px){:root{--body:calc(22px*var(--scale))}}
html[data-theme=dark]{--paper:#191614;--paper2:#211D19;--ink:#E9E1D6;--accent:#C9A063;
 --gold:#C9A063;--muted:#9A9088;--rule:#332C27}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);
 font-size:var(--body);line-height:1.85;letter-spacing:0;padding:0 20px 70px}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.tools{max-width:var(--measure);margin:0 auto;display:flex;justify-content:flex-end;gap:6px;padding:14px 0 0}
.tools button{font-family:var(--text);font-size:.66em;line-height:1;color:var(--muted);background:none;
 border:.5px solid var(--rule);border-radius:4px;padding:7px 11px;cursor:pointer}
.tools button:hover{color:var(--accent);border-color:var(--gold)}
.mast{max-width:var(--measure);margin:0 auto;text-align:center;padding:32px 0 26px}
.name{font-family:var(--display);font-weight:400;font-size:clamp(30px,8.5vw,46px);
 line-height:1.45;color:var(--accent);margin:0}
.fl{display:flex;align-items:center;justify-content:center;gap:9px;margin:15px 0}
.fl i{display:block;height:.5px;width:48px;background:var(--rule)}
.lz{width:5px;height:5px;background:var(--gold);transform:rotate(45deg)}
.doors{font-family:var(--display);font-size:calc(var(--body)*.82);line-height:2.15;margin:0}
.doors b{font-weight:400;cursor:pointer}
.subj{color:var(--accent)}.pred{color:var(--gold)}.sep{color:var(--rule);padding:0 5px}
.doors b.off .subj,.doors b.off .pred{opacity:.35}
.tag{color:var(--muted);font-size:calc(var(--body)*.74);line-height:1.9;margin:16px auto 0;max-width:24em}
.forms{max-width:var(--measure);margin:26px auto 0;display:flex;
 border-top:.5px solid var(--rule);border-bottom:.5px solid var(--rule)}
.forms button{flex:1;font-family:var(--display);font-size:calc(var(--body)*.8);color:var(--muted);
 background:none;border:none;padding:12px 0;cursor:pointer;border-bottom:2px solid transparent}
.forms button.on{color:var(--accent);border-bottom-color:var(--gold)}
html[data-theme=dark] .forms button.on{color:var(--gold)}
main{max-width:var(--measure);margin:0 auto}
.e{padding:32px 0;border-top:.5px solid var(--rule)}
.e:first-child{border-top:none}
.meta{font-size:calc(var(--body)*.6);color:var(--muted);margin:0 0 10px}
.meta .dr{color:var(--gold)}
.meta a{color:var(--muted)}
.med{margin:0 0 18px}
.med figure{margin:0 0 8px}
.med.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.med.grid figure{margin:0}
.med img,.med video{width:100%;border-radius:3px;display:block;background:var(--paper2)}
.wide{max-width:calc(var(--measure)+6em);margin-inline:auto}
.tx{margin:0;white-space:pre-wrap}
.end{width:5px;height:5px;background:var(--gold);transform:rotate(45deg);margin:16px auto 0}
.more{display:block;margin:40px auto 0;font-family:var(--display);font-size:calc(var(--body)*.8);
 color:var(--muted);background:none;border:.5px solid var(--rule);border-radius:4px;
 padding:11px 26px;cursor:pointer}
.more:hover{color:var(--accent);border-color:var(--gold)}
.foot{max-width:var(--measure);margin:50px auto 0;padding-top:24px;border-top:.5px solid var(--rule);
 text-align:center;font-size:calc(var(--body)*.6);color:var(--muted);line-height:2}
.none{text-align:center;color:var(--muted);padding:50px 0;font-size:calc(var(--body)*.8)}
.back{display:block;max-width:var(--measure);margin:0 auto;padding:14px 0;
 font-family:var(--display);font-size:calc(var(--body)*.75);color:var(--accent)}
html[data-theme=dark] .back{color:var(--gold)}
</style>
</head>
<body>

<div class="tools">
 <button id="sm" aria-label="تصغير النص">أ−</button>
 <button id="bg" aria-label="تكبير النص">أ+</button>
 <button id="md">الوضع الليلي</button>
</div>

<div id="app">
 <header class="mast">
  <h1 class="name"><a href="#/">مروان يوسف البلوشي</a></h1>
  <div class="fl" aria-hidden="true"><i></i><span class="lz"></span><i></i></div>
  <nav class="doors" id="doors" aria-label="أبواب المدونة"></nav>
  <p class="tag">نكتبُ عن الفقدِ.. كي لا يبردَ في القلبِ شوقٌ.. ولا تتحجّرَ ذكرى</p>
 </header>
 <div class="forms" id="forms">
  <button data-f="all" class="on">الكل</button>
  <button data-f="waqfah">وقفات</button>
  <button data-f="shathrah">شذرات</button>
 </div>
 <main id="stream"><p class="none">…</p></main>
 <button class="more" id="more" style="display:none">المزيد</button>
</div>

<footer class="foot">
 <div class="fl" aria-hidden="true"><i></i><span class="lz"></span><i></i></div>
 مروان يوسف البلوشي · مسقط، سلطنة عُمان
</footer>

<script>
/* ===== غيّر هذا السطر بعد رفع الوسائط إلى Cloudflare R2 ===== */
var MEDIA_BASE = "";
/* مثال: var MEDIA_BASE = "https://pub-xxxx.r2.dev"; */

var DOORS=[["عُمان",""],["الإسلام","مرجعيّة"],["الهُويّة","عزّة"],["الإنسان","كرامة"],["دبلوماسيّة",""]];
var DATA=[], form="all", door=null, shown=0, PAGE=25;
var arn=function(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})};

var dn=document.getElementById('doors');
DOORS.forEach(function(p,i){
  if(i) dn.insertAdjacentHTML('beforeend','<span class="sep">|</span>');
  var full=p[1]?p[0]+" "+p[1]:p[0];
  dn.insertAdjacentHTML('beforeend','<b data-d="'+full+'"><span class="subj">'+p[0]+'</span>'+
    (p[1]?' <span class="pred">'+p[1]+'</span>':'')+'</b>');
});
dn.onclick=function(e){
  var b=e.target.closest('b'); if(!b) return;
  location.hash='#/';
  door=(door===b.dataset.d)?null:b.dataset.d;
  Array.prototype.forEach.call(dn.querySelectorAll('b'),function(x){
    x.classList.toggle('off', !!door && x.dataset.d!==door); });
  shown=0; render();
};
Array.prototype.forEach.call(document.querySelectorAll('#forms button'),function(b){
  b.onclick=function(){
    location.hash='#/';
    form=b.dataset.f;
    Array.prototype.forEach.call(document.querySelectorAll('#forms button'),function(x){
      x.classList.toggle('on',x===b); });
    shown=0; render();
  };
});

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function src(m){ return MEDIA_BASE ? MEDIA_BASE+"/"+m.f : m.u; }

function card(e,solo){
  var isW=e.f==='waqfah', med='';
  if(e.m.length){
    med='<div class="med '+(e.m.length>1?'grid':'')+' '+(isW?'wide':'')+'">'+
      e.m.map(function(m){
        if(m.v && MEDIA_BASE)
          return '<figure><video controls preload="none" poster="'+src(m)+'"><source src="'+
                 src(m).replace(/\.jpg$/,'.mp4')+'" type="video/mp4"></video></figure>';
        return '<figure><img loading="lazy" src="'+src(m)+'" alt=""></figure>';
      }).join('')+'</div>';
  }
  var meta='<p class="meta">'+(solo?e.d:'<a href="#/'+e.id+'">'+e.d+'</a>')+
    (e.dk?' · <span class="dr">'+e.door+'</span>':'')+(e.n>1?' · سلسلة':'')+'</p>';
  return '<article class="e">'+meta+med+'<p class="tx">'+esc(e.t)+'</p>'+
    (isW?'<div class="end"></div>':'')+'</article>';
}

function filtered(){
  return DATA.filter(function(e){
    return (form==="all"||e.f===form) && (!door||e.door===door); });
}

function render(){
  var list=filtered(), s=document.getElementById('stream'), more=document.getElementById('more');
  if(!list.length){ s.innerHTML='<p class="none">لا مداخل في هذا الباب بعد.</p>'; more.style.display='none'; return; }
  if(shown===0) s.innerHTML='';
  var next=list.slice(shown, shown+PAGE);
  s.insertAdjacentHTML('beforeend', next.map(function(e){return card(e,false)}).join(''));
  shown+=next.length;
  more.style.display = shown<list.length ? 'block' : 'none';
  more.textContent='المزيد ('+arn(list.length-shown)+')';
}
document.getElementById('more').onclick=function(){ render(); };

function route(){
  var h=location.hash.replace('#/','').trim();
  var app=document.getElementById('app');
  var old=document.getElementById('solo'); if(old) old.remove();
  if(h){
    var e=DATA.filter(function(x){return x.id===h})[0];
    if(e){
      app.style.display='none';
      document.body.insertAdjacentHTML('afterbegin',
       '<div id="solo"><a class="back" href="#/">→ العودة إلى المدونة</a>'+
       '<main>'+card(e,true)+'</main></div>');
      window.scrollTo(0,0);
      return;
    }
  }
  app.style.display='';
}
window.addEventListener('hashchange', route);

fetch('data.json').then(function(r){return r.json()}).then(function(j){
  DATA=j; render(); route();
}).catch(function(){
  document.getElementById('stream').innerHTML='<p class="none">تعذّر تحميل المداخل.<br>تأكّد من رفع ملف data.json.</p>';
});

(function(){
  var r=document.documentElement, sc=1;
  function st(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function rd(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function ap(){r.style.setProperty('--scale',sc);st('scale',sc)}
  document.getElementById('bg').onclick=function(){sc=Math.min(1.3,Math.round((sc+.1)*10)/10);ap()};
  document.getElementById('sm').onclick=function(){sc=Math.max(.85,Math.round((sc-.1)*10)/10);ap()};
  var md=document.getElementById('md');
  function th(t){r.setAttribute('data-theme',t);md.textContent=t==='dark'?'الوضع النهاري':'الوضع الليلي';st('theme',t)}
  md.onclick=function(){th(r.getAttribute('data-theme')==='dark'?'light':'dark')};
  var s=parseFloat(rd('scale')); if(s){sc=s;ap()}
  var t=rd('theme');
  if(t) th(t); else if(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches) th('dark');
})();
</script>
</body>
</html>
