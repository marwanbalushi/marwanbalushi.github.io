<style>
:root{
 --paper:#F8F4EE;--paper2:#F1EBE2;--ink:#241F1E;--accent:#5A1F28;--gold:#A8834B;
 --muted:#6B5A56;--rule:#E2D8CD;--rulew:.5px;--scale:1;--lh:1.85;
 --sizeM:20px;--sizeD:22px;--body:calc(var(--sizeM)*var(--scale));--measure:32em;
 --display:"Amiri",serif;--text:"Scheherazade New",serif;--dscale:1;
}
@media(min-width:760px){:root{--body:calc(var(--sizeD)*var(--scale))}}
[data-contrast=high]{--ink:#000;--muted:#332E2B;--rule:#B4A896}
[data-theme=dark][data-contrast=high]{--ink:#FFF;--muted:#D2CAC0;--rule:#4E463D}
[data-clarity=high]{--rulew:1.5px;--lh:2.05;--scale:1.12}
[data-color=plain]{--accent:var(--ink);--gold:var(--ink)}
[data-color=plain] .dr{border-bottom:var(--rulew) solid var(--rule);padding-bottom:1px}
[data-color=plain] .lz{background:var(--muted)}
[data-color=plain] .subj,[data-color=plain] .pred{color:var(--ink)}

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);
 font-size:var(--body);line-height:var(--lh);letter-spacing:0;padding:0 20px 70px}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.hide{display:none!important}

.tools{max-width:var(--measure);margin:0 auto;display:flex;justify-content:flex-end;
 align-items:center;gap:8px;padding:14px 0 0}
.tools button{font-family:var(--text);font-size:calc(var(--body)*.66);line-height:1;
 color:var(--muted);background:none;border:var(--rulew) solid var(--rule);border-radius:5px;
 padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.tools button:hover{color:var(--accent);border-color:var(--gold)}
.tools svg{width:1.15em;height:1.15em}
.compose{margin-inline-end:auto}
#compose,#ctrl{display:inline-flex}
.owner{max-width:var(--measure);margin:10px auto 0;display:flex;align-items:center;gap:10px;
 background:var(--paper2);border:var(--rulew) solid var(--gold);border-radius:6px;
 padding:8px 13px;font-size:calc(var(--body)*.62);color:var(--muted)}
.owner b{color:var(--accent);font-weight:400}
.owner button{margin-inline-start:auto;font-family:var(--text);font-size:inherit;
 color:var(--accent);background:none;border:var(--rulew) solid var(--gold);
 border-radius:5px;padding:5px 12px;cursor:pointer}
#compose,#ctrl{display:inline-flex}

.panel{max-width:var(--measure);margin:10px auto 0;border:var(--rulew) solid var(--rule);
 border-radius:8px;padding:6px 16px 14px;background:var(--paper2);display:none}
.panel.on{display:block}
.prow{display:flex;align-items:center;gap:10px;padding:10px 0;
 border-top:var(--rulew) solid var(--rule);flex-wrap:wrap}
.prow:first-child{border-top:none}
.plabel{font-size:calc(var(--body)*.68);color:var(--muted);flex:1 0 5.5em}
.seg{display:flex;border:var(--rulew) solid var(--rule);border-radius:5px;overflow:hidden}
.seg button{border:none;border-radius:0;font-size:calc(var(--body)*.64);padding:8px 14px;
 background:none;color:var(--muted);cursor:pointer;font-family:var(--text)}
.seg button.on{background:var(--accent);color:var(--paper)}
.pnote{font-size:calc(var(--body)*.6);color:var(--muted);line-height:1.85;
 padding-top:11px;border-top:var(--rulew) solid var(--rule);margin:4px 0 0}

.mast{max-width:var(--measure);margin:0 auto;text-align:center;padding:32px 0 26px}
.name{font-family:var(--display);font-weight:400;
 font-size:calc(clamp(30px,8.5vw,46px)*var(--dscale));line-height:1.45;color:var(--accent);margin:0}
a.avlink{display:block;text-align:center;margin-top:16px}
.avatar{display:block;border-radius:50%;object-fit:cover;margin:0 auto 9px;
 background:var(--paper2);border:2px solid var(--gold);
 box-shadow:0 0 0 4px var(--paper),0 0 0 5px var(--rule);transition:transform .25s}
a.avlink:hover .avatar{transform:scale(1.05)}
.avcap{display:inline-block;font-family:var(--display);font-size:calc(var(--body)*.66);
 color:var(--accent);border-bottom:1.5px solid var(--gold);padding-bottom:2px;margin-bottom:4px}
@keyframes avin{0%{opacity:0;transform:scale(.82)}60%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
a.avlink .avatar{animation:avin .9s .35s ease-out both}
a.avlink .avcap{animation:avin .7s .6s ease-out both}
@media (prefers-reduced-motion:reduce){a.avlink .avatar,a.avlink .avcap{animation:none}}
.fl{display:flex;align-items:center;justify-content:center;gap:9px;margin:15px 0}
.fl i{display:block;height:var(--rulew);width:48px;background:var(--rule)}
.lz{width:5px;height:5px;background:var(--gold);transform:rotate(45deg)}
.doors{font-family:var(--display);font-size:calc(var(--body)*.82);line-height:2.15;margin:0}
.doors b{font-weight:400;cursor:pointer}
.subj{color:var(--accent)}.pred{color:var(--gold)}
.sep{color:var(--rule);padding:0 5px}
.doors b.off{opacity:.34}
.doors b.sel{border-bottom:2px solid var(--gold)}
.tag{color:var(--muted);font-size:calc(var(--body)*.74);line-height:1.9;margin:16px auto 0;max-width:24em}

.forms{max-width:var(--measure);margin:26px auto 0;display:flex;
 border-top:var(--rulew) solid var(--rule);border-bottom:var(--rulew) solid var(--rule)}
.forms button{flex:1;font-family:var(--display);font-size:calc(var(--body)*.8);color:var(--muted);
 background:none;border:none;padding:12px 0;cursor:pointer;border-bottom:2px solid transparent}
.forms button.on{color:var(--accent);border-bottom-color:var(--gold)}

.search{max-width:var(--measure);margin:14px auto 0;position:relative}
.search input{width:100%;font-family:var(--text);font-size:calc(var(--body)*.78);
 color:var(--ink);background:var(--paper2);border:var(--rulew) solid var(--rule);
 border-radius:6px;padding:11px 42px 11px 14px;line-height:1.8}
.search svg{position:absolute;inset-block-start:50%;inset-inline-start:14px;
 transform:translateY(-50%);width:1.1em;height:1.1em;color:var(--muted);pointer-events:none}
.hits{font-size:calc(var(--body)*.62);color:var(--muted);text-align:center;padding:10px 0 0}

main{max-width:var(--measure);margin:0 auto}
.e{padding:32px 0;border-top:var(--rulew) solid var(--rule)}
.e:first-child{border-top:none}
.meta{font-size:calc(var(--body)*.6);color:var(--muted);margin:0 0 10px;
 display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.meta .dr{color:var(--gold)}
.meta .dot{color:var(--rule)}
.mk{display:inline-flex;align-items:center;color:var(--gold)}
.mk svg{width:1.2em;height:1.2em}
.pen{margin-inline-start:auto;display:inline-flex;align-items:center;color:var(--muted)}
.pen svg{width:1.25em;height:1.25em}
.pen:hover{color:var(--accent)}
.draft{color:var(--accent);border:var(--rulew) solid var(--gold);border-radius:3px;padding:0 7px}

.med{margin:0 0 18px}
.med figure{margin:0 0 8px;display:flex;justify-content:center}
.med img,.med video{max-width:100%;width:auto;max-height:78vh;border-radius:3px;
 display:block;background:var(--paper2);margin-inline:auto}
.med.g2,.med.g3{display:grid;gap:8px}
.med.g2{grid-template-columns:1fr 1fr}
.med.g3{grid-template-columns:1fr 1fr 1fr}
.med.g2 figure,.med.g3 figure{margin:0;display:block}
.med.g2 img,.med.g3 img,.med.g2 video,.med.g3 video{width:100%;height:100%;
 aspect-ratio:1;object-fit:cover;max-height:none}
.med.stack figure{margin-bottom:10px}
.wide{max-width:calc(var(--measure) + 6em);margin-inline:auto}

.tx{margin:0;white-space:pre-wrap}
.tx.clamp{max-height:17em;overflow:hidden;
 -webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent 100%);
 mask-image:linear-gradient(to bottom,#000 72%,transparent 100%)}
[data-clarity=high] .tx.clamp,[data-contrast=high] .tx.clamp{
 -webkit-mask-image:none;mask-image:none;
 border-bottom:var(--rulew) dashed var(--rule);padding-bottom:10px}
.cont{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-family:var(--display);
 font-size:calc(var(--body)*.74);color:var(--accent);
 border-bottom:var(--rulew) solid var(--gold);padding-bottom:3px}
.cont svg{width:1.05em;height:1.05em;flex:none}
.end{display:flex;align-items:center;justify-content:center;gap:11px;margin:22px auto 0}
.end i{display:block;height:var(--rulew);width:32px;background:var(--rule)}
.end span{width:5px;height:5px;background:var(--gold);transform:rotate(45deg)}

.share{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;
 max-width:var(--measure);margin:26px auto 0;padding-top:20px;
 border-top:var(--rulew) solid var(--rule)}
.share a,.share button{display:inline-flex;align-items:center;gap:7px;
 font-family:var(--text);font-size:calc(var(--body)*.66);color:var(--muted);
 background:none;border:var(--rulew) solid var(--rule);border-radius:5px;
 padding:8px 14px;cursor:pointer}
.share a:hover,.share button:hover{color:var(--accent);border-color:var(--gold)}
.share svg{width:1.05em;height:1.05em}

.about{max-width:var(--measure);margin:0 auto;text-align:center;padding:10px 0 0}
.about img{width:200px;height:200px;object-fit:cover;border-radius:8px;
 display:block;margin:0 auto 26px;background:var(--paper2)}
.about .lead{font-family:var(--display);font-size:calc(var(--body)*1.16);
 line-height:1.85;margin:0 auto;max-width:22em}
.about .bio{font-family:var(--display);font-size:calc(var(--body)*.86);
 line-height:2.1;margin:22px auto 0;max-width:26em}
.about .sig{color:var(--muted);font-size:calc(var(--body)*.74);
 line-height:1.9;margin:18px auto 0;max-width:24em}
.about .meta2{color:var(--muted);font-size:calc(var(--body)*.64);
 margin:26px auto 0;line-height:2;padding-top:20px;border-top:var(--rulew) solid var(--rule)}
.about .meta2 a{color:var(--accent);border-bottom:var(--rulew) solid var(--gold)}

.more{display:block;margin:40px auto 0;font-family:var(--display);font-size:calc(var(--body)*.8);
 color:var(--muted);background:none;border:var(--rulew) solid var(--rule);border-radius:5px;
 padding:11px 26px;cursor:pointer}
.more:hover{color:var(--accent);border-color:var(--gold)}
.foot{max-width:var(--measure);margin:50px auto 0;padding-top:24px;
 border-top:var(--rulew) solid var(--rule);text-align:center;
 font-size:calc(var(--body)*.6);color:var(--muted);line-height:2}
.none{text-align:center;color:var(--muted);padding:50px 0;font-size:calc(var(--body)*.8)}
.back{display:block;max-width:var(--measure);margin:0 auto;padding:14px 0;
 font-family:var(--display);font-size:calc(var(--body)*.75);color:var(--accent)}
</style>
</head>
<body>

<div class="tools">
 <a href="tahrir.html" id="ctrl" class="compose hide"><button aria-label="لوحة التحكّم">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
   stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/>
   <circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/>
   <circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"/>
   <circle cx="8" cy="18" r="2" fill="currentColor" stroke="none"/></svg>التحكّم</button></a>
 <a href="tahrir.html#new" id="compose" class="hide"><button aria-label="مدخل جديد">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
   stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>اكتب</button></a>
 <button id="gear" aria-label="إعدادات القراءة">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
   <circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>
  </svg>القراءة</button>
</div>

<div class="owner hide" id="owner">
 <span>أنت في <b>وضع المالك</b> — ترى أزرار التحرير والمسوّدات.</span>
 <button id="asreader">عرض القارئ</button>
</div>

<div class="panel" id="panel">
 <div class="prow"><span class="plabel">حجم النصّ</span>
  <div class="seg"><button data-a="sc" data-v="down">أ−</button><button data-a="sc" data-v="up">أ+</button></div></div>
 <div class="prow"><span class="plabel">الإضاءة</span>
  <div class="seg"><button data-a="theme" data-v="light">نهاريّ</button><button data-a="theme" data-v="dark">ليليّ</button></div></div>
 <div class="prow"><span class="plabel">التباين</span>
  <div class="seg"><button data-a="contrast" data-v="normal">عاديّ</button><button data-a="contrast" data-v="high">عالٍ</button></div></div>
 <div class="prow"><span class="plabel">الوضوح</span>
  <div class="seg"><button data-a="clarity" data-v="normal">عاديّ</button><button data-a="clarity" data-v="high">واضح</button></div></div>
 <div class="prow"><span class="plabel">الألوان</span>
  <div class="seg"><button data-a="color" data-v="full">ملوّنة</button><button data-a="color" data-v="plain">محايدة</button></div></div>
 <p class="pnote">تعمل الأربعة مجتمعةً أو منفردة. «الوضوح» يكبّر الخطّ ويثخّن الفواصل ويُلغي تلاشي النصّ المقصوص.</p>
</div>

<div id="app">
 <header class="mast" id="mast"></header>
 <div class="forms" id="forms"></div>
 <div class="search">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
   stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
  <input id="q" type="search" placeholder="ابحث…" aria-label="بحث">
 </div>
 <p class="hits" id="hits"></p>
 <main id="stream"><p class="none">…</p></main>
 <button class="more" id="more" style="display:none">المزيد</button>
</div>

<footer class="foot" id="foot"></footer>

<script src="render.js"></script>
</body>
</html>
