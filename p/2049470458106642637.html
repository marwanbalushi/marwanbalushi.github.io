<script>window.__ENTRY__={"id": "2049470458106642637", "t": "عَلَمٌ صغيرٌ وقبضةٌ مرتعشة، \"وإن تعبت في مرادها الأجسام\".. ربّما هي الأرواح كباراً حين تسعدُ.\nربّما رفعته من قبل.. مرّةً لسلطانٍ بنى الوطن من حكمته ومضى، والوطن بإنسانه يحمل اسمه كما تحمل الأرضُ بذرتها في جوفها..\nومرّةً لسلطانٍ جاء فكانت خطوته تعرف شأنها، معتدّةً بذاتها، عليّةً بمقامها..\nوبين الرفعتين سنواتٌ عاشتها هذه المرأة على كرسيٍّ لم يُقعدها لأنّ أصل الروح أن تنتصب وإن خار الجسد.\n\nوطفلٌ يحفظ المشهد بعينين.. لم تتعلّما بعد أن يُفرَّق بين اللحظة والتاريخ وهذا هو الأجمل فيهما.\nالطفل لا يُؤوّل ولا يُحلّل، يرى بانتباهٍ فقط، ويحتفظ بما يراه في مكانٍ أعمق من الذاكرة.\n\nومن بعيد، عبر الحشد الذي يضجّ ويصمت في آنٍ،\nامتدّت يدٌ عزيزة ملوّحةً؛ تحيةً للإنسان، مستبشرةً بغدٍ أجمل.. كانت تكتب في الفضاء طمأنينةً لما لا يحسن اللسان تهجئته.\n\nالجولة السلطانية السامية تنعكس مساراتها في محاجر العيون وتحفظها الذاكرة في خزائن القلب.\nهي تلك اللحظة حين تسقط كلّ الوساطات؛\nالوزارات والتقارير والأرقام والأنفوجرافيك الأنيق،\nويجد إنسانٌ إنساناً دون أن يكون بينهما شيءٌ سوى مسافة الثقة..\nالقائد الذي يصل إلى الناس.. يقرأ ما لا تكتبه التقارير،\nوالشعب الذي يبادر قبل أن يُدعى يخبره بما لا تبلغه المقابلات الرسمية.. جميعنا هنا، وبك نثق ونطمئن.\n\nوعودةً إلى عيني هذه المرأة ذاكرةٌ ثقيلة غير مرويّة عاشت دولةً تُبنى، ورجلاً يبنيها، وأمانةً تُسلَّم في هدوءٍ يشبه النهار حين يورث الليلَ ضوءه..\nوها هي تبادر ثانيةً كأنّ الوفاء لا يحتاج قراراً في كلّ مرّة.. يأتي من تلقاء نفسه كما يأتي النَّفَس.\n\nجيلٌ أوفى السلطان (#قابوس) فأحسن تربية جيلٍ يخلص للسلطان (#هيثم)،\nلأنّ #عُمان لا تبدأ من جديد، هي تتعمّق.\n\nإنّه الطفل الذي شهد اليوم.. لن يتذكّر الكلمات سيتذكّر الشعور، وهذا أبقى!", "d": "٢٩ أبريل ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/ext_tw_video_thumb/2049470354301841408/pu/img/iyEd1iaLf2ruLvNy.jpg", "f": "2049470458106642637-iyEd1iaLf2ruLvNy.jpg", "v": true, "vf": "2049470458106642637-5Q6vv4r-jGxLBqkS.mp4"}], "iso": "2026-04-29"};</script>
