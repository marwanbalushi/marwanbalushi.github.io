<script>window.__ENTRY__={"id": "1716150149150544169", "t": "استحضاراً للمواقف العُمانية الراسخة، وثباتها الصادق في القضية الفلسطينية؛ من خطاب السلطان #قابوس_بن_سعيد - طيّب الله ثراه- في العيد الوطني التاسع 1979:\n(فليس #السلام وحده هو المهدد بالخطر، بل أن الخطر يكمن في عدم إصلاح الأخطاء التي ارتكبت بحق #الشعب_الفلسطيني، وعدم وضع نهاية للآلام والمصائب التي حلت به وهذه حقيقة يجب أن يعترف بها العالم وأن يعمل على إيجاد تسوية تعيد للشعب الفلسطيني كامل حقوقه وتحفظ له کرامته.\nفلا عناد إسرائيل وتصلبها وتحديها لإرادة الأمم المتحدة ولا الأعمال المؤذية التي يقوم بها أولئك الذين يرون أن من مصلحتهم استمرار هذا الوضع يجب أن تقف في سبيل تحقيق هذا الهدف، ولذا فإن #عُمان تعلن بصراحة أنها ستؤيد بقوة أية مبادرة بناءة يقوم بها أي زعيم عربي أو أي زعيم آخر من شأنها أن تؤدي إلى تحقيق هذه الغاية.)", "d": "٢٢ أكتوبر ٢٠٢٣", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/ext_tw_video_thumb/1716148091425021952/pu/img/mGqI6MEM7cGpGT1Q.jpg", "f": "1716150149150544169-mGqI6MEM7cGpGT1Q.jpg", "v": true, "vf": "1716150149150544169-cYWCx7TwTUGvTcpw.mp4"}], "iso": "2023-10-22"};</script>
