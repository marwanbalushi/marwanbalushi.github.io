<script>window.__ENTRY__={"id": "2047182077905522863", "t": "بعض البيوت لا تُبنى للسكن.. تُبنى لتحتضن زمناً بأكمله،\nمنزل #الشيخ_علي_بن_زاهر_الهنائي طيّب الله ثراه في #المضيبي.. واحدٌ من تلك.\n\nبناءٌ أبيضُ يشدّ الناظر إليه بوقار..\nفي طابقه العلوي زخارف منقوشة؛ تمرّ من بين ثقوبها الريحُ برفق، كأنّ البيت يتنفّس.\n\nكان أكثر من مسكن، فيه #البرزة؛ المجلس الذي كان يلتقي فيه الشيخ الناس، يسمع ولا يعجّل، وينصف ولا يغلق بابه على أحد..\n\nورائحة (بنّ) القهوة العربي لا تفارق البرزة.. تستقبل الداخل قبل أن يستقبله أحد..\nكان الصغار يجلسون في أطرافه يرقبون، ولا يدرون أنهم يختزنون.. حيث ما يراه الطفل في مكانٍ كهذا يصبح يوماً ذخيرة عمر..\nوكم تشرّب من هذا الفضاء الحيّ من وُلد بعيداً بين نخيل #الغافات؛ أبناؤه وأبناء إخوته الذين تسرّبت إليهم رائحة المضيبي ذات زيارة.. فما وجدوا عنها فكاكاً، ومكثوا مدداً يحسبونها أياماً فإذا بها تنقش في القلب ما لا يُمحى.\n\nوعلى طرف زاوية شرقية يوجد #البخّار..\nحيث يبيت من اقتضت الأحكام إيداعه، حقّاً لا ظلماً..\nوبين هذا وذاك العسكر؛ رجال الوالي يذرعون المسافات من البرزة إلى البخّار؛ استدعاءً أو إيداعاً.. وكانت خطواتهم هي نفسها إيقاع الولاية ونبضها كل يوم.\n\nوبجانب البيت المهيب.. أُقيم مبنى البريد بعد حين.. صناديق صغيرة كانت تحمل أخبار الغائبين وأشواق المسافرين وكم من يدٍ فتحت صندوقها بقلبٍ معلّق تبحث عن خطٍّ مألوف، أو بطاقة مندوب (مجلّة ماجد)..\nوليس ببعيد سوى خطوات، هناك (شريعة فلج #الفرسخي).. تسمع دفقاته قبل أن تراه، يجري كما يجري الزمن مختالاً يستعذب العصافير وأصوات النساء وثرثرة العابرين.\n\nفي هذا الحيّز الصغير من المضيبي تتجاور ثلاثة أشياء لا تجتمع إلّا في الأماكن التي باركها الله؛ (بيت العدل، وصندوق الأشواق، وماء الفلج).\n\nاليوم يقف المنزل الأبيض بزخارفه.. شاهداً حاكياً إلى كلّ من أمعن النظر..\nإنّ أكرم البيوت تلك التي يبقى أثرها في القلوب بعد أن تغادرها الأقدام..\nوالفلج لا يزال يتمختر كأنه لم يسمع أن الزمن تغيّر.\n\nرحم الله الشيخ الجليل علي بن زاهر الهنائي، وبارك في كلّ من يحمل ذكراه.. أثراً وطِيباً.", "d": "٢٣ أبريل ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HGkNPkAaMAA9Z9B.jpg", "f": "2047182077905522863-HGkNPkAaMAA9Z9B.jpg", "v": false}, {"u": "https://pbs.twimg.com/media/HGkNPjxbAAA4Guj.jpg", "f": "2047182077905522863-HGkNPjxbAAA4Guj.jpg", "v": false}, {"u": "https://pbs.twimg.com/media/HGkNPkPaAAACKkr.jpg", "f": "2047182077905522863-HGkNPkPaAAACKkr.jpg", "v": false}], "iso": "2026-04-23"};</script>
