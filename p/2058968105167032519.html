<script>window.__ENTRY__={"id": "2058968105167032519", "t": "بَسطَ الحَجِيجُ رِمالَ التَّعبُّدِ في #مِنى، وارتقوا #عرفة خُضُوعاً وسُجُوداً لله هناك..\nوهنا في البعيدِ عنهُمُ، بَسطْتُ عِبادةً سَجّادةَ #أُمِّي..\nطَوَت ما كان بينها وبين الله،\nووضعَتْهُ في حقيبتي عامَ ٢٠٠٩،\nوهي تعرفُ أنّ المسافةَ ستطول.\n\nبريطانيا جميلةٌ شاحبةٌ في مطرِها،\nوأمريكا صاخبةٌ مضيئةٌ ولا تُدفِئُ،\nوسويسرا لا تنطقُ اسمي، تَعرفُنِي لَقَباً دِبلُوماسيَّاً..\nوكلّما بسطتُها في دولةٍ.. عرفتُ مَن أكون.\n\nحملتُها بين مساراتِ المطاراتِ وصباحاتِ المكاتبِ..\nأودعتُها صلواتٍ فائتةً وأخرى على عَجَل..\nوأكثرَ دعواتٍ مُبَلّلة.\n\nاصفرَّت.\nاهترأت.\nتآكلت في المواضع التي كثُر فيها السُجود..\nوهذا التآكلُ هو عمرُنا معاً.\n\nورحلَت.\nرحلت قبل أن أُخبرها.\n\nأُمِّي.. لا تعرفُ أنّ كلَّ صلاةٍ صلَّيتُها بعيداً عنها،\nصلَّيتُها فوقَ كَفَّيها وبين احتِواءَين.\n\nهَديَّتانِ من أُمِّي تُلازِماني.. اسْمِي وسَجّادَتُها.\nرحمها الله، وأسألك ربي أن تشفي أبي الغالي.", "d": "٢٥ مايو ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/ext_tw_video_thumb/2058967964829851648/pu/img/aloWzOuJw5kA_eEu.jpg", "f": "2058968105167032519-aloWzOuJw5kA_eEu.jpg", "v": true, "vf": "2058968105167032519-i7QW_dH1_E3g_VL6.mp4"}], "iso": "2026-05-25"};</script>
