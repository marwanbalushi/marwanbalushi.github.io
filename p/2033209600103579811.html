<script>window.__ENTRY__={"id": "2033209600103579811", "t": "\"كن أنت؛ عزيزاً !\nكن ابن أرضك، لا غيرك !\"\n..\nالمشهد الأول:\nالمنطقة تشتعل من أطرافها، والجميع يراقب ويُسمّي، لكن لا أحد يسأل: ما دورنا نحن؟\n\nالمشهد الثاني:\nيتجادل الجمهور على المقاعد: \"الآخرون يخطئون!\".. \"لا، نحن الصواب!\" \nوخشبة المسرح لا تزال فارغة، تنتظر من يصعد.\n\nالمشهد الأخير:\n(نحن لم نبنِ سرديةً لأنفسنا.. فملأنا الفراغ بسرديات غيرنا..\nواستعرنا منهم طريقة التفكير ذاتها.. صرنا نتجادل بأدواتهم، وننتصر لأفكارهم، ونظنّ أننا نتكلّم).\n\n(لا هذه تبني لك وطناً، ولا تلك تمنحك سيادة).\nوكأننا \"فلاديمير\" و\"إستراغون\"، ننتظر \"غودو\" الذي لن يأتي.....\n\nالستار (يهوي): والأوطان تقف خلفنا.. تنتظرنا نحن!\n .. \nمسرحية \"في انتظار غودو\" كتبها الأيرلندي \"صمويل بيكيت\" عام 1948، وتُعدّ أبرز أعمال مسرح العبث، تصوّر شخصيتين تنتظران شيئاً قد لا يأتي أبداً.", "d": "١٥ مارس ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HDdmkEDWEAAGitx.jpg", "f": "2033209600103579811-HDdmkEDWEAAGitx.jpg", "v": false}], "iso": "2026-03-15"};</script>
