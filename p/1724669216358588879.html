<script>window.__ENTRY__={"id": "1724669216358588879", "t": "📩 رسالة عُمانية 🇴🇲\nراسخون بمنطلقاتنا السياسية شجاعةً، منحازون للحقّ الفلسطيني قناعةً؛ فـ #الحياد_الإيجابي في وطني العزيز سلطنة عُمان ثابت لم يتغيّر، ودعوتنا إلى #السلام في كلّ المحافل ركيزة تستند عليها مواقفنا،\nلذلك فموقفنا من القضية الفلسطينية [تأصيل لذات الثابت ونفس الركيزة]،\nإنّ (البوصلة العُمانية لم تتغيّر ولن)، إنما #عدالة القضية منحت صوتنا وضوحاً، ورفع كلمتنا فصيحةً مبينة.\nوما كان لوطني العزيز أن [يخذل الشقيق أو الصديق]، ويتركه وحيداً يواجه #جريمة_إبادة_جماعية من قوات الاحتلال،\nفنحن اليوم نقف مع أهلنا في فلسطين \"تأكيداً لحقّهم في الحياة بحرّية وكرامة\" وفقاً لكل القوانين الدولية، والشرعية، والأخلاق الإنسانية التي اجتمعنا مع العالم على احترامها، والدفع بها لتصبح نظماً وأعرافاً ومعاملةً بين جميع الدول،\nومحاولة أي طرف لخرقها أو انتهاكها هي جريمة بحكم (القانون الدولي الإنساني).", "d": "١٥ نوفمبر ٢٠٢٣", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/ext_tw_video_thumb/1724669071562842113/pu/img/dlvIhuTnvjWhdm1Q.jpg", "f": "1724669216358588879-dlvIhuTnvjWhdm1Q.jpg", "v": true, "vf": "1724669216358588879-2hjGHEbqorwClwT-.mp4"}], "iso": "2023-11-15"};</script>
