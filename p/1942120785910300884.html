<script>window.__ENTRY__={"id": "1942120785910300884", "t": "كيف نُحسن التعامل مع المصابين بمرض #السرطان؟\n\nلسنا جميعاً أطباء أو إعلاميين،\nلكنّنا جميعاً نعرف شخصاً يمرّ بتجربة السرطان.. وفي كلّ كلمة نقولها، أثرٌ قد يبقى طويلاً.\n\nبإمكاننا تجربة التواصل #الإنساني بلطف ووعي مع من يمرّ هذه المرحلة الحسّاسة، بذلك؛ سأشارككم ملاحظات عامّة\n\nيتبع/1\n\nلطفاً؛ لا تبدأ بالأسئلة الطبية..\n\"أي مرحلة؟\"\n\"هل ينتشر؟\"\n\"الكيماوي صعب؟\"\n\nهذه الأسئلة ليست للاطمئنان، بل للتطفل، حتى لو لم تقصد.\n\nابدأ بسؤال بسيط: \"كيف حالك اليوم؟\"\nفما يهمه الآن.. هو (هذا اليوم فقط).\n\nيتبع/ 2\n\nلطفاً؛ لا تبالغ في الشفقة.. ولا في التحفيز المفرط.\n\nبعض العبارات مثل: \"الله يعينك\" أو \"أنت أقوى من المرض\" تبدو طيبة، لكنها في لحظات معينة تكون ثقيلة.\n\nكن طبيعياً.. (فالأُلفة تداوي أحياناً أكثر من الكلمات الكبيرة).\n\nيتبع/ 3\n\nلطفاً؛ احترم المسافة التي يحدّدها المريض.\nإن تحدّث.. استمع.\nوإن صمت.. لا تُحرجه بأسئلتك.\n\nوجودك الصامت.. قد يكون أعظم دعم.\n\nيتبع/ 4\n\nلطفاً؛ أعد النظر في لغتك..\nتوقّف عن ترديد:\n\"المرض الخبيث\"،\n\"المرض اللعين\"،\n\"الورم الوحش\".\n\nاللغة تصنع الصورة، والمريض أحق بصورة تُحفظ فيها كرامته، لا تُضخّم خوفه!\n\nيتبع/ 5\n\nماذا عن حديثنا #الرقمي؟\n\nأحياناً لا نُخطئ في تعاملنا المباشر مع المريض..\n\nلكننا نؤذيه من حيث لا ندري؛ حين نكتب عنه في منشور، أو نعلّق، أو ننقل خبراً بلا وعي.\n\nيتبع/ 6\n\nليس من حقنا أن نعلن عن مرض أحد دون إذنه.. حتى لو كانت النية طيبة.\n\n(الخصوصية ليست ترفاً، بل كرامة).\n\nيتبع/ 7\n\nعبارات مثل:\n\"حالته متدهورة جداً\"\n\"يصارع المرض\"\n\"لم يتبق الكثير\"\n\nقد تقتل الأمل، وتزيد الألم..\nهي ليست دعماً.. بل عبئاً.\n\nيتبع/ 8\n\nبدائلها أصدق وألطف..\n\n\"يمرّ بتحدٍّ صحي\"\n\"دعاؤكم له بالعافية\"\n\"نسأل الله له لطفًا ورحمة\"\n\nالكلمات اللطيفة لا تُكلّف، لكنها تُحدث فرقاً.\n\nيتبع/ 9\n\nلطفاً؛ لا داعي لتفاصيل العلاج في التعليقات:\n\n\"الكيماوي كسر جسده\"\n\"انتشر المرض في أنحاء جسده\"\n\"جربوا له الأعشاب وما نفعت\"\n\nالمنصّات ليست مكان الطب.. ولا سياق الفضفضة.\n\nيتبع/ 10\n\nحتى الصور..\n\nرجاءً؛لا تنشروا صور المريض وهو على سريره إلا بإذنه الصريح، حتى لو كان قريباً..\n\nفلكلّ شخص حقّه في صورته، كما له حقه في جسده.\n\nيتبع/ 11\n\nوفي الدعاء..\nلطفاً؛ ابتعد عن وصف المرض وكأنه عنوان للرثاء.\n\nيكفي أن تقول:\n\"اللهم اشفه شفاءً لا يغادر سقماً\"\n\"اللهم خفّف عنه ما لا نراه\"\n\nفالدعاء الجميل المقبول لا يحتاج مبالغة.. يكفيه الصدق.\n\nيتبع/ 12\n\nرجاءً؛ لا تجعل المرض هو كل الحكاية.. هو فقط جزء من حياته، ليس كلّها.\n\nلطفاً؛ تحدّث عن أشياء يحبها، مواقف مضحكة، خطط مستقبلية.\n\nذكّره بأنه إنسان يعيش.. لا مريض ينتظر.\n\nيتبع/ 13\n\nرجاءً؛ لا تقترح علاجات سمعتَ بها، وليس كلّ ما تقرأه مفيد، ولستَ الطبيب..\n\nلطفاً؛ تجنّب \"سمعتُ عن عشبة\"، \"قالوا في مستشفى بالخارج\"، \"جربوا الصيام\".\n\nدع له حقّ اختيار ما يناسبه.. وحقّ الراحة من هذه التوصيات المتعبة.\n\nيتبع/ 14\n\nكن سنداً صادقاً.. لا مصدراً للضغط.\n\nلطفاً؛ لا تكرّر: \"أنت قوي\"، \"اصبر\"، \"لا تنهار\".\nدعه يضعف قليلاً.. يحزن.. يسأل.\n\nقل فقط: \"أنا هنا.. على قَدْر ما تحتاج، لا أكثر ولا أقل\"!\n\nيتبع/ 15\n\nالتعامل مع مريض #السرطان لا يحتاج إلى لغة طبية،\nبل إلى وعي لغوي يحترم هشاشة اللحظة وكرامة #الإنسان.\n\nفالاحترام أصدق من الشفقة، والقرب اللطيف أعمق من العبارات الجاهزة.\n\nالتعامل مع السرطان لا يحتاج شهادة طب.. بل شهادة #قلب!!!", "d": "٧ يوليو ٢٠٢٥", "door": "الإسلام مرجعيّة", "dk": "marjieyah", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/GvPHBccXQAA7Lgy.jpg", "f": "1942120785910300884-GvPHBccXQAA7Lgy.jpg", "v": false}], "iso": "2025-07-07"};</script>
