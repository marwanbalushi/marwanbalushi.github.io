<script>window.__ENTRY__={"id": "2052029298479943954", "t": "دراسة حديثة للباحثين العُمانيين فاطمة الكاف ومريم البلوشية وعبدالله الهاشمي وسامي المقيمي ورشيد الحضرمي.. كشفت أن كتاب لغتي الجميلة للصف السابع يقدّم الفهم الحرفي والاستنتاجي على الفهم الناقد والإبداعي.\n\nعمل دقيق ومضنٍ، حلّل 792 نشاطاً لغوياً.. وهذا يعنيني مهنياً.\n\nالدبلوماسي يحتاج خمسة مستويات من الفهم القرائي؛\nالحرفي.. يقرأ البيان كما هو، وهذا أيّ موظف يفعله.\nالاستنتاجي.. يقرأ النيّة غير المعلنة، هنا يبدأ العمل.\nالناقد.. يزن الحجج ويكتشف التناقضات، حينها يتمايز المحترف.\nالتذوقي.. يفهم لماذا اختار الطرف الآخر كلمة دون أخرى، وهو الذكاء الثقافي.\nالإبداعي.. يصنع الحل من لا شيء، وهذه هي الدبلوماسية الحقيقية.\n\nالمدرسة التي تخرج منها متقناً للمستويين الأول والثاني فقط من الفهم القرائي.. تخرّج موظفاً يقرأ ولا يحلّل، وإن حلّل لا يبني.\n\nوكأنّ الفجوة لا تبدأ في العمل الدبلوماسي.. هي تبدأ في الصف السابع!", "d": "٦ مايو ٢٠٢٦", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [], "iso": "2026-05-06"};</script>
