<script>window.__ENTRY__={"id": "2032831895512219846", "t": "بكلّ محبّة ولطف.. إليك، وليّ/\n\nكثير منّا ليس صانع #الحروب، ولا صاحب #قرار في غرفها المغلقة.\nفلمَ نسلّم #الروح لدوّامة الأخبار والتوقّعات، ساعةً بعد ساعة، في يقظةٍ لا تنتج شيئاً ولا تبعد أذىً؟\n\nالقلق لا يوقف رصاصة، ولا يقرّب سلاماً، لكنه يسرق بهدوءٍ ما هو أغلى.. حضورنا الكامل في هذه الأيام المباركة من شهر #رمضان.\n\nهذه الأيام لا تنتظر هدوء الدنيا، فقد مرّت على المحاصَر والمريض والثكالى، ومن عرف سرّها.. وجد في قلبه فسحةً لا يدخلها خوف ولا يغلقها قلق.\n\nالخسارة الحقّة أن نفوّتها ونحن بعافية، بانشغالٍ عقيم لا يغيّر حرفاً على سطر، ولا يضيف قطرة نور إلى ما أعتم في صدورنا.\n\nفلا ندع #التشويش الخارجي يطغى على صفاء دواخلنا، ولندع أرواحنا تتنفّس هذه اللحظات.. فالأيام التي لا نحسن حضورها لن تعوّضنا عنها كثرة ما تابعنا على #الشاشات.\n\nمودتي", "d": "١٤ مارس ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HDYRHlZXcAAA0Ff.jpg", "f": "2032831895512219846-HDYRHlZXcAAA0Ff.jpg", "v": false}], "iso": "2026-03-14"};</script>
