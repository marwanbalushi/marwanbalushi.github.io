<script>window.__ENTRY__={"id": "2039684022809547007", "t": "سلطنة #عُمان تعرف أن #القضايا_العادلة تحتاج من يفهم حيثياتها الدقيقة، قبل أن يحملها موقفاً وبناءً دبلوماسيّاً.\n\nيُبنى الدبلوماسي العُماني بالمعرفة، لأنّ الموقف الذي لا يسنده عمق لن يصمد، فالمعرفة الرصينة هي العمود الفقري للدبلوماسي الذي يؤثّر حين يتكلم؛ هذا هو منهج #الأكاديمية_الدبلوماسية بوزارة @FMofOman، بقيادة العزيز السفير @humaidalmaani.\n\nاليوم، حوار معمّق مع صوتين أكاديميّين فرنسيّين يقاربان المدينة الفلسطينية #غزّة من الداخل الميداني والعمق الأكاديمي معاً.. \n\nالدبلوماسي والمؤرخ جان بيير فيليو.. أستاذ تاريخ الشرق الأوسط المعاصر، دخل قطاع غزّة في ديسمبر 2024 حين أُغلقت أبوابه أمام العالم، وأمضى فيه أكثر من شهر، ووثّق ما رآه في كتابه (مؤرخ في غزّة).. صوت يعرف هذه الأرض ويتحدّث لغة أهلها.\n\nلاتيتيا بوكاي، أستاذة علم الاجتماع السياسي، وعلاقتها بغزّة تمتد إلى ثلاثة عقود من البحث الميداني، وكتابها (غزة: أيّ مستقبل؟).. يطرح أسئلة السلام الأصعب بمنهجية من تذهب إلى عمق السؤال.\n\nإنّ الدبلوماسي الذي يغوص في طرح ''فيليو'' يكتسب لغةً ملموسة لما يجري على الأرض، ومن يتبصّر تحليل ''بوكاي'' يمتلك خريطةً لما قد يأتي.\n\nكلّ التقدير للسفير @HajlaouiNabil والأصدقاء في @FranceinOman، للتعاون المثمر مع الأكاديمية الدبلوماسية، حيث تلتقي الشراكة مع المعرفة، لتتجاوز البروتوكول إلى الأثر الأبقى!", "d": "٢ أبريل ٢٠٢٦", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HE5oPtWbwAAJIp_.png", "f": "2039684022809547007-HE5oPtWbwAAJIp_.png", "v": false}, {"u": "https://pbs.twimg.com/media/HE5oVu9bkAAszb_.jpg", "f": "2039684022809547007-HE5oVu9bkAAszb_.jpg", "v": false}, {"u": "https://pbs.twimg.com/media/HE5oyAdbkAEBmzh.jpg", "f": "2039684022809547007-HE5oyAdbkAEBmzh.jpg", "v": false}, {"u": "https://pbs.twimg.com/media/HE5o9BubEAAiCoN.jpg", "f": "2039684022809547007-HE5o9BubEAAiCoN.jpg", "v": false}], "iso": "2026-04-02"};</script>
