<script>window.__ENTRY__={"id": "1954899320395690132", "t": "مثقلين بيقينٍ أننا سنُسأل أمام الله سبحانه وتعالى عن هذا الصمت..\nفحين يسكت المراسل، ويخفت هتاف الملعب، وتتلاشى ضحكة الطفل..\nنعلم حينها أن الأرقام ليست إلاّ ستاراً يخفي وجوهاً وحكايات، هذا هو جوهر #أنسنة_الإعلام؛ أن نرى #الإنسان قبل الخبر.\n\nقتل الصحفيين والرياضيين والأطفال في غـــ🇵🇸ـزّة ليس صدفةً، ولا أضراراً جانبية متوقعة.. إنه فعل مقصود، يستهدف عيوناً ترى الحقيقة، وأصواتاً تحمل التعاطف إلى ما وراء السياسة، ووجوهاً تمثّل الغد في المدارس والملاعب.\n\nحين تُغلق هذه النوافذ معاً، يُترك العالم في فراغ بلا شهود، لتملأه رواية القاتل وحده، وتفلت الجريمة من الحساب.\n\nللأسف.. أن النتيجة واضحة وخطيرة؛ فراغ في المعلومات، تآكل في القانون، وتطبيع للاستثناء.. لتتشكّل بيئة إفلات مستدامة من العقاب.\n\nهذه هي [حرب إسكات الشهود] (Witness Silencing Warfare).. حرب لا تستهدف الأفراد فقط، بل تستهدف #الحقيقة ذاتها، وتضرب أساس #النظام_الدولي الذي يحمي المدنيين في النزاعات.\n\nولا نقول سوى.. لا حول ولا قوّة إلاّ بالله.", "d": "١١ أغسطس ٢٠٢٥", "door": "الإسلام مرجعيّة", "dk": "marjieyah", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/GyEykg7XwAAEjzd.jpg", "f": "1954899320395690132-GyEykg7XwAAEjzd.jpg", "v": false}], "iso": "2025-08-11"};</script>
