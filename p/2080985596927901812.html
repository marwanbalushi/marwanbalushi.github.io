<script>window.__ENTRY__={"id": "2080985596927901812", "t": "هو يمشي على عجلتين، وأنا على قدمين، والوصولُ واحد.\nهو يقرأ بأنامله، وأنا بعينيَّ، والحرفُ واحد.\nهو يُنصت بيديه، وأنا بأُذنيَّ، والحديثُ واحد.\nهو يقول ما يريد بلا صوت، وأنا بصوتي، والمعنى واحد.\nهو يتعلّم على مَهلٍ، وأنا على عَجلٍ، وفرحُ الوصول واحد.\nهو يرى العالَمَ بترتيبٍ يخصّه، وأنا بترتيبي، والدهشةُ واحدة.\n\nوبعضنا يحمل إعاقةً لا تراها العين.. ألمٌ مزمنٌ لا يظهر، ومعركةٌ في الداخل لا تُروى؛ هؤلاء أشدُّ حاجةً إلى أن نصدّقهم قبل أن نراهم.\n\nنحن متساوون.. لا فرقَ في الحقِّ ولا في الحلم.\nلكلٍّ بابُه إلى الحياة، والإعاقةُ الحقيقيّةُ ألّا نفتح كلَّ الأبواب.\nوحين تُفتح الأبوابُ حقّاً، تصير حَجَراً لا حِبراً؛\n\nفي مبناها الجديد، قصدت قيادةُ وزارة الخارجية (@FMofOman) الإنسانَ أوّلاً،\nفترجم مهندسون عُمانيّون هذا القصدَ إلى بناءٍ..\nبابٌ واحدٌ يسع الجميع، ومساراتٌ تنساب مستويةً، وإشارةٌ تُخاطِب العينَ حين يغيب الصوت، وحرفٌ ناتئٌ (Braille) تقرؤه الأنامل.\n\nحاجةٌ حُسِبت وافيةً منذ أوّل خطٍّ في المخطّط. فما تقوله القاعاتُ عن كرامة الإنسان، تراه العينُ في الجدران؛\nوهكذا صار البناءُ نفسُه بياناً: أنّ الوجهَ الذي نلقى به العالَمَ يتّسع، أوّلَ ما يتّسع، (لكلِّ مَن فينا).\n\nفي #السبت_البنفسجي.. نقف معاً، لا أحدَ فوق أحدٍ، ولا أحدَ خارج الصورة.", "d": "٢٥ يوليو ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HOEhrYPXAAA3kBH.jpg", "f": "2080985596927901812-HOEhrYPXAAA3kBH.jpg", "v": false}], "iso": "2026-07-25"};</script>
