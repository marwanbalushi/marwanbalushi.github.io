<script>window.__ENTRY__={"id": "2090302830380732508", "t": "كان للتقويمِ الهجري الورقي قيمةٌ غيرُ معرفةِ التواريخِ والأيّامِ..\nحينها المصادرُ شحيحةٌ علينا طلابَ الابتدائيّةِ في جلبِ حكمةٍ أو مقولةٍ أو معلومةٍ لقراءتها بالإذاعةِ المدرسيّةِ في طابورِ الصباحِ..\nفكان التقويمُ مصدراً لا ينضبُ لنقلِ ما نقرأُه.\n\nأقولُ هذا.. والمدارسُ مقبلةٌ على بدءِ عامٍ دراسيّ..\nوانحيازي للأنشطةِ المدرسيّةِ واضحٌ؛ فهي تصقلُ شخصيّةَ الطالبِ وتبني معرفةَ الطالبةِ بالتوازي مع العمليّةِ التعليميّةِ.\n\nكنّا نقلّبُ كلَّ ما تطولُه أيدينا من مجلّاتٍ وكتبٍ وكرّاساتٍ متهالكةٍ وحتّى التقاويمِ لنظفرَ بسطرٍ..\nواليومَ لا يشحُّ على الطالبِ سطرٌ، إنّما (قد) يشحُّ السؤالُ الذي يخرجُ منه.\n\nالذي يصنعُ التفكيرَ النقديَّ في النشءِ تدريبُهم على السؤالِ: لماذا اخترتُ هذا السطرَ دون سواه؟", "d": "٢٠ أغسطس ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HQI_WAqWEAAN22F.jpg", "f": "2090302830380732508-HQI_WAqWEAAN22F.jpg", "v": false}], "iso": "2026-08-20"};</script>
