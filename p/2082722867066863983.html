<script>window.__ENTRY__={"id": "2082722867066863983", "t": "في القرية #السويسرية الوادعة Simplon، حيث لا يتجاوز سكانها ثلاثمائة نسمةٍ، وعلى بُعدِ عشرةِ كيلومتراتٍ فقط من الحدودِ الإيطالية،\nتجد محطةً للوقود، من أقدمِ المحطات في سويسرا وربما أشهرِها، عمرُها نحو ثمانين عاماً.\n\nيقف الستينيّ Walter Escher عند رصيفِ محطتِه الهادئةِ وتُخومِ البساطةِ، يمنح المارّة وقوداً لسياراتهم، وذكرى تبقى في مخيّلتهم.\n\nمحطةٌ قائمةٌ على الثقةِ وحدها.. رجلٌ يراقب من نافذة بيته، ودفترٌ صغيرٌ يُدَوَّن فيه الدَّيْن.\n\nوعلى مساحةٍ لا تتجاوز مترين، تحوَّل الكشك الصغير إلى معرضٍ للفن، تُودِعُ فيه الأرواحُ المبدعةُ لمساتِها، فيغدو الوقود والجمال رفيقين في مكانٍ واحدٍ.\n\nيبتسم الزائرون حين يقفون أمام هذا المشهدِ العتيقِ، تلتقط عدساتهم لحظةً تختصر أصالةَ الأمكنةِ والدهشةَ، ويمضون وفي ذاكرتهم صورةٌ تحمل عبقَ الجبالِ ودفءَ الإنسانِ.\n\nقريةٌ صغيرةٌ تروي حكايةً كبيرةً عن الجمالِ حين يسكن التفاصيلَ.. البسيطةَ جداً.\n..\n\n\"تأمّلٌ مُستوحى\" من تقريرٍ لصحيفة NZZ السويسرية\nللصحفيّ: Matthias Summermatter\nالمصوّر: Alain Amherd", "d": "٣٠ يوليو ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HOdQnQAXoAApJXR.jpg", "f": "2082722867066863983-HOdQnQAXoAApJXR.jpg", "v": false}, {"u": "https://pbs.twimg.com/media/HOdQvWzWUAAyGX1.jpg", "f": "2082722867066863983-HOdQvWzWUAAyGX1.jpg", "v": false}, {"u": "https://pbs.twimg.com/media/HOdQvWzWkAALeHq.jpg", "f": "2082722867066863983-HOdQvWzWkAALeHq.jpg", "v": false}], "iso": "2026-07-30"};</script>
