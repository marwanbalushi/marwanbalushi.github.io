<script>window.__ENTRY__={"id": "1752679425211080831", "t": "في مقام العمل السياسي، وحرم دبلوماسية #السلام والتعاون بين الأشقّاء؛ تتعزّز العلاقات العُمانية التونسية منذ 1971م بإرادة القيادات الحكيمة، وفي لقاء أخويّ جمع معالي @badralbusaidi ومعالي @MfaNabilAMMAR\nتوافقت وجهات النظر المشتركة، وتوحّدت الرؤى لما فيه صالح البلدين.\n\nوفي سياق ليس ببعيد؛ انفرطتُ المحبّة العُمانية في #تونس من قلب الشاعر/ عثمان السعدي: \nلتونسَ وجهٌ كصبح البراءة\nيغري التحايا بسيل الكلام\nفيجري خفيفاً لطيفاً إليها\nبوجه تغنّى بحب السلام\nلتونس وجهٌ يغري المرايا\nوتسبيحُ ماء ببطن الغَمَام\nلها كلُّ شيءٍ يثيرُ الجمالَ\nلها الحبُّ يُهدِي هديلَ اليمام\nبلادُ العلومِ ومهوى الغيومِ\nفجالَ الشعورُ بأحلى كلام", "d": "٣١ يناير ٢٠٢٤", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/GFLEpU0bQAAoFnS.jpg", "f": "1752679425211080831-GFLEpU0bQAAoFnS.jpg", "v": false}], "iso": "2024-01-31"};</script>
