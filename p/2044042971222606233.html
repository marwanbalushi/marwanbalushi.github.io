<script>window.__ENTRY__={"id": "2044042971222606233", "t": "في ١١ ديسمبر ١٩٧٣.. سلّم السيّد فيصل بن علي آل سعيد -رحمه الله- مندوب سلطنة #عُمان لدى @UN أمينَها العام \"كورت فالدهايم\"..\nهديّةَ السلطان الراحل #قابوس_بن_سعيد طيّب الله ثراه.\n\n\"دلّة\" القهوة العربية، من فضّة شُكّلت بالطراز التقليدي لمدينة #نزوى، في إطارٍ بأقواس \"بيت الجريزة\" في #مسقط.\nدلّة نزوى.. فلسفة حضارة عريقة السيادة.. ترى في #الضيافة أعلى درجات #الدبلوماسية.\n\nفي الطابق الرابع من قاعة المؤتمرات بالمنظّمة الدولية في #نيويورك؛ بقيت الدلّة هناك، تصل رسالتها للعالم؛\n”عُمان تحمّص المواقف بهدوء،\nوتسكب قهوتها محبّةً وسلاماً،\nوالباب لن يُغلق أبداً!”\n\nمن الأمثال الشعبية الخليجية..\n(البيت اِللّي ما فيه دلّة.. ما حَد يِنْدَلّه).\nيِنْدَلّه.. يستدلّ عليه أو يعرف طريقه.", "d": "١٤ أبريل ٢٠٢٦", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HF3mP3vakAARsA9.jpg", "f": "2044042971222606233-HF3mP3vakAARsA9.jpg", "v": false}, {"u": "https://pbs.twimg.com/media/HF3mP3BasAQDi8a.jpg", "f": "2044042971222606233-HF3mP3BasAQDi8a.jpg", "v": false}], "iso": "2026-04-14"};</script>
