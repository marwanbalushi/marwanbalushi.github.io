<script>window.__ENTRY__={"id": "2091465226227003523", "t": "للشاعر المصري أحمد جمعة\n..\nحذاء أبي على السجادة الحمراء\nيلتقط له الصمت صورة\nبينما يصفّق\nالفراغ..\n\nوضعت قدمي في حذائه\nكان على قياسي تمامًا\nلكنني لم أشعر بما كان\nيعانيه..\n\nلم أدرِ أن باطن الحذاء البالي كان ينخر عظامه\nمثلما يُهلك الرصيفُ النعلَ،\nكان الحذاء الوفي يتقن وجعًا بأكمله\nيخفيه أبي في قدميه،\nبروز الإبهام في جلد الحذاء المنبعح\nيشهد على وقوفه الطويل وهو يطرق الأبواب\nكي لا يعود إلينا بأبوّةٍ منكسرة.\n\nينتظر عند الباب كل فجر\nقدمَي أبي\nوكلاهما يئن من الخشونة،\nيغادر والظلمة تبتلع الرصيف،\nثم يعود والظلمة تدغدغها المصابيح القديمة\nوتفوح من ربطات الخبز ..\nرائحة عرقه\nورائحة عمره الذي بات باهتا.\n\nيواسيه في طريقٍ طويلٍ لطالما ظن أنه سينتهي\nقبل أن يعانق الراحة\nقبل أن يرى ابتسامات الرضا على وجوهٍ..\nأكلت ملامحه\nفي أرغفة من الصمت..\n\nما زالا يفكران معًا:\nهل تناولت زوجته الدواء؟\nهل أحضروا لطفلته مريول المدرسة لصفّها الأول؟\nهل نام ابنه مطمئنًا إلى أنه سوف يضمن له عند مديره وظيفه؟\n\nلكن إجابة القدر كانت أسرع من خطى الحذاء؛\nسقط مثل شجرة عتيقة في غابة منسية\nوحيدًا بين ظلمة السعي\nوفي جيبه ثمن يومه الأخير\nوفي قلبه وصايا لا يعرفها سواه..\n\nعاد الحذاء الوفي وحده إلى البيت دون أبي\nفي كيس بلاستيكي شفاف\nتسلمناه من الشرطي..\n\nاليوم أنتعل حذاءه بغصة؛\nأشواك السنين التي بذرها الشقاء في قدميه\nأزهرت في قدمي،\nأدركت متأخرًا\nكيف كان يحملنا على كتفيه قاطعًا عمره\nوهم يبتسم!", "d": "٢٣ أغسطس ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HQZgG1-W0AAp5Sm.jpg", "f": "2091465226227003523-HQZgG1-W0AAp5Sm.jpg", "v": false}], "iso": "2026-08-23"};</script>
