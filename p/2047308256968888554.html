<script>window.__ENTRY__={"id": "2047308256968888554", "t": "للأسماء أعمارٌ خالدة، لأن الاسم وعدٌ بأن يظلّ شيءٌ ما حيّاً.\n\nوخلف كلّ إعلان يضجّ بتصفيق القاعات؛ حراكٌ وطني وأروقةٌ لا تُروى وفيها يُصنع الحدث قبل أن يُعلَن،\nفي مسقط.. كان سعادة السيد سعيد بن سلطان البوسعيدي وكيل وزارة الثقافة والرياضة والشباب للثقافة يُحكم البنيان المفاهيمي للجائزة وثيقةً وثيقة وحجّةً حجّة،\nوفي باريس.. كانت سعادة السفيرة آمنة بنت سالم البلوشي المندوبة الدائمة لسلطنة عُمان لدى اليونسكو تُمهّد الطريق في تلك الأروقة التي لا تُفتح إلا لمن يعرف كيف يطرقها صبراً وثقةً ومعرفةً بخرائط القرار الأممي..\n(رجلٌ يبني في الداخل، وامرأةٌ تُرسّخ في الخارج.. والوطن يمضي بخطوةٍ واحدة تحمل بصمتيهما معاً.)\n\nوبالأمس جاء الإعلان، اتفقت منظمة اليونسكو أعلى هيئات الثقافة الإنسانية على أن تحمل اسم #السلطان_هيثم جائزةً لصون ما تنساه الأمم سريعًا وهي تمضي.. تراثها الحيّ، وذاكرتها غير المكتوبة، وتلك الخيوط الرقيقة التي تربط الإنسان بمن جاء قبله.\n\nوبعينٍ إستراتيجية.. يشهد العالم اليوم تنافساً محتدماً على النفوذ الناعم، والجوائز الدولية من أمضى أدواته رصيدٌ يتجدّد بتجدّد دوراتها، ويتّسع بتوسّع حضورها.\n\nكلُّ عامٍ تُمنح فيه هذه الجائزة تُعاد كتابة سلطنة #عُمان في سجلات الثقافة الإنسانية، وكلُّ مرشّحٍ يتقدّم إليها من أقاصي الأرض يُقرّ طوعاً بأن للتراث معياراً عُمانياً لما يستحق الصون والتقدير؛ معيارٌ بنته ثمانية عشر ملفاً مُدرجاً في سجلات الإنسانية، من البَرعة إلى البِشت.\nوهذا ما يسمّيه الاقتصاديون رأسَ المال، وما يسمّيه الدبلوماسيون نفوذاً وما تسمّيه عُمان، على عادتها، التزاماً.\n\nإنّ الأمم التي تصمد في الذاكرة الإنسانية هي التي آثرت يوماً شيئاً غير مرئيٍّ على شيءٍ مرئيٍّ؛ آثرت الروحَ على الحجر، والهُوِيَّةَ تلك الكلمة التي يسهل نطقها ويصعب حراستها على كلّ ما تصفّق له الأيام ثم تنساه.\n\nثلاثةٌ وعشرون عاماً بين وزيرٍ آثر التراثَ على ما هو أسرع وأبهج، وبين منظّمةٍ دوليةٍ قرّرت أن تحمل اسمه، وفي تلك المسافة الصامتة كامل السرّ..\n[جائزةٌ باسم السلطان هيثم، وفي الاسم كما في كلّ اسمٍ عظيم؛ تاريخٌ وسياسةٌ ووطن!]\n\n@OmanUNESCOfr\n@mcsy_om", "d": "٢٣ أبريل ٢٠٢٦", "door": "عُمان", "dk": "oman", "f": "waqfah", "m":
