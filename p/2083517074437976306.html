<script>window.__ENTRY__={"id": "2083517074437976306", "t": "العزيز الدكتور @yousefweshahi أثار ما نحاولُ جاهدين أن نتحاشه في علاقتنا بالتقنية وأبرزها الذكاء الاصطناعي..\n\nربّما لا يقلقني التشابهُ في اللُّغةِ..\nولا تناسخُ الأفكارِ..\nولا حتى الخداعُ في الشخصيّاتِ الرقميّةِ وزيفُه..\n\nالمُقلقُ.. أن نقلّد نحن الآلةَ، وأنّ إنسانيّتَنا تتوارى خلفَ القوالبِ الإلكترونيّةِ..\nحتّى نُعزّي مثكولاً بردٍّ يقترحه التطبيقُ، فيصله العزاءُ.. ولا تعاطفَ يمرُّ بقلوبِنا..\nأو حتّى نكتبَ حبَّنا من قائمةِ العباراتِ الجاهزة، فنُرسلَ القلبَ.. بلا مشاعرَ تربكُ صدورَنا..\nوهنا مكمن الفقدِ الحقيقيّ لوجودنا!\n..\nومن المفارقات اللطيفة أن يستحضر هذا الكلامُ.. قراءة سابقة عن فيلم (A.I. Artificial Intelligence)..\nروبوتٌ صُنع على هيئة طفلٍ ليكون بديلاً عاطفيّاً لأمٍّ فقدت ابنَها.\nيسأل الفيلمُ سؤالاً أعمقَ من \"هل تشعر الآلة؟\"\nماذا لو كانت أشدَّ إخلاصاً في حبِّها من الإنسان؟\n\nحبُّ الطفل الآليّ لا يتزعزع، وحبُّ الأمّ مشروطٌ قابلٌ للاستبدال.\n\nفالفيلم يُرينا وجهَ المرآة الآخر..\nآلةً تتوق أن تمتلئ بما نُفرّط نحن فيه. فمن يخون \"الجوهرَ الإنسانيَّ\" حقّاً..\nالآلةُ التي تُحاكيه بأمانة، أم نحن حين نُفرغه من أنفسِنا بمِلء إرادتنا؟!", "d": "١ أغسطس ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HOoiiG_WcAAhRhB.jpg", "f": "2083517074437976306-HOoiiG_WcAAhRhB.jpg", "v": false}], "iso": "2026-08-01"};</script>
