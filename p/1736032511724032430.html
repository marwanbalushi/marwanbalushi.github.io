<script>window.__ENTRY__={"id": "1736032511724032430", "t": "تصريح إعلامي لمعالي @badralbusaidi : زيارة جلالة السلطان المعظّم إلى #الهند تؤكد على متانة العلاقات الثنائية بين البلدين\n16 ديسمبر 2023\n\nفي إطار زيارة “دولة” يقوم بها حضرةُ صاحبِ الجلالةِ السُّلطان هيثم بن طارق المعظم ـ حفظه الله ورعاه ـ إلى جمهورية الهند الصديقة أكد معاليه على متانة العلاقات الثنائية بين سلطنة عمان وجمهورية الهند.\nوأضاف معاليه أن الزيارة شكلت مرحلة جديدة وإيجابية في تطور العلاقات التاريخية بين البلدين، وأنها عبّرت عن التزام مشترك من قبل البلدين بتعزيز التعاون على أسس عريقة من الصداقة والتبادل الثقافي والاقتصادي، فضلاً عن الصلات القائمة بين الشعبين الصديقين.\nووضّح معالي السيد أن لقاءات جلالة السلطان #هيثم_بن_طارق المعظم- حفظه الله – مع فخامة الرئيسة دروبادي مورمو ودولة رئيس الوزراء ناريندرا مودي، أكدت على التعاون الملموس والذي يركز على توجهات البلدين نحو المستقبل، وأولويات التعاون المتمثلة في الاقتصاد والتكنولوجيا والطاقة والتجارة والاستثمار.\nمشيراً معاليه إلى أن الزيارة اعتمدت رؤية مشتركة حددت عدة مجالات أساسية للتعاون، تشمل رغبة البلدين في إبرام اتفاقية شراكة اقتصادية شاملة، وكذلك تعزيز التعاون في مجالات الأمن البحري ومكافحة الإرهاب وتقنيات الفضاء ومجموعة واسعة من الأبحاث والتدريب والتبادلات الثقافية بينهما.\nوأعرب معالي السيد وزير الخارجية عن ترحيب سلطنة عُمان بهذا التعزيز الكبير للعلاقات مع الهند والذي سيسهم بشكل كبير في استقرار وأمن منطقة المحيط الهندي، وفي تحقيق أهداف التنمية الاقتصادية المستدامة لمنفعة البلدين والمنطقة.", "d": "١٦ ديسمبر ٢٠٢٣", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/GBegOLwWsAEl4Kx.jpg", "f": "1736032511724032430-GBegOLwWsAEl4Kx.jpg", "v": false}], "iso": "2023-12-16"};</script>
