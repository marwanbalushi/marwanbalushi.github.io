<script>window.__ENTRY__={"id": "1761264647112434104", "t": "في لقاء لسعادة @KhalifaAlharthy مع @WAFA_PS الفلسطينية:\n\n(ما يجري في قطاع غزة هو #إبادة_جماعية يجب أن تتوقف)\n(العلاقات الفلسطينية العمانية مستقرة وقائمة على التعاون والدعم العماني المطلق للشعب الفلسطيني وقضيته)\n..\nرام الله 23-2-2024 وفا- أكّد وكيل وزارة الخارجية العمانية للشؤون السياسية خليفة بن علي الحارثي ضرورة التزام العالم بمسؤولياته الأخلاقية والقانونية لوقف قتل الفلسطينيين غير المبرر وغير المشروع، مشيراً إلى أن ما يجري في قطاع غزة هو إبادة جماعية يجب أن تتوقف.\nوشدد الحارثي في حديث لبرنامج \"مع رئيس التحرير\" عبر تلفزيون فلسطين، أن بلاده مستمرة في الضغط باتجاه إقامة دولة فلسطينية مستقلة، حيث أصدرت وزارة الخاريجة العمانية بيانات شديدة اللهجة تنتقد ما تقوم به اسرائيل من قتل للفلسطينيين، كما شاركت في الكثير من الاجتماعات والمؤتمرات العربية والاسلامية وأوضحت موقفها بصوت عال تجاه ما يجري في الاراضي الفلسطينية، لافتاً أن الشارع العماني نظم العديد من المظاهرات المنددة بما يتعرض له الشعب الفلسطيني.\nوأوضح الحارثي أن تغير مواقف بعض الدول التي كانت تؤيد اسرائيل في بداية العدوان يأتي نتيجة الحراك الذي يقوده الرئيس محمود عباس والدول العربية عبر التوضيح للعالم بأن ما يجري في فلسطين نتيجة الاحتلال المستمر في الاراضي الفلسطينية\nولفت إلى التنسيق بين الدول العربية كافة ومع القيادة الفلسطينية بقيادة الرئيس محمود عباس، مبيناً أن هذه الجهود المشتركة من أجل إيصال الموقف الفلسطيني للعالم، والتأكيد أن المشكلة تكمن بوجود الاحتلال وأن الحل بإقامة الدولة الفلسطينية المستقلة.\nوفيما يخص التحريض الاسرائيلي ضد وكالة غوث وتشغيل اللاجئين \"أونروا\"، أعرب الحارثي عن أسفه حيال استجابة بعض الدول المانحة لاسرائيل، والتي قامت بإيقاف مساهماتها \"للأونروا\" نتيجة الاتهامات الاسرائيلية غير الموثوقة، مندداً بالتجاوب التلقائي السريع مع هذه الاتهامات قبل التأكد من صحتها.\nووجه الحارثي التحية لدولة جنوب إفريقيا التي رفعت دعوى ضد اسرائيل في محكمة العدل الدولية مما جعل اسرائيل عارية أخلاقياً أمام العالم، وسبب الاحراج لمؤيديها وهذه  سابقة، مشدداً على ضرورة استمرار محكمة العدل الدولية والأمم المتحدة بإنصاف الحق الفلسطيني وتعرية الموقف الاسرائيلي.\nولفت الى التحول الكبير في مواقف شعوب الدول الغربية والرأي العام، وخير مثال على ذلك مواقف الجامعات الأمريكية التي نظمت مظاهرات وحملات مقاطعة وقامت بالضغط على أعضاء الكونغرس والمطالبة بضرورة حصول الفلسطينيين على حقوقهم.\nوأكد الحارثي أن هناك الكثير من القرارات التي تخص القضية الفلسطينية أحدها في الجانب المالي. وقال: \"الكل يدرك أن فلسطين بأمس الحاجة إلى الدعم السياسي والمالي\"، وأضاف: \"نحن في عُمان نساهم بما لدينا في دعم صمود الشعب الفلسطيني، وهذا الدعم لا زال مستمراً\".\nوبين الحارثي أن العلاقات الفلسطينية العمانية مستقرة وقائمة على التعاون والدعم العماني المطلق للشعب الفلسطيني وقضيته.", "d": "٢٤ فبراير ٢٠٢٤", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/GHFE2qxX0AAwlqD.jpg", "f": "1761264647112434104-GHFE2qxX0AAwlqD.jpg", "v": false}], "iso": "2024-02-24"};</script>
