<script>window.__ENTRY__={"id": "1693672230192824700", "t": "1/\nونحن على أعتاب #العام_الدراسي_الجديد\nأستحضر من ذاكرتي وأنا في الصف الأول الابتدائي في #المضيبي، كان لي دفتران؛\nدفتر أكتب فيه الواجبات، الحروف والأرقام من 1-10\nودفتر لا أحضره للمدرسة، أقلّد زميلي بالطاولة (ابن معلمنا) وأكتب فيه من 1-100\nانتهى العام، وحصلت المركز الأول على الصف.\n\n2/\nفي الأول ابتدائي بدأتُ تهجئة كلمات مجلة #جند_عُمان وتصفّحها، كان أبي عافاه الله يجلبها لنا من العمل، ولاحقاً تجرّأتُ على قراءة الجمل في كتاب بيان الشرع (رغم عدم إدراكي الكامل للمحتوى).\nوبدأتُ (بواسطة أخي) في الإذاعة المدرسية، وأذكر قرأتُ سورة التين (رغم أنها في مقرر صف متقدّم)\n\n3/\nواصلتُ من الأول ابتدائي في الإذاعة المدرسية وأصبحتُ رئيس الجماعة لعدة سنوات وحتى الثالث الثانوي.\nكانت لي مشاركات في جماعة المسرح، وأذكر تقديم الاحتفالات بمناسبة العيد الوطني في @muhnna6301\nوبالتعاون مع @owa_almudhaibi @almudaibi_club @almudhibischool\nفكانت الأنشطة مصنع شخصيتي!\n\n/4\nأكتب هذا لأعلي صوتي..\n\nأن #المدرسة ليست كرّاس وقلم فحسب؛ وإنما تنشئة وتربية، تعليم ومعرفة، بناء إنسان وارتقاء بوطن.\n\nوأستعرض بعض تجاربي للتأكيد أن (حلم الطفولة.. واقعٌ في الكبر).\n\nالمدرسة.. هي الخندق الأول لصون #الوطن، وهي #الأمل!", "d": "٢١ أغسطس ٢٠٢٣", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/F4Eh6WiXAAAY2e6.jpg", "f": "1693672230192824700-F4Eh6WiXAAAY2e6.jpg", "v": false}, {"u": "https://pbs.twimg.com/media/F4Eh7EbW0AEo0wz.jpg", "f": "1693672242645737769-F4Eh7EbW0AEo0wz.jpg", "v": false}, {"u": "https://pbs.twimg.com/media/F4Eh7EhWIAAiUlM.jpg", "f": "1693672242645737769-F4Eh7EhWIAAiUlM.jpg", "v": false}, {"u": "https://pbs.twimg.com/media/F4Eh71AXEAATsmK.jpg", "f": "1693672255081857133-F4Eh71AXEAATsmK.jpg", "v": false}, {"u": "https://pbs.twimg.com/media/F4Eh71FXwAATPR2.jpg", "f": "1693672255081857133-F4Eh71FXwAATPR2.jpg", "v": false}, {"u": "https://pbs.twimg.com/media/F4Eh8j1WsAAElaO.jpg", "f": "1693672268029714730-F4Eh8j1WsAAElaO.jpg", "v": false}], "iso": "2023-08-21"};</script>
