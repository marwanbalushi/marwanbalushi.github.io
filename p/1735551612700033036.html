<script>window.__ENTRY__={"id": "1735551612700033036", "t": "معالي @badralbusaidi: زيارةُ جلالة السُّلطان المعظّم إلى #سنغافورة مرحلةٌ جديدةٌ من التعاون\n\nأعرب معاليه عن أهمية وقيمة زيارة حضرة صاحب الجلالة السلطان #هيثم_بن_طارق المعظّم- حفظه الله –  إلى جمهورية سنغافورة، مشيراً إلى أن هذه الزيارة تعكس العلاقات القوية والصداقة العريقة بين سلطنة #عُمان وسنغافورة.\nحيث إن المحادثات التي جرت بين حضرة صاحب الجلالة والقيادة السنغافورية تمحورت حول تعزيز التعاون الثنائي في مجالات متعددة بهدف تحقيق مستويات أعلى من الازدهار الاقتصادي للبلدين في القرن الحادي والعشرين.\nوأكد معاليه أن هذه المحادثات تتماشى مع رؤية عمان 2040، حيث تعتمد سلطنة عمان على قواعد التجارة الحرة وتشجيع القطاع الخاص وتعزيز التعاون الدولي لتحقيق تنمية اقتصادية مستدامة.\nوأضاف بأنه تم التركيز خلال الزيارة على عدة مجالات رئيسية للتعاون المستقبلي بين البلدين، بما في ذلك تطوير وتطبيق التكنولوجيات الجديدة، وتعزيز الشركات الناشئة والمؤسسات الصغيرة والمتوسطة، وتطوير المدن الذكية والمناطق الحرة، وتعزيز التعليم وتبادل المعرفة والتكنولوجيا، وتعزيز التعاون في المجالات الصحية والسياحية وغيرها.\nوأشار معاليه إلى أن الزيارة كانت فرصة قيمة لمناقشة التحديات العالمية الراهنة وتأكيد التزام البلدين المشترك بالتعاون الدولي وسيادة القانون الدولي، ودعم #الحوار الشامل كوسيلة لحل النزاعات الدولية.\nوختم معالي السيد تصريحه بالتأكيد على أن زيارة حضرة صاحب الجلالة السلطان إلى سنغافورة قد أطلقت مرحلة جديدة من التعاون الاستراتيجي بين البلدين والشعبين، ومن المتوقع أن تسهم هذه العلاقات القوية في تعزيز التطور الاقتصادي والاستثماري بين البلدين، إلى جانب تعزيز الروابط الدبلوماسية والثقافية بينهما.", "d": "١٥ ديسمبر ٢٠٢٣", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/GBXq_VTWkAANTM7.jpg", "f": "1735551612700033036-GBXq_VTWkAANTM7.jpg", "v": false}], "iso": "2023-12-15"};</script>
