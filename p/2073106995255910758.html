<script>window.__ENTRY__={"id": "2073106995255910758", "t": "حين تجلس إلى شيخِ الضوء.. العزيز @rahman_alhinai \nلا تشعر أنّك أمام قنّاص الدهشة.. الكاميرا هناك، لكنّها منسيّةٌ في زاويةٍ غير ملحوظة.\n\nتلتقيه، فيبدأ بالقهوة وبالسؤال: كيف الوالد، كيف جاء المطر هذا العام، هل رجع المركب، هل جنيتم الحصاد.\n\nيصغي إليك.. يصغي أطولَ ممّا يصغي رجلٌ جاء ليأخذ صورة..\nهو لا يريد وجهك.. يريد اللحظة التي تنسى فيها وجهك وتطمئنّ إليه.. عُمانيٌّ يعرف وطنه، يفهم القريةَ كما يفهم المدينة.\n\nفإذا أمسك الزمن حينَ ضحكةٍ ما حسبتَ لها، أو شرودٍ نحو شيءٍ بعيد، رفع الكاميرا بلا توقّع.. نقرةٌ واحدة أو نقرتان.. ثم يعود إلى قهوته كأنّ شيئاً لم يكن.\n\nولهذا تصدّق صورةَ الرجل حين تراها..\nصيّادٌ من الساحل، الملحُ في يديه والشمسُ في تجاعيده،\nأو مزارعٌ بين جبلٍ ووادٍ، ابتلّ الطينُ بعرقه.. والفلجُ لم يدخل الإطار، والسواقي لم تجفّ بعدُ.\n\nتعود إلى الصورة بعد سنة، فتجده يعرفك.. يبتسم لك وحدك.\n\nثم يحكي.. مَن هو، ومن أيّ ساحلٍ أو وادٍ، \nوالكلمةُ التي كسر بها حرجه: \"الوالد.. خلّك على طبيعتك\".\n\nالرجلُ ضحك يوم التُقِطت الصورة، وأنت تضحك الآن وأنت تسمع، والصورةُ بينكما.\n\nهكذا يكبر الناسُ في عينيك، واحداً واحداً، حتى تعرف ضحكاتِهم قبل أسمائهم.\n\nوكثيراً ما ينسى الكاميرا كلَّها، فيجلس كما يجلس الأصدقاء، والحديثُ يطول حتى يؤذّن المغرب، أو ينبّهه موعدٌ ينتظر.\n\nحِرفةٌ بمعايير مصوّرٍ دوليّ، وروحٌ بسمتٍ عُمانيّ.. من مجلس الشيخ الجليل علي بن زاهر الهنائي -طيّب الله ثراه- عرف أنّ الإنسان يُعرَف قبل أن يُصوَّر، وورث البابَ مفتوحاً.. كرماً وترحيباً.", "d": "٣ يوليو ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/amplify_video_thumb/2073106877110431744/img/sm4BzJYES7eaWtkq.jpg", "f": "2073106995255910758-sm4BzJYES7eaWtkq.jpg", "v": true, "vf": "2073106995255910758-PHoOwxdi9C-jsOH_.mp4"}], "iso": "2026-07-03"};</script>
