<script>window.__ENTRY__={"id": "2049048966843797599", "t": "خمسة عشر عاماً...\nكلّ يوم.. بلا كاميرا، بلا تصفيق، \nيشتري الأكياس من جيبه،\nويمشي إلى الشاطئ، ليعيد للأرض وجهها من الأجمل.\n\nالعمّ (عبدالله بن محمد مفتاح) من #بخاء\nلم يخطب يوماً عن حبّ الوطن، لكنه عاشه كل صباح على رمال #مسندم.\n\nحبّ الوطن لا يبدأ من المنصّات..\nيبدأ من المساحة الصغيرة التي بين يديك،\nمن الشاطئ الذي لا يراك أحد وأنت تنظّفه،\nمن الجيب الذي يدفع بلا حساب،\nمن القدم التي تمشي كلّ يوم لأن الأرض تستحق.\n\nالتأثير الحقيقي لمن يصنع في الخفاء، لا لمن يظهر مع الفلاش ثم يرحل.\n\nأيّها العمّ عبدالله..\nخمسة عشر عاماً من العطاء الصامت تساوي ألف خطاب عن المواطنة.\n\nرزقك الله الصحة والعافية وطول العمر،\nوجعل كلّ خطوة على ذلك الشاطئ نوراً يوم القيامة.\n\nوالشكر للأخ الكريم (مدرك الحسني) على أنه أضاء هذا المشهد، لأن من يُظهر هؤلاء الناس يشاركهم الأثر!", "d": "٢٨ أبريل ٢٠٢٦", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/ext_tw_video_thumb/2049048880072073216/pu/img/I_4_3g2ogFckZDxv.jpg", "f": "2049048966843797599-I_4_3g2ogFckZDxv.jpg", "v": true, "vf": "2049048966843797599-GD1zhr_1u1sP9lyo.mp4"}], "iso": "2026-04-28"};</script>
