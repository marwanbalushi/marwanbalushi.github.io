<script>window.__ENTRY__={"id": "2086028011980152950", "t": "حين تعلو   الأصواتُ من حولنا، تبقى #عُمان تُنصت إلى إيقاعها الخاصّ.. فالفنون حالةٌ إنسانيةٌ، تحمل رسائل عديدة.. والإشارةُ تكفي اللبيب.\n\nفما إن يشدو عمر جبران وعوض القعيطي (رحمه الله) من تخوم ظفار الخضراء بـ\"يا مكحل عيونه\" حتى يستيقظ المشهدُ كلُّه؛ فلا تكاد تُفرِّق أين تنتهي الخطوة، وأين يبدأ اللحن أصلاً.\n\nسرُّ #البرعة.. جمالٌ يُستعذب ويُهاب.\n\nتقرعُ الطبولُ إيقاعها العميق، فيعلو فوقه هتافُ الرجالِ في نصف الحلقة وتصفيقُهم، وشعرٌ يُغنّى بلهجة معروفة.\n\nونِّصالُ #الخنجرِ العُمانية في أيدي الرجالِ تُمزّقُ وجهَ الفراغِ رجولةً؛ فكلُّ نصلةٍ شقٌّ في العدم، وكلُّ قفزةٍ إعلانٌ أنّ الحيّزَ مأهولٌ بالشجاعة، وأنّ في الأرجاءِ كبرياءً لا يُطعَن.\n\nوكلما ارتقى النصلُ واشتدَّ وقعُ القدم، غنَّى الجسدُ مع الطبل. فنطرب.\n\nولعلّ أبدع ما في المشهد.. أنّ القفزةَ تهبط على الأرض فتُشعِل صداها، حتى يُخيَّل إليك أنّ الأرضَ نفسها تعزف من تحت الأقدام؛ إذا سمعتَ الطبلَ عرفتَ أهلَه، وإذا أبصرتَ الخطوةَ قرأتَ نسبَها.\n\nطبلٌ يُقرع، ونصلٌ يلمع، وأرضٌ تُوقِّع، وحنجرةٌ تعلو فوق ذلك كله..\n  \nفيغدو الأداء نسيجاً يُسمَع ويُرى في آنٍ واحد،\nوبها بقيت البرعة حيّةً في الذاكرة العُمانية،\nتحفظ في النصل شرفَه لا حدَّه؛ فروسيّةٌ تصون، وكرمٌ يستقبل، جيلًا بعد جيل.", "d": "٨ أغسطس ٢٠٢٦", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/amplify_video_thumb/2086023917764792320/img/Gqk8LUaZ8n1igD-E.jpg", "f": "2086028011980152950-Gqk8LUaZ8n1igD-E.jpg", "v": true, "vf": "2086028011980152950-WMS3vgqsrzoM0EZE.mp4"}], "iso": "2026-08-08"};</script>
