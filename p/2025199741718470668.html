<script>window.__ENTRY__={"id": "2025199741718470668", "t": "السياق:\nفي زمن يتسارع فيه النشر الإعلاني كما تتكاثر صور #العطاء عبر (الأفراد/المؤسسات/الدول)، وتتشابك الأزمات، يتقدّم سؤال #الإخلاص على سؤال الحجم.\n\nالقيمة:\nالخير قيمة تُقاس بالأثر وصون #كرامة الإنسان، وتبقى حين يخفت الضوء ويستمر العمل عبر الزمن.\n\nالاختبار:\nيتشابه #الرياء في جوهره، سواء صدر عن فرد يطلب ثناءً أو دولة تطلب موقعاً؛ كلاهما يختبر صدق المقصد.\n\nالمعيار:\nالقيمة تتحدّد بسلامة الاختيار واتّساق الموقف، ويجعل #الإنسان غايةً عليا، في التزامٍ يتجاوز ظرف اللحظة، ويعلو على استثمار الألم.\n\nالأثر:\nوحين يتقدّم الحقّ على الصورة، يتحوّل الدعم إلى #التزام إنساني ثابت فيترسّخ معه معنى الثقة، وتستقر الشرعية، وتطمئن السيادة.", "d": "٢١ فبراير ٢٠٢٦", "door": "الإسلام مرجعيّة", "dk": "marjieyah", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HBr0HQlWgAA1YxP.jpg", "f": "2025199741718470668-HBr0HQlWgAA1YxP.jpg", "v": false}], "iso": "2026-02-21"};</script>
