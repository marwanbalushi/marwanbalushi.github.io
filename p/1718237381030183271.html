<script>window.__ENTRY__={"id": "1718237381030183271", "t": "الاحتلال الثقافي والأدبي والفني.. استعمار وجداني، نظرية تشرح ما يحدث في وسائل الإعلام الكلاسيكية والجديد؛ \nPostcolonialism Theory. \nمما قيل عنها، ونقلته حرفياً:\n(ما بعد الاستعمارية هي الدراسة الأكاديمية للإرث الثقافي للاستعمار والإمبريالية، وهي تركز على التبعات البشرية لاستغلال السكان الأصليين في الأراضي المستعمرة والسيطرة عليهم وعلى أراضيهم، وتعتبر تحليلًا نظريًا نقدياً لتاريخ وثقافة وأدب وواقع القوى الاستعمارية الأوروبية.\nومن أهم منظّريها:\nفرانز فانون: طبيب ومفكر فرنسي من جزر المارتينيك كان ناشطاً سياسياً ومناصراً لثورة التحرير الجزائرية. \nإدوارد سعيد: ناقد أدبي وأكاديمي في جامعة كولومبيا الأميركية فلسطيني الأصل ولد في مدينة القدس وتوفي في نيويورك عام 2003. أحد أبرز المدافعين عن القضية الفلسطينية في الولايات المتحدة. \nغياتري سبيفاك: باحثة وناقدة أدبية هندية وهي أكاديمية في جامعة كولومبيا الأميركية.\nهومي بابا: أكاديمي هندي أستاذ الأدب الأميركي والبريطاني في جامعة هارفرد.)", "d": "٢٨ أكتوبر ٢٠٢٣", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/ext_tw_video_thumb/1718237324423929856/pu/img/Pz-oVrBAXNjwcayp.jpg", "f": "1718237381030183271-Pz-oVrBAXNjwcayp.jpg", "v": true, "vf": "1718237381030183271-QTWgk6atTV-2RPyR.mp4"}], "iso": "2023-10-28"};</script>
