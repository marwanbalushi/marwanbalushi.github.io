<script>window.__ENTRY__={"id": "2044782362538434846", "t": "في لقاءٍ ثريّ.. وحديثٍ عميق بين رفيق الجمال والشعر والزرقة (بو الأزد) الباحث الثقافي. علي بن سالم الرواحي وبين العزيز @N25Abdullah25 عن الهُوِيّة الوطنية،\nأجدني أمام طرح يستحق النشر والتعريف به.\n\nسلطنة #عُمان لم تبنِ حضورها في التاريخ بالغزو،\nإنّها صنعتها بالثقة والاستقلالية وحسن الجوار،\nوهذه ليست قيماً للماضي فحسب، بل هي خارطة طريقنا اليوم. \n\nأربعة آلاف عام لا تتّسع في خنجر أو دشداشة..\nهما جزء حقيقي من هُوِيّتنا،\nلكن حين يصبحان هما الهُوِيّة كلها في وعينا،\nنكون قد سطّحنا شيئاً عميقاً جداً. \n\nالخنجر يحمل خلفه آلاف السنين من الحرفة والجغرافيا والوجدان،\nفإذا أخذنا الشكل وتركنا هذا العمق، أخذنا القشرة وتركنا اللبّ.\n\nعُمان تعالت حضارياً بشيء أعمق من الشكل،\nبطريقة إدارة الماء وتوزيعه بعدل..\nفي بناء قلاعٍ صمدت لأنها بُنيت بنفس الروح التي بُني بها المجتمع..\nوفي هدوءٍ لم يُفسَّر يوماً ضعفاً. \n\nالهُوِيّة التي تختزل نفسها في المظهر تفقد أدواتها للمستقبل،\nوالجيل القادم لا يحتاج أن يرث رموزاً فقط، بل أن يرث طريقة تفكير. \n\nأمانتنا أن نسلّم أبناءنا هذا الإرث متجدّداً،\nفهم لا يُهدّدون الهُوِيّة، إنّهم استمرارها.", "d": "١٦ أبريل ٢٠٢٦", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HGCGuBObkAAmItR.jpg", "f": "2044782362538434846-HGCGuBObkAAmItR.jpg", "v": false}], "iso": "2026-04-16"};</script>
