<script>window.__ENTRY__={"id": "2077273574969102420", "t": "حَمَلَ العُمانيُّ في هِجرتِه ذاكرتَه وثقافتَه ووجدانَه وحياتَه على كفِّ الأمواجِ.. أَنزلها على ضِفافِ الماءِ العذبِ، وحَمَلَ في (سَحّارتِه) إيقاعاً.\n\nفي زنجبار ١٩٤٩ كانت عُمانُ تُقامُ كاملةً في دائرةِ رِجالٍ.. صفٌّ من دشاديشَ بيضاءَ، ومَلامحُ أناقةٍ عفويّةٍ.. بنادقُ وخناجرُ، كتّارةٌ وتُرسٌ وطبلٌ.. عصا خيزرانٍ وبيتُ شِعرٍ فارَقَ ساكنِيه.\n\nذَهَبتِ الرَّزحةُ في أجسادٍ مُهاجِرةٍ، وعادت في ذاكرةٍ مَوهونةٍ.. تُشفى بالحديثِ عنها.\n\nالرَّزحةُ العُمانيّةُ وطنٌ لا يَحتاجُ جغرافيا.\n\nأُعيدُ نشرَ المقطعِ.. لأنّ أرواحَهم العُمانيّةَ ما زالت تلُفُّ المشهدَ.. ولو من بعيدٍ. وهناك في سواحلِ أفريقيا اشتاقت (Mashamba) نسائمَ اللُّبانِ العُمانيِّ.\n..\nMashamba \nجَمعٌ بالسواحليّةِ لكلمةِ shamba\nوتعني مزرعة.", "d": "١٥ يوليو ٢٠٢٦", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/ext_tw_video_thumb/2077273461362163712/pu/img/Bg0KWOefVaK7BsNC.jpg", "f": "2077273574969102420-Bg0KWOefVaK7BsNC.jpg", "v": true, "vf": "2077273574969102420-oMY9kwfafrsEg9ET.mp4"}], "iso": "2026-07-15"};</script>
