<script>window.__ENTRY__={"id": "2032152537139126350", "t": "في ولاية #قريات.. البحر حين يحزن يشحب الأفق قليلاً، والموج يأتي صامتاً يلامس الشاطئ بلطفٍ حزين، كأنه يودّع شيئاً لن يعود.\n\nمن هناك جاء سعادة #عبدالله_بن_خلفان_البلوشي.. يحمل في صدره تلك الروح الوادعة التي نشأت بين صخور هادئة وأمواج تذهب وتعود في صمت، فالتقت روحه بروح المغفور له السيّد #فهد_بن_محمود آل سعيد في وزارة #الإعلام، حيث كانت الأيام بسيطة، والكلمات قليلة، والثقة بينهما عجينةُ سنواتِ عملٍ وصمتٍ مشتركٍ وإخلاصٍ لوطنٍ واحدٍ.\n\nثم جاءا معاً إلى #مجلس_الوزراء، يعيشان اليوميّ من القرارات الثقيلة، توجيه نافذ من هنا أو رأي صائب من هناك. \nكان سعادته قريباً دائماً، يمين سموّه، يفعل ما يجب بهدوء وبسمتٍ عُماني أصيل تجاه الرجل الذي آمن به، وفي تفاصيل الأيام، كان يخطّ بيده وبجمالية الخطّ العربي   ما يريد سموّه قوله، كأنّه يعرف ما في قلبه قبل أن يُقال.\n\nبعد الرحيل.. يسكن الأسى في قلبه برفق، كأنّه ضيف عرف الطريق ولم يحتَج إلى استئذان.. يتذكّر نظرة عابرة، أو تلك اللحظة حين كان يمسك القلم ليكتب ما يريد السيّد فهد أن يقوله في شأن لا يُؤتمن عليه إلا من عرف صاحبه، وكأنّ بين يديه وبين روحه خيطاً لا يُرى، ينقل ما لم يُقَل بعد.. ويتذكّر القمم التي حضراها معاً، حين كان سموّه يمثّل السلطان في مجالس تُرسم فيها خرائط المنطقة، وكان سعادته في الظل القريب يسمع ما بين الكلمات، ويحمل ما بعد الاجتماعات.. تلك اللحظات الفارقة صارت اليوم ذاكرة وطن قبل أن تكون ذاكرة رجل.\n\nتستيقظ كلّ اللحظات معه، يمشي معها في الممرات، وترافقه حين يحنّ إلى البحر خلف تلال القرم.. حيث الموج الصامت الذي يعود، يلامس القدم برفق، ثم ينسحب تاركاً في الروح شيئاً لا اسم له!", "d": "١٢ مارس ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/amplify_video_thumb/2032152341537783808/img/cinqvIz7WGmeleOZ.jpg", "f": "2032152537139126350-cinqvIz7WGmeleOZ.jpg", "v": true, "vf": "2032152537139126350--mt9TqNXJPJO4Wht.mp4"}], "iso": "2026-03-12"};</script>
