<script>window.__ENTRY__={"id": "2082367550751375839", "t": "يدٌ تعدّ المال، وخلف القضبان إنسانٌ هو الثمن؛ ضحيةٌ حُبِسَت.\n\nيبدأ كلُّ شيءٍ بإعلان وظيفةٍ مُغرٍ.. راتبٌ سخيّ، وتذكرةُ سفر، ووعدٌ ببدايةٍ جديدة.\n\nغير أنّ الحلم ينقلب فخّاً ما إن يصل صاحبه إلى بلدٍ بعيد؛ فيُقفَل عليه الباب، ويُصادَر جوازُ سفره، ويُحاط بالصمتِ والعتمة.\n\nيُجلَس مُجبراً أمام شاشةٍ ساعاتٍ طويلة، يقرأ نصّاً كُتِب له، ليوقِع إنساناً آخر في الفخّ نفسه؛\nومن قصّر عن بلوغ الحصّة المفروضة ناله الجوعُ والعزلُ والإيذاء.\n\nوهنا جوهرُ المأساة.. تُسلَب حُرِّيَّةُ الإنسان، ثم يُدفَع أداةً في سلب حُرِّيَّةِ سواه.\n\nجريمةٌ تُكرّر نفسها بيدَي ضحيّتها، وطُعمُها الأملُ ذاته.. ولأنّ شبكاتها عابرةٌ للحدود، أفرد لها العالمُ يوماً واحداً يوحّد جهودَ الدول في مواجهتها؛ فلا تقوى عليها دولةٌ منفردة.. \"#عالقون_في_فخّ_الاحتيال\".\n\nقال سعادة الشيخ @KhalifaAlharthy رئيس اللجنة الوطنية لمكافحة الاتّجار بالبشر: \"الاتّجارُ بالبشر ليس انتهاكاً للقانون فحسب، بل اعتداءٌ مباشرٌ على حُرِّيَّةِ الإنسان وحقوقه.\"\n\nومن هذا المنطلق تمضي سلطنة #عُمان بنهجٍ وطنيٍّ متكاملٍ يقوم على الوقاية والحماية والملاحقة والشراكة، ويجعل حقوقَ الضحايا وسلامتهم في صميم استجابته؛ فمن سقط في الفخّ ضحيةٌ لا متهمٌ، وإن بدا أنه اختار.\n\nويبقى دورُنا واضحاً.. أن نعرف الحيلة قبل الوقوع فيها، وأن نُبلّغ عمّا يُثير الريبة، وأن نمدّ للناجي يداً، لا أن نُديرَ له ظهراً.\n\nالوعي درعٌ قبل السقوط، والحمايةُ عهدٌ لا يُخلَف.\n#الوعي_حق_الجميع", "d": "٢٩ يوليو ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HOYOPzKXgAApi_V.jpg", "f": "2082367550751375839-HOYOPzKXgAApi_V.jpg", "v": false}], "iso": "2026-07-29"};</script>
