<script>window.__ENTRY__={"id": "2027413437941272912", "t": "لم أعتد مدحَ المسؤولين على أداء واجبهم، فخدمة الوطن التزامٌ يُؤدّى بوعي المسؤولية لا انتظارَ الثناء، ويزداد التحفُّظ حين تتقاطع المسؤولية العامّة بمواقع عمل مباشرة.\n\n(غير أن بعض اللحظات تجعل تسجيل الموقف واجباً)\n\nيرتبط هذا الحديث بمسؤوليةٍ مباشرةٍ تجمعني به، غير أنّ الشهادة تنطلق من موقع المواطنة، شهادةً لمسارٍ وطنيٍّ يُدار في ملفٍّ بالغ الدِّقّة والحسّاسيّة.\n\nإنّ تحمُّل وزير الخارجية معالي السيد بدر بن حمد بن حمود البوسعيدي (@badralbusaidi ) عبءَ التفاوض المباشر في أزمةٍ بهذا التعقيد يعكس حجم الثقة السيادية الممنوحة له، ويضعه أمام مسؤوليةٍ سياسيةٍ محسوبة في ميزان الدولة.\n\nالتنقّل بين مسقط وطهران وجنيف وواشنطن وغيرها من عواصم؛ إدارةٌ متواصلة لمسارٍ تفاوضيٍّ يُبقي قنوات الحوار مفتوحة، في إقليمٍ تتصاعد فيه احتمالات المواجهة، ضمن عملٍ دؤوب يُبذل بصمت لتقريب المواقف.\n\nهذا مسارُ دولةٍ يُدار بثبات، ويتحمَّله أشخاصٌ بأسمائهم بتكليفٍ واضح، ضمن الرؤية التي تقودها قيادة مولانا السّلطان #هيثم_بن_طارق حفظه الله، والتي رسَّخت خيار الحوار نهجاً إستراتيجيّاً ثابتاً للسياسة العُمانية.\n\nتسجيل هذا الموقف إقرارٌ بقيمة المسؤولية في لحظة دقيقة، وتأكيدٌ أن صون الاستقرار الإقليمي خيارٌ واعٍ تقوده الدولة بإرادة هادئة وبصيرة سياسية.\n\nوسند هذا المسار رجال ونساء وزارة الخارجية يعملون بكفاءة واتّزان، إيماناً بأن السلام ممارسةٌ يومية تتطلّب صبراً وعمق نظر.\n\nجزاكم الله خير الجزاء على ما يُبذل من عملٍ يحفظ للدولة موقعها، ويصون للمنطقة فرصة الاستقرار.", "d": "٢٧ فبراير ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HCLQdnNXsAA9XLl.jpg", "f": "2027413437941272912-HCLQdnNXsAA9XLl.jpg", "v": false}], "iso": "2026-02-27"};</script>
