<script>window.__ENTRY__={"id": "2075998600065155518", "t": "مِن المفارقاتِ المُوجِعة.. أن يُصَغِّرَ البعضُ ذاتَه، وهُوِيّتَه، ووجودَه، في بُقعةٍ ذاتِ تاريخٍ إنسانيٍّ وحضارةٍ لم تكن يوماً هامشاً.\n\nيمضي إلى \"الآخر\" بمدائحَ لم تُعلَّق بعدُ على أستارِ قلبه،\nيُشيدُ بتحضُّرٍ يظنُّه فاق وجودَه،\nأو يَشدو بتاريخٍ يحسبُه أنصفَ أجدادَه،\nمُتوهِّماً أنّ ذاك الآخرَ سيَحنو عليه:\nلن يقتلَ إنسانَه،\nلن يستبيحَ أرضَه وفكرَه،\nلن يحتقرَ ما بقيَ من دينِه وثقافته.\n\nتختلفُ راياتُهم وتتّفقُ غايتُهم؛ \"أن يبقى تابعاً لا نِدّاً\".\n\nومَن تواضعَ تزلُّفاً في مواطنِ الذلّ، فهو جبانٌ لا مُتواضع.\n\nيتنازلُ عن عقيدتِه، ويتنصّلُ من ثقافتِه، ويُصفِّقُ لمن أوغل في التعالي..\n\n(ما كسَرنا سيفُ غيرِنا، كسَرَنا انحناءُ ظهورِنا!)", "d": "١١ يوليو ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HM9r3M-XQAA-wGB.jpg", "f": "2075998600065155518-HM9r3M-XQAA-wGB.jpg", "v": false}], "iso": "2026-07-11"};</script>
