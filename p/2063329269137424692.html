<script>window.__ENTRY__={"id": "2063329269137424692", "t": "عديدةٌ هي المقالاتُ والتحليلاتُ السياسيةُ التي انتشرت على أجهزتنا..\nكثيرٌ منها إنشائيٌّ بطريقةٍ تُدهشُ البعيدَ عن كواليسِ الأحداثِ،\nوقد تُشوِّهُ مواقفَ الدولِ واعتباراتِها غيرِ المُعلَنةِ للعامَّةِ.\n\nالمفارقةُ أنَّ الذكاءَ الاصطناعيَّ كاتبُ المقالاتِ المرصوصةِ،\nلا يستطيعُ كتابةَ منشورٍ قصيرٍ بمعلوماتٍ صحيحةٍ وتحليلٍ إستراتيجيٍّ..\nلأنَّ المعلومةَ التي يبني عليها التحليل.. ليست متاحةً على المنصَّات، وهذا هو الفارق بين تَحليلٍ وتَخليلٍ.\n..\nأمّا نحنُ..\nفإنّنا نفتقدُ آدميَّةَ الفكرةِ وعَفويَّةَ الكتابةِ..\nكلُّنا قوالبُ..\nكلُّنا نحملُ نفسَ القُدراتِ المُذهلةِ..\nونكتبُ أفكاراً لم نصنعها بخِبرةٍ ومعرفةٍ.\n\nنحنُ نتشابه.. حتى في شكوانا،\nما أحوجَنا لنختلفَ ونتخالفَ.. ونُخطِئَ بحرفٍ أو ترقيمٍ.", "d": "٦ يونيو ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [], "iso": "2026-06-06"};</script>
