<script>window.__ENTRY__={"id": "2082142888243171767", "t": "تَخَيَّل أن ينطفئ \"الإنترنت\" الليلة..\n\nفي لحظةٍ واحدة، تَصمُت مليارات الأصوات.. كُلّ رسالةٍ كتبتَها في الثالثة فجراً، كُلّ صورةٍ التقطتَها لتقولَ: \"أنا هنا، أنا كُنتُ سعيداً\"، كُلّ كلمةٍ سكبتَ فيها قلبك ضوءٌ يخبو على شاشة.. بلا رماد، بلا وداع.....\n\nمصباحٌ في نافذةٍ بعيدة، يُطفَأ فجأة.. ويخنقك السؤال الذي يخنقنا جميعاً في الليل: هل سيبقى مِنّي شيء؟!!\n\nولكن..\n\nنحن نَظُنّ أنّنا نكتب لنُخَلَّد، والحقيقة أرقّ من ذلك بكثير.. نحن نكتب لنُمسِك بيدِ أحدهم في العتمة،\nقيمة الكلمة ليست في بقائها ألفَ عامٍ، إنّما في \"تلك اللحظة التي قرأها فيها إنسان فشعر أنّه ليس وحده\".\n\nالبَرديّةُ تعيش ألفَ عامٍ، والقُرْص الصَّلْب يموتُ في عَقْد.. أهَشّ ما صنعناه هو ما ظنَنّاه أخلد.\nومع ذلك.. فقدتِ الحضاراتُ مكتبةَ الإسكندريّة بأكملها، \"ولم تفقدِ الإنسانَ\"، لأنّ أعمق ما فينا لا يسكن (الخوادم)؛ هو يسكن الأيدي التي تزرع، والصدور التي تُحِبّ، والذاكرة التي تَنقُل الحكايةَ من جَدّةٍ إلى حفيدٍ.\n\nلستَ أرشيفك.. لستَ عددَ متابعيك، ولا آلافَ الصور في هاتفك،\nأنتَ الدفء الذي تركتَه في قلوب من عرفوك، والمعنى الذي أشعلتَه في يومٍ ثقيلٍ على أحدهم.\n\nفلو انطفأ كُلّ ذلك المصباح غداً، فلن تعتم النافذة التي أضاءها.. يبقى فينا ما لا يُنسَخ ولا يُحذَف؛\nأنّنا أحببنا، وأنّنا كُنّا هنا.. هنا فقط.", "d": "٢٨ يوليو ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HOS7kk7WIAAq0Ov.jpg", "f": "2082142888243171767-HOS7kk7WIAAq0Ov.jpg", "v": false}], "iso": "2026-07-28"};</script>
