<script>window.__ENTRY__={"id": "2050267004691460508", "t": "21 September 1833 In #Muscat, Oman and the United States of #America signed the first treaty between America and an Arab state. \n\nApril 1840 The Omani ship Sultanah arrived in the port of #NewYork the first Arab vessel ever to reach American shores. \n\nTwo centuries and more. Administrations, parties, and eras have come and gone in America, yet the bond with #Oman has never wavered because it rests on the State itself, and on its enduring institutions. \n\nIn the Sultanate of #Oman, the steadfastness of our foreign policy and the constancy of our friendships are not reactive. They are a legacy. A legacy we continue to build upon, together with the United States of America, in service to peace and stability across our world.", "d": "١ مايو ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [], "iso": "2026-05-01"};</script>
