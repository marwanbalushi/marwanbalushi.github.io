<script>window.__ENTRY__={"id": "2027616184489681359", "t": "في تقديري، يقوم الخلط على مساواة رفض التدخّل بالاصطفاف. \n\nالسياسة العُمانية ترتكز على احترام ما تختاره المجتمعات لنفسها، والتعامل مع الدول وفق مبدأ السيادة وحسن الجوار، بعيداً عن هندسة الأنظمة أو توجيه خيارات الشعوب.\n\nهذا نهج ثابت لم يتبدّل بتبدّل الأنظمة؛ عام 1979 امتنعت سلطنة #عُمان عن التأثير في المسار الداخلي لإيران، وحافظت على علاقاتها وفق ما اختاره الشعب الإيراني، كما فعلت قبل ذلك وبعده مع كلّ الدول.\n\nوضع الدور العُماني ضمن إطار الاصطفاف يُنتج قراءة غير دقيقة، سلطنة عُمان تتعامل مع الشعوب باحترام، ومع الدول بواقعية سيادية، وتسعى إلى منع انزلاق المنطقة إلى صراعٍ مفتوح يدفع ثمنه الجميع.\n\nالثابت في هذا المسار هو المبدأ قبل تبدّل المواقع؛ مبدأ احترام السيادة وصون الاستقرار. \nفالحرب تعيد ترتيب حياة الناس على أنقاض السياسة، وثمنها دماء ومدن مهدّمة وأسر مشرّدة، وتمتد آثارها إلى ما يتجاوز أطرافها ليصيب شعوباً بأكملها. \nومنع هذا الانزلاق مسؤولية تتقدّم على أي حسابات أخرى، لأن كلفة الصدام تقع على الإنسان أولاً وأخيراً.", "d": "٢٨ فبراير ٢٠٢٦", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HCOJ8S4WgAAomZr.jpg", "f": "2027616184489681359-HCOJ8S4WgAAomZr.jpg", "v": false}], "iso": "2026-02-28"};</script>
