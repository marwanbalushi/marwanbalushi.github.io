<script>window.__ENTRY__={"id": "2075267511902191831", "t": "مساءَ الخميسِ ينبعثُ #الحُبُّ.. من شوقه، فهو قد يكون دفقةً أو سيلاً جارفاً.. يصلُنا حين يشاء وقد تأتي به مزحةٌ، لا تخطيط ولا استئذان، ولا يشترط أن يبدو حقيقيّاً ولا أن يبدأ عميقاً.\n\nقد نحبُّ صوتاً قبل أن نعرف صاحبه. نشتاقُ وجهاً يسكن الذاكرة. نتنفّسُ عطراً يبقى في الهواء.\n\nقد تُعجبنا طبخةٌ واحدةٌ.. أو طبخاتٌ عديدةٌ، أو عنايةٌ بتفاصيلنا الصغيرة لا نلتفت إليها نحن أنفسنا، أو قلقٌ صادق حين نتأخّر قليلًا.\n\nوقد يبدأ إلكترونياً.. إعجابٌ بتعليقٍ على فيسبوك، أو نقاشٌ حول مشروع جامعي لا نريد أن ينتهي، أو حضورُ فعالية يُديرها من نحبّ فقط لنكون أقرب ولو من بعيد.\n\nالحُبُّ ليس رومانسية الأفلام دائماً. أحياناً هو مسكةُ يدٍ على سلّم لا تحتاج كلاماً، أو دعاءٌ في عتمة الليل.\n\nوقد يكون حُبّاً يفيضُ من قلبِ من نحبّ، فيشمل أهلنا أيضاً..\nحبيبةٌ تُقبّل رأس أمّك وتحتفي بها.. لأنّ حُبَّها لك اتّسع ليسعها،\nحبيبٌ يعتني بأبيك في غيابك، ويسأل عنه بصدق، لأنّ قلباً أحبّك يحملُ من تحبّهم أيضاً.\n\nوفي الحُبِّ الزوجيّ.. وصفه القرآن مودّةً ورحمةً بين قلبين. وحُبٌّ كهذا يبقى حاضراً حتى بعد الغياب.. ولنا في حُبِّ النبيّ صلّى الله عليه وسلم بأمّنا خديجة رضي الله عنها حكايةٌ.\n\nكلُّ هذا حُبٌّ، لا ينقصه شيء ليكبر ويكتمل. نحن من صدّقنا القوالبَ الجاهزة حتى صارت عندنا حقيقةً لا تُناقَش..\n(حُبٌّ من أوّلِ نظرةٍ)، (حُبٌّ لا يتكرّر)، (حُبٌّ واحد حقيقي) وما سواه تكرارٌ باهت..\nرسمتها المسلسلات فهزمت تفرّدنا فاستسلمنا لها، وغرستها أغنيةٌ رددنا كلماتها قبل أن نعيش معناها، ورسّختها تغريدةٌ عابرةٌ كأنّها آيةٌ محكمة.\n\nربما صدقت مع قلبٍ واحدٍ يوماً، فظننّاها قانوناً لكلِّ قلبٍ، وحمّلنا مشاعرنا الغضّة ما لم تُخلق لتحمله.\n\nكلُّ حُبٍّ كوكبٌ بذاته.. له جاذبيّته، وفصوله، ومداره الخاصّ.. لا يُقاس بما سبقه، ولا يشبه ما يليه.\n\nفلماذا نُنهك أرواحَنا في تعريفِ الحُبِّ وتقييده، بدل أن نُسلّم له كما يأتي، ونحياه بلا حساب.. ثانيةً كان عمره أو دهراً كاملاً؟\n\nدعوا الحُبَّ حُرّاً.. بلا قالب يحبسه.\nدعوه يُقيم بقدرِ ما يستحق، ويرحلُ إن شاءَ الرحيل، ويبقى في الذاكرة كما كان فعلاً..\nلا كما أرادته أغنيةٌ، ولا كما أملته حكايةٌ لم تكن حكايتنَا.", "d": "٩ يوليو ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HMzQ1FRXgAArERa.jpg", "f": "2075267511902191831-HMzQ1FRXgAArERa.jpg", "v": false}], "iso": "2026-07-09"};</script>
