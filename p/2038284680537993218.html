<script>window.__ENTRY__={"id": "2038284680537993218", "t": "سُئل رئيس وزراء #المملكة_المتّحدة السير كير ستارمر عن استهزاء الرئيس #الأمريكي دونالد ترمب به، فأجاب كما جرت به المدرسة البريطانية.. (تجاهل الطُّعم).\n\nتجاهل الإطار الشخصي كلياً، السؤال كان عن \"الاستهزاء\"، وهو إطار عاطفي استفزازي بامتياز، لكنه رفض الدخول فيه من الأساس، لم ينكره ولم يقرّ به.\n\nواختار العودة إلى المصلحة، ردّ من موقع رئيس حكومة، ليس من شخص يُستفَزّ: ”ما يهمّ هو العلاقة بين البلدين والمصالح المشتركة.”\n\nلم يُدافع عن نفسه؛ لأن الدفاع عن النفس اعترافٌ ضمني بأن الجرح مزعج، فكان صمته عن الجانب الشخصي أقوى من أيّ ردّ.\n\nهذا ما تُتقنه (المدرسة الإنجليزية) في #الاتصال_السياسي.. أن تتحكّم في إطار إجابتك، وأن تدير المعركة وكأنك لم تلاحظ أنها بدأت!", "d": "٢٩ مارس ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/amplify_video_thumb/2038283288499126272/img/exlJnozr2-56mclh.jpg", "f": "2038284680537993218-exlJnozr2-56mclh.jpg", "v": true, "vf": "2038284680537993218-sdt3ruegn3oHIfzI.mp4"}], "iso": "2026-03-29"};</script>
