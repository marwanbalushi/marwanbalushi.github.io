<script>window.__ENTRY__={"id": "2083106197788406211", "t": "في يومَين..\nودّعَت #عُمان اثنتين من بناتها البَرَرة، كلُّ واحدةٍ منهما كانت عَلَماً يُرفرِف بطريقتها الخاصّة.\n\n(#عائشة_الجامعية) خَنساء سَمائل، حملت القلمَ فحوّلَته إلى منبرِ حُبٍّ ووفاء، وأفنت عمرها بين آياتِ القرآنِ الكريم تُعلِّمها للناشئة، وبين قصائدَ تنسابُ من قلبٍ مَشوقٍ دِفئاً وإيماناً.\n\nتركت خلفها ديوانين، وأجيالاً من الطالبات، وقصائدَ لا تزال تُنشَد في المناهجِ والمحافِل.\n\n(#نظيرة_الحارثية) حملت عَلَمَ سلطنةِ عُمان إلى حيثُ لم تبلُغْه عُمانيّةٌ من قبل، إلى قِمّةِ إيفرست، ثم إلى قِمَمٍ أُخرى، ماضيةً بثَباتٍ نحو حُلمها بتسلُّقِ قِممِ العالَم الأربعَ عشْرةَ الشاهِقة.\n\nوعلى \"برود بيك\" الجبلِ الباكستانيِّ الذي قصدته تَتِمّةً لذلك الحُلم، باغَتَها الثلجُ، فارتقَت إلى قِمّةٍ أُخرى لا يبلُغها إلا الشُّجعان.\n\nاثنتان اختلف مَيدانُهما، واتّفَق جوهرُهما..\nإرادةٌ عُمانيّةٌ لا تعرِف الاستسلام،\nوقلبٌ يمنَح وطنه أجملَ ما فيه.\n\nرحمهما اللهُ رحمةً واسعةً، وألهم أهلَهما ومحبّيهما الصَّبرَ والسُّلوان..\n\nفعُمان، وإن خَسِرَت اليومَ قامتَين،\nتبقى غنِيّةً بما زرعَتاه فيها من أثَرٍ لا يزول.", "d": "٣١ يوليو ٢٠٢٦", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HOiuC57XEAAmXAI.jpg", "f": "2083106197788406211-HOiuC57XEAAmXAI.jpg", "v": false}], "iso": "2026-07-31"};</script>
