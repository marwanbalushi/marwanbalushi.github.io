<script>window.__ENTRY__={"id": "2087594276427321497", "t": "سلسلة من خمسة منشورات عن خطابٍ واحد، وكيف يُدار (الانهيار) في أربع دقائق.\n\nإن كانت #الاتصالات_السياسية و #إدارة_الأزمات تعنيك.. أحسبه يستحقّ وقتك.\n\nوإن لم تكن، فلك أن تمرّ بسلام محبّةً،\nولك أن تبقى، فربّما وجدتَ فيه ما لم تتوقّعه.\n\n1/\nحين كُلّفتُ في الماجستير بورقة تحليل سياسي وقراءة في آلية التعامل مع الأزمة،\nفضّل الزملاء الدوليين النماذج البريطانية ونحن على أرضها.\nأمّا أنا فاخترتُ نموذجاً أدهشني ذات مساءٍ شتويٍّ إنجليزي؛ خطاب الرئيس الأمريكي الأسبق (Ronald Reagan) بُعيد حادثة انفجار مكوك الفضاء Challenger، عام 1986.\n\nقلقي كان في الإضافة؛ بأيّ جديدٍ تناقش خطاباً سبر أغواره كثيرٌ من المحلّلين الإستراتيجيين؟\n\nوفرصتي الصغيرة كانت تبديلَ زاوية النظر.. يُقرأ الخطاب بالمجمل رثاءً بليغاً؛\nقرأتُه فنَّ إدارة أزمة، فتكشّفت مستوياته الثلاث (النصّ، والأداء، واللحظة).\nوما أزال أعود إليه كمن ينبش في مراجعَ ليست لها فترة صلاحية.\n\n2/ النصّ\nالقراءة تبدأ من سؤال: ماذا فعل المتكلّم قبل أن يتكلّم؟\n\nقبل أن يُكتب حرفٌ، اتُّخذ القرار؛ كان (Reagan) سيُلقي خطاب حالة الاتّحاد تلك الليلة، فأجّله لأوّل مرّةٍ في التاريخ الحديث، وأطلّ من المكتب البيضاوي عند الخامسة مساءً.\n\nكانت إشارةٌ أن حِداد الأمة يتقدّم على أجندة الرئيس؛ وهذه الرسالة الأهمّ.\n\nثم النصّ.. حوالي أربع دقائق وقرابة 650 كلمة، باقتصادٍ يُبقي البصر على المعنى.\nوأبلغ ما فيه صمتُه؛ لا تعليلَ سببٍ، ولا لوم، ولا مرافعة.. السبب لم يُعرف بعد، فامتنع عن التخمين.\n\nهذه #إدارة_الفراغ_المعلوماتي؛ حين تغيب الحقيقة.. يملأ التكهّنُ الفراغَ بالمسؤولية.. فملأه هو بالمعنى، وسمّى القتلى السبعة واحداً واحداً،\nليبقي الفقدُ إنساناً لا رقماً.\n\nوالمبدأ؛ لا تملأ الفراغ بتخمينٍ ما دام بوسعك ملؤه بالصدق.\n\n2/ النصّ\nالقراءة تبدأ من سؤال: ماذا فعل المتكلّم قبل أن يتكلّم؟\n\nقبل أن يُكتب حرفٌ، اتُّخذ القرار؛ كان (Reagan) سيُلقي خطاب حالة الاتّحاد تلك الليلة، فأجّله لأوّل مرّةٍ في التاريخ الحديث، وأطلّ من المكتب البيضاوي عند الخامسة مساءً.\n\nكانت إشارةٌ أن حِداد الأمة يتقدّم على أجندة الرئيس؛ وهذه الرسالة الأهمّ.\n\nثم النصّ.. حوالي أربع دقائق وقرابة 650 كلمة، باقتصادٍ يُبقي البصر على المعنى.\nوأبلغ ما فيه صمتُه؛ لا تعليلَ سببٍ، ولا لوم، ولا مرافعة.. السبب لم يُعرف بعد، فامتنع عن التخمين.\n\nهذه #إدارة_الفراغ_المعلوماتي؛ حين تغيب الحقيقة.. يملأ التكهّنُ الفراغَ بالمسؤولية.. فملأه هو بالمعنى، وسمّى القتلى السبعة واحداً واحداً،\nليبقي الفقدُ إنساناً لا رقماً.\n\nوالمبدأ؛ لا تملأ الفراغ بتخمينٍ ما دام بوسعك ملؤه بالصدق.\n\n5/ الخلاصة\nتاريخية الخطاب وعظمته في التقاء الثلاثة؛\nنصٌّ صُمّم ليُصعِّد المشاعر،\nوأداءٌ اختفى خلف نصّه،\nولحظةٌ رفعت الرثاء إلى رسالةٍ سياسية.\n\nومن الأمانة أن أقول إن قراءة \"الشفافية سلاحاً\" سبقني إليها باحثون؛ إضافتي في التوليف..\nأن يُقرأ الخطاب إدارةَ أزمةٍ تجمع القرار قبل الكلمة،\nومخاطبة كلّ فئةٍ بلغتها، وازدواج العزاء والسياسة.\n\nالخطاب الناجح في الأزمة، كالتحليل الرصين، يبلغ كلَّ قارئٍ عند مستواه؛ القلب، والعقل، ويد صانع القرار.\n\nالقرار قبل الكلمة..\nوفي لحظة الانهيار، يتذكّر الناس شعورهم، وهل صدقتَهم.\n\n5/ الخلاصة\nتاريخية الخطاب وعظمته في التقاء الثلاثة؛\nنصٌّ صُمّم ليُصعِّد المشاعر،\nوأداءٌ اختفى خلف نصّه،\nولحظةٌ رفعت الرثاء إلى رسالةٍ سياسية.\n\nومن الأمانة أن أقول إن قراءة \"الشفافية سلاحاً\" سبقني إليها باحثون؛ إضافتي في التوليف..\nأن يُقرأ الخطاب إدارةَ أزمةٍ تجمع القرار قبل الكلمة،\nومخاطبة كلّ فئةٍ بلغتها، وازدواج العزاء والسياسة.\n\nالخطاب الناجح في الأزمة، كالتحليل الرصين، يبلغ كلَّ قارئٍ عند مستواه؛ القلب، والعقل، ويد صانع القرار.\n\nالقرار قبل الكلمة..\nوفي لحظة الانهيار، يتذكّر الناس شعورهم، وهل صدقتَهم.", "d": "١٢ أغسطس ٢٠٢٦", "door": "الإنسان كرامة", "dk": "karamah", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HPidXwwWcAA48R-.jpg", "f": "2087594276427321497-HPidXwwWcAA48R-.jpg", "v": false}, {"u": "https://pbs.twimg.com/amplify_video_thumb/2087596389647671296/img/zE3FemZsOTEdT-La.jpg", "f": "2087596473764503942-zE3FemZsOTEdT-La.jpg", "v": true, "vf": "2087596473764503942-tNvDfd6Ul_99dqv4.mp4"}], "iso": "2026-08-12"};</script>
