<script>window.__ENTRY__={"id": "2043004189798994132", "t": "ويأتي الغريب فيفتح على القلب شرفةً لزمن لم أعايش شخوصه.\n\nشيخ يتكئ على عصا خشنة وذاكرةٍ شاحبة..\nوعلى يديه تجاعيد أزمنة غبرت، وفي وجهه ضوء خافت من أقمار عديدة رافقت لياليه وهو يتنقّل بحثاً عن كلأٍ أو حاجة من حوائج الدنيا.\n\nيلتقيني وكأنه يعرفني.. يتفرّس في وجهي.. ينشدني عن نفسي ويناشدني عن العلوم والأخبار..\n(من الرجّال، ولد من أنت؟)\nأجبته: يوسف بن شمبيه بن محمد البلوشي..\nيقطع عليّ بصوتٍ مرهق.. (بن شاااامبيه.. ونعومك بالرجّال.. راعي سمحة).\n\nوكأنه أغرق في التذكّر:\n(إيييه بن محمد.. كان ”حوش شمبيه” حيّ براعيه، ننصاه بشور.. ونودّع ود محمد بشور وخير وشبعة).\n\nأطرق قليلاً.. وبصوت خافت:\nكان شمبيه بن محمد.. في أزمنة الحاجة والعوز.. يأمر بخنجر فيُجزّ (جراب التمر) نصفين.. ويُترك مفتوح أمام الباب..\nليمرّوا كالظلال، ويأخذوا ما كتبه الله لهم.. ولا يسألون!\n\nجدي شمبيه بن محمد طيّب الله ثراك..\nالاسم أمانة، والسمعة دَين علينا.. نسأل الله أن نكون أهلاً.\n\nويُترك مفتوحاً^", "d": "١١ أبريل ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HFo1d31akAE57M8.jpg", "f": "2043004189798994132-HFo1d31akAE57M8.jpg", "v": false}], "iso": "2026-04-11"};</script>
