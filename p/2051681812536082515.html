<script>window.__ENTRY__={"id": "2051681812536082515", "t": "امرأةٌ من طينة هذه الأرض،\nكانت الدفءَ قبل أن أعرفَ معنى البرد،\nكانت الأمانَ قبل أن أعرفَ معنى الخوف،\nوكانت هي.. #أمّي.\n\nوُلِدَت في بيتٍ طينيٍّ في #جعلان_بني_بوعلي، تحت سقف مشيخة طالب بن عبدالله البلوشي،\nكان الطينُ عزّاً والحجرُ ترفاً، والبساطةُ كرامةً..\nبيتٌ سياجُه اسم أبيها، وممرّاتُه المفتوحة على مساحةٍ من ضوء تتعبَّق بعطرِه وأثرِ خطواتِه الهادئة، وبقايا صوتِه ذي البحّة الجميلة، وعتبتُه التي تعرف أقدام الكرام قبل أن يطرقوا..\nوهناك اكتنزت قلعةُ آل حمودة بدهشتها الأولى.. وحول حاراتها الطينيَّة تحفظ بصمة أقدامها حين كانت صغيرة..\nفي ذلك البيت عرفت القيادة وخبايا السياسة قبل أن تعرف الحرف؛\nمن حديث أبيها.. ومن علوم خال أمّها الفقيه الشيخ يوسف بن محمد البلوشي.. ومن الهمسات التي تتسرّب من بين شقوق القلعة حيث تجد طريقها إلى البيت قبل أن تصل الأخبار إلى الناس!\n\nوفي #إبراء.. بلّلت قدميها الصغيرة بماء السواقي،\nوتشكَّلت روحها على يدي جدَّتها ذات الشخصية الحازمة بحنوٍّ عليها.. شريفة بنت محمد البلوشي (بنت الجعلاني)،\nتلك المرأة التي زرعت في حفيدتها الأثيرة وقاراً كالمعدن الذي لا يصدأ.\nكانت تأتي النساء إليها.. كما يأتي الظامئ إلى الماء الذي يعرف مكانه؛\nبابٌ لا يُغلق، وصدرٌ لا يضيق، وكلمةٌ تعرف موضع الجرح دون أن تسأل..\nكالشجرة الوارفة، تهب ظلّها.. لا تسأل من جلس، ولا تسأل الريح شكراً!\n\nومع الضوء مضت نهاراً.. واستقرَّت في #المضيبي زوجةً صغيرةً وأمّاً كبيرة،\nاستقرار الماء حين تحفّه سواقي الضواحي.\nصار البيتُ بستاناً، والعَتَبةُ أماناً، وحديثها طبطةً للقلوب المتعبة، وتطبيباً للأجساد الواهنة،\nبدَلَّتها النحاسيَّة.. يتهادى صوت القهوة وهي تُسكَب، كأنَّها كانت تقول: اطمئنوا.. أنتم هنا، وأنتم بخير،\nلم يعلم أحدٌ أنَّ تلك اليد الحنونة التي تسكب بهذا الثَّبات فقدَت كثيراً.. وهي تودّع من تحبّ..\n(سالم) ذهب قبل أن يحبو إليها باكياً مشتاقاً،\nو(مريم) أخذَها الله صغيرة قبل أن تسرّح شعرها للمدرسة،\nو(محمود) حاول أن يعرف الماء؛ لكنه رحل معه ذات عصرٍ في ثقبة #فلج_الفرسخيّ ولم يعد..\n\nتلك هي وحشيَّة الماء!!\nأخذت منها ما لم يكن لأحدٍ أن يأخذه،\nوالماء.. يجري كأنَّ الدنيا لم تنتبه إلى ما حدث..\nثلاثةٌ دفنتهم بيديها..\nوفي كلِّ مرَّة تشعل تحت الدَّلَّة ناراً، وتنتظر الضيفات!\n\nوقفتُ أمام طيفها.. لا صوتٌ ينبّهني أو يميل إليّ فأرتاح،\nفهمتُ حينها كيف يصبح القلب يتيماً..\nشيءٌ فيني اختلف..\nالفلج يجري كما كان،\nوالدَّلَّة باردةٌ للمرَّة الأولى،\nوأنا أكتشف أنَّ امرأةً واحدة.. كانت كلَّ هذا الهواء الذي كنَّا نتنفَّسه ولا ندري،\nوالذين يصبرون هكذا لا تسعهم هذه الأرض..\nتسعهم هناك.. الجنّة!\n\nريّا بنت طالب - طيّب الله ثراها-\nاسْقِها يا اللّه من حوض نبيِّك،\nوأَظِلَّها تحت عرشك،\nوأَسكِنها حيث ينتظرها من فقدَتهم.. قبل أن نفقدَها،\nحيث لا تبرد الدِّلال،\nولا يأخذ الفلجُ من تحبّ!!", "d": "٥ مايو ٢٠٢٦", "door": "الإسلام مرجعيّة", "dk": "marjieyah", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HHkIiqIWQAAtlG9.jpg", "f": "2051681812536082515-HHkIiqIWQAAtlG9.jpg", "v": false}], "iso": "2026-05-05"};</script>
