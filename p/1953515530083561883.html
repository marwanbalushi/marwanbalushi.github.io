<script>window.__ENTRY__={"id": "1953515530083561883", "t": "أنا ابن #عُمان..\n\nلم أسأل يوماً عن مذهب أحد، ولا اضطررت لتفسير مذهبي.\n\nفي بيتي.. وفي مجتمعي..\nيتقاسم الإباضي/السنّي/الشيعي/وحتى غير ذلك.. المودة والمجلس والنسب، حيث لا أحد يشرح نفسه، ولا أحد يفصّل إيمانه كي يُقبل.\n\nفي وطني.. المذاهب لا تتجاور فحسب بل هي تتماهى؛ في الزواج والعائلة، وفي سياق الحياة بكلّ تفاصيلها البسيطة والمتداخلة.\n\nالمذهب ليس لافتة، ولا شعاراً.. هو خُلق يظهر أو حتى معاملة تتجلّى في قلوب مطمئنة وعلى وجوه بشوشة.\n\nالطائفية غريبة عنا.. من يُدخلها بيننا لا يهدّد مجموعة منّا.. إنما يربك توازناً عشناه دون حاجة إلى تسميات وتأكيدات.\n\nوطني العزيز سلطنة عُمان يا أصدقاء.. لا يفاخر بتسامحه.. لأنه لم يُبنَ على خصومة تستدعيه، فالتعدّدية فيه ليست طارئاً على المجتمع، إنها جزءٌ من طبيعتنا الأولى.\n\nالحمد لله على وطنٍ.. لم يحتج إلى اتفاق كي يتّسع، ولا إلى تشابه كي يتماسك!", "d": "٧ أغسطس ٢٠٢٥", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/GxxIBVkXUAALgyL.jpg", "f": "1953515530083561883-GxxIBVkXUAALgyL.jpg", "v": false}], "iso": "2025-08-07"};</script>
