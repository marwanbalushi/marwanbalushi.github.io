<script>window.__ENTRY__={"id": "2080960192716349632", "t": "وصيّةُ مُحبٍّ..\n\nخُذِ #الدينَ من كتاب الله وسنّةِ نبيّه ﷺ، وخُذْ تفسيرَهما عن العلماء الراسخين؛\nفللقولِ نَسَبٌ يُسأل عنه، ومَن لا نَسَبَ لقوله لا تُورّثه دينَك.\nثمّ أَعمِلْ عقلَك، ومرِّنْ قلبَك، واستنبِطْ فهمَك؛\nليكون الدينُ خيراً لك، لا سيفاً على إنسانيتك، ولا حاجزاً بينك وبين ربّك.\n\nواحذرْ متعالماً صنعته الشاشةُ لا الحَلْقة، يتبدّل قولُه كلّما تبدّل الدافع.\nوقد صار المنبرُ شاشةً، والفتوى سِلعةً، والمُفتي ظاهرةً صوتيّةً لا تخشى الله؛\nيجمعها قولٌ بلا سَنَد، وقائلٌ بلا ذمّة، وشهرةٌ بلا رصانة.\n\nواعلمْ أنّ في ديننا علماءَ دينٍ لا رجالَ دين؛ العالِمُ دليلٌ لا بوّاب، يدلُّك على الباب ولا يملك مفتاحه؛\nفليس بينك وبين الله واسطة، ولا لأحدٍ على قلبك سلطان.\n\nفخُذْ عمّن رسخ، لا عمّن طرأ؛ ولا تُسلِّمْ عقلَك لأحد، فالعقلُ أمانةٌ، ومَن صادَره فقد صادَر دينَك معه.\nغفرَ اللهُ لسلطانِنا الراحل #قابوس_بن_سعيد، طيّب الله ثراه.", "d": "٢٥ يوليو ٢٠٢٦", "door": "الإسلام مرجعيّة", "dk": "marjieyah", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/amplify_video_thumb/2080955160969314304/img/ZkI-wn4Bo9zxuoGx.jpg", "f": "2080960192716349632-ZkI-wn4Bo9zxuoGx.jpg", "v": true, "vf": "2080960192716349632-_xCQdrOJn-mK_Dli.mp4"}], "iso": "2026-07-25"};</script>
