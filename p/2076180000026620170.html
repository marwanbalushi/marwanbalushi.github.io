<script>window.__ENTRY__={"id": "2076180000026620170", "t": "مرّتان، وفي كِلتَيهما لم يعلُ فوقَ الجميعِ إلّا اسمٌ عُماني\n\nفي قاعةٍ بريطانيّةٍ عريقةٍ يُنادى اسمٌ واحدٌ ليتسلّمَ \"كأس هالاهان\" (Hallahan Trophy)،\nيتقدّمُ الصقرُ العُماني الملازم أول جوي/ قيس بن أحمد الصبحي، مُتصدّراً دورةَ الهندسةِ التخصصيّةِ في منظوماتِ الطيران بقاعدة كوسفورد الجويّة (RAF Cosford)؛ الأولَ بلا منازعٍ عِلماً وانضباطاً وقيادةً.\n\nعقلٌ عُمانيٌّ يُروّضُ أعقدَ ما في السماءِ من منظومات، فيعلو اسمُه فوقَها.\n\nلم تكنِ الكأسُ أوّلَ مجدٍ تحملُه يداه؛ فقبلَ سنواتٍ قليلةٍ سُلَّ في الكليّةِ الجويّةِ الملكيّةِ بكرانويل \"سيفُ الشرفِ الدولي\"(International Sword of Honour) باسمِه وحدَه،\nالأوّلَ بين جميعِ الضبّاطِ الدوليين في الكليّةِ، لتفوّقِه في الأداءِ القياديِّ وسِماتِ الضابط.\n\nسيفٌ بالأمس، وكأسٌ اليوم..\nعنوانٌ واحدٌ لا يتبدّل.. عُماني.\n\nشاهينٌ عُمانيٌّ يحلّق..\nنصعدُ، ثمّ نصعدُ، ولا نرضى إلّا بأن..\nتكتبُ عُمانُ اسمَها في السماءِ البعيدة.", "d": "١٢ يوليو ٢٠٢٦", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HM-XZe7W8AE2fwW.jpg", "f": "2076180000026620170-HM-XZe7W8AE2fwW.jpg", "v": false}], "iso": "2026-07-12"};</script>
