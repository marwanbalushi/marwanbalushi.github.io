<script>window.__ENTRY__={"id": "2025571908515705256", "t": "أكتب عن الأخ العزيز سعادة السفير @anrahbi1 لأن المسارات الصادقة تُلهم، ولأن الكلمة حين تُتقن تصنع أثراً.\n\nفي مساره أقرأ خيطاً من نور يشبه البدايات؛ من صوت الإذاعة إلى حبر \"جريدة الوطن\"، حيث تتشكّل الكلمة على مهل وتنضج بالمسؤولية قبل أن تكبر بالصدى.\nهناك تُصان الجملة بأمانتها، ويتقدّم #الوعي على القول، ويغدو فهم #الإنسان أساس الرسالة.\nالإعلام فضاء التكوين الأول؛ فيه تستقيم النبرة وتتجذّر الشخصية العُمانية الواثقة.\n\nثم مضى كلٌّ منّا في مساره، وكأن الإعلام كان معبراً إلى الدبلوماسية؛ هو ملحقٌ ثقافي في الأردن، وأنا ملحقٌ إعلامي في أمريكا، وتجارب إدارية أخرى صقلت الرؤية ووسّعت الأفق.\n\nوجاءت الدبلوماسية امتداداً طبيعياً لمسار يبني الجسر في الداخل ثم يحمله إلى العالم بثبات واتّزان.\nكلمة ناضجة تتحوّل إلى موقف، وموقف راسخ يصنع أفقاً يليق بوطننا العزيز #سلطنة_عُمان؛ من الإصغاء إلى #السلام.\n\n#أنسنة_الإعلام\n@AbdulmonamA", "d": "٢٢ فبراير ٢٠٢٦", "door": "دبلوماسيّة", "dk": "diblomasi", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HBxFoSFWkAAdQqh.jpg", "f": "2025571908515705256-HBxFoSFWkAAdQqh.jpg", "v": false}], "iso": "2026-02-22"};</script>
