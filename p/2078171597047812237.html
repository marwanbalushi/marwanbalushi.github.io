<script>window.__ENTRY__={"id": "2078171597047812237", "t": "بعضُ النصوصِ بضميرِ المفردِ، وجِراحُها بضميرِ الجمع.\nتقولُ لك: لا تمُتْ.\nولا تقولُ لك: لن يقتلوك..\nومنها هذا النصُّ الشعريُّ \"الأحصِنة\" للشاعر اليمنيّ #وليد_الشواقبة\n..\n\nكُلُّ احتمالاتِ الهزيمةِ مُمْكِنهْ\nفاربَحْ جنودَكَ\nإنْ خَسِرْتَ الأحصِنهْ\n\nوامنَحْ جُنونَكَ عُزلةً أخرى\nوهَبْ رئتَيْكَ حُزْنًا آخَرًا\nلِتُدَخِّنَهْ\n\nالموتُ ركعتُكَ الوحيدةُ\nلا تَمُتْ\nوإذا اضطررتَ فواقِفًا كالمِئذنهْ\n\nوالليلُ مَنْفاكَ الطويلُ\nفلا تَخُنْ مَنْفاكَ\nماذا لو يَظُنكَ مَوْطِنَهْ؟!\n\nجافاكَ مَضجعُكَ القديمُ\nوخانكَ الخِلُّ النديمُ\nوأَوحشتكَ الأمكِنهْ\n\nتمتدُّ وحدَكَ مِثل جُرحٍ\nتنزوي كالجُرحِ\nتأتيكَ الجِراحُ مُلوَّنهْ\n\nلا وَحْيَ يُقْرِئكَ السلامَ\nونِصفكَ الباكي نبوءاتٌ\nونِصفكَ شَيْطنهْ\n\nفاركُضْ برُوحكَ نَحْو مَدْيَنها\nكمَا موسى\nمَضى رُوحًا فَلاقَى مَدْيَنَهْ\n\nواحمِلْ على إِيمانكَ الدنيا\nوإنْ صَعُبَتْ\nتَكُنْ في عَينِ قلبكَ هَيِّنهْ\n\nقَدْ تُبْصِرُ النبعَ الغزالةُ\nفي اللظى\nلو أنها بالنبعِ حقًا مُؤْمِنهْ\n\nوالناس يا ابن الناسِ\nجَمٌّ شَرّهمْ\nفإذا جنَيتَ الشَّر فاختَرْ أَهْوَنَهْ\n\nوعليكَ إنْ غُمَّتْ مودةُ صاحبٍ\nاترُكهُ لِلأيامِ تَكْشِفُ مَعْدِنَهْ\n\nوأَطِلْ جفاك تُهَبْ وجانِبْ تُجتَنَبْ\nوازهَدْ بلومِكَ خِشْيةً أنْ تُدْمِنَهْ\n\nفالحُرُّ لن تلقاهُ مُنكسِرًا\nعلى حَدِّ الأسِنَّةِ\nبَلْ بحَدِّ الألسِنهْ\n\nواهجُرْ أخا الفحشاءِ\nواقطَعْ كُلّ مَنْ آخاهُ\nإنّ الفُحشَ عَدْوَى مُزْمِنهْ\n\nعند الشدائدِ مطمئِنًا كُنْ\nفلا تقسُو الرياحُ\nعلى الغُصونِ الليِّنهْ\n\nلا بأسَ بالخوفِ القليلِ\nفرُبما\nبَلَغَ المسافرُ بالمخاوفِ مَأْمَنهْ\n\nيا أيها الوَلَدُ المسافرُ بالسُّرى\nأَتَغارُ مِنْ نهْرٍ يُقَبِلُ سَوْسَنهْ؟\nنامَتْ حبيبتكَ\nالتمِسْ لكَ دمعةً\nما لِلهوى نومٌ عليكَ ولا سِنهْ\n\nستُحبكَ امرأةٌ غدًا وتَخُونها\nفاعذُرْ هواكَ\nولا تَقُلْ: ما أَخْوَنَهْ\n\nلا حُب إلا ما انكَسَرْتَ به\nفلا تذهَبْ\nسيُرجِعكَ الحنِينُ لِتحضنَهْ\n\nعُدْ وانكسِرْ\nعُدْ وانتظِرْ\nعُدْ وانتصِر\nكُلُّ احتمالاتِ الهزيمةِ مُمْكِنهْ!", "d": "١٧ يوليو ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twim
