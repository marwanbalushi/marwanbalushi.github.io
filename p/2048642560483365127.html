<script>window.__ENTRY__={"id": "2048642560483365127", "t": "في دراستي للماجستير، كان البروفيسور يرفض أن يُنادَى بلقبه.. وجد في اسمه وحده تقديراً يكفيه.\nأخذت منه تلك الإشارة وأنا رجل بسيط، يجد في الاسم الذي منحته إياه أمّه رحمها الله ما يغنيه عن كل لقب.\n\nأُتيحت لي فرصة دراسة الدكتوراة في جامعات دولية مرموقة.. لكن أصالة المشروع لم تنل مني أكثر من اهتمامٍ قصير، سرعان ما تبخّر.\nخرجت بقناعة راسخة؛ الدكتوراة مسار أكاديمي بامتياز لا يحتمله إلّا من يسكن داخل تخصص دقيق، أو يشتغل في مجالات علمية لا تجد موطئاً لها خارج الإطار الأكاديمي،\nأمّا من كان ميدانه المهنة فالماجستير يكفيه ويزيد.\n\nلكن ما يلفتني اليوم أعمق من هذا.. لقد نشأت بيئات رسّخت في أذهان كثيرين أن حامل \"د.\" يستحق توقيراً أكبر، وتقريباً أسرع، وربما ترقيةً أسهل بصرف النظر عن أثره الحقيقي،\nفأصبح اللقب في وعي جيل كامل من الشباب شيئاً مختلفاً تماماً عن العلم؛ تحقيقاً للذات حين عجزت البيئة عن الاعتراف بهم بطريقة أخرى، وتوثيقاً لحضور اجتماعي لم تمنحهم إياه الكفاءة وحدها، وبوابةً لاعتراف ظلّوا يطرقون أبوابه دون جدوى.\n\nوالمفارقة التي تستحق التأمّل.. أن أعظم من أثّروا في مسار الفكر الإنساني لم يكونوا يلاحقون لقباً كانوا يلاحقون سؤالاً لا يتركهم..\nصنعوا أثرهم بما أقلقهم لا بما وُصفوا به.\n\nاجعل سؤالك أكبر من لقبك، وأثرك أوضح من اسمك!", "d": "٢٧ أبريل ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [], "iso": "2026-04-27"};</script>
