<script>window.__ENTRY__={"id": "1075750865334665216", "t": "هذا ما أمر به السلطان قابوس في 15 مايو 1978م..\n\nفلينظر كل مسؤول (هو مواطن -أنا أو أنت- كُلّف بمسؤولية) فيما التزم به من الأمر.. أو تهاون وتخاذل عنه لتحقيق مصالح الوطن والشعب.\n\nالثقة كبيرة في كل عُماني.. وهو يتولى مسؤولية ما، واضعاً وطنه نصب عينيه، ومقدّماً مصلحة الشعب على مصالحه الشخصية.\n\nأمّا من تخاذل وتهاون.. فأمره إلى القانون العُماني، وتوجيهات مولانا حفظه الله ورعاه، حيث كلّفه وشرّفه بالمسؤولية.\n\nوما نراه نحن.. قد يختلف تماماً عن واقع الأمور والحقيقة، حيث الجهود المخلصة تصطدم ببعض اللاهثين وراء مصالحهم، أو أن التطوير وتعديل الوضع يلزم وقتاً أطول.\n\nوكلمة أخيرة.. سنرددها في وجه كل فاسد.. خذل وطنه.. وخان الأمانة، سواءً كنتُ أنا أو أنت.\n… ...\n\nقل للفساد..\nوقل لمن فسدوا..\nإن الأراضي البور لا تلدُ..", "d": "٢٠ ديسمبر ٢٠١٨", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/Du3Vs7CW0AA-fRs.jpg", "f": "1075750865334665216-Du3Vs7CW0AA-fRs.jpg", "v": false}, {"u": "https://pbs.twimg.com/media/Du3cOsKXQAULHVR.jpg", "f": "1075758042241740800-Du3cOsKXQAULHVR.jpg", "v": false}], "iso": "2018-12-20"};</script>
