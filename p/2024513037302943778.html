<script>window.__ENTRY__={"id": "2024513037302943778", "t": "أُهنّئ زملائي في #الأكاديمية_الدبلوماسية، وبقيادة أخي العزيز سعادة السفير الشيخ @humaidalmaani، ببدء العمل بالهُوِيّة البصرية للأكاديمية؛ ثمرة اشتغال عُماني خالص يجمع الرؤية والخبرة والحسّ المؤسسي في نسيج متماسك.\n\nالهُوِيّة أداة إستراتيجية لتعزيز الثقة، فإطلاقها مؤسّسياً يثبّت إطاراً اتّصالياً منضبطاً، يوحّد الرسالة، يرسّخ التموضع، ويضبط الحضور الوطني والدولي، ويحمي السردية الوطنية في زمن تزاحم الروايات وتعدّد الأصوات، ويصون الاتّساق المؤسّسي.\n\nوعلى المستوى الوظيفي، تتجسّد الهُوِيّة في إعداد عقل دبلوماسيّ، يرتكز على مرجعية وطنية راسخة، ويتقن إدارة التفاعل في النظام الدولي، فيغدو الحضور البصري انعكاساً لدور سياسيّ ووطنيّ متجذّر، وخطوة تعزّز التماسك الداخلي، وترسّخ أثراً حضارياً ممتداً.\n\nالهُوِيّة تموضع إستراتيجي يجسّد حضور سلطنة #عُمان الفاعل، ويكرّس مرجعيتها القيمية والتاريخية، ويعبّر مؤسسياً عن موقعها ودورها في فضاء إقليمي ودولي متغيّر، ليصبح الحضور البصري إعلاناً قيمياً وتأكيداً إستراتيجياً على ثبات عُمان وتميّزها.", "d": "١٩ فبراير ٢٠٢٦", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HBiDsDvXQAAFIHs.jpg", "f": "2024513037302943778-HBiDsDvXQAAFIHs.jpg", "v": false}], "iso": "2026-02-19"};</script>
