<script>window.__ENTRY__={"id": "2021551578927218906", "t": "ولايتي العزيزة #المضيبي.. لا أبحث عن المكان في ذاكرتي، المكان هو الذي يعود من الغياب.. يمدّ يده إليّ، ويعيدني كما كنتُ قبل أن أتعلّم الرحيل، والشوق يتسلّل مثل ضوءٍ متأخر عند حافة المساء، وظلّي يسبقني قليلاً، كأنه وصل قبلي بسنوات وبقي ينتظر.\n\nكان أذان الفجر يجيء ببياضه، سلامًا خفيفًا تطمئن به القلوب وتهتدي به الخطوات.. أبكّر إلى مدرسة المهنا بن جيفر (@edugovnsq6332 ، @muhnna6301 )، وأخترق الأزقة الضيقة بانتشاءٍ صامت، كأنها تتّسع لي وحدي.. ترافقني رائحة خبزٍ عُماني ساخن من خلف الجدران، يحفّها بخار الشاي الصباحي، ويُسابقها بخورٌ متفلّت.. تسرّب من دشاديش المارّين.\n\nالجدران الطينية صامتة، لكنها تعرف الجميع.. تحفظ ظلال من مرّوا، وعطراً بلا اسم، ودموعاً جفّت قبل أن تُقال.. وفي عمقها ما علّمني أن بعض القصص تُصان بالصمت، أكثر من خلاصها بالكلام!\n\nأعبر سواقي فلج (#الفرسخي) المغطاة قبل مرحلة الوصول؛ أتذكّرني شقيّاً في (الشريعة)، أتسلّل بين جدرانه الضيّقة المظلمة في (ثقابه) كما يتسلّل السرّ، حين كان المكان يفتح لي ممرّاته الخفيّة.. وكان الظلّ صديقاً، والعتمة لعبة لا تُخيف.\n\nوحين أصل.. أفتح خزانة الإذاعة المدرسية المتهالكة، أدير مسجّلٍ قديم.. فينساب صوت المنشاوي هادئاً.\n\nالمضيبي.. حين يضيق صدري، أعرف أن القلب عاد إلى هناك، ومشى طريقه دون أن يُسأل… ولم يخرج تماماً..\n\nفكلّ شيءٍ يبدأ من هناك من قبر #أمي..\nحيث الحبّ تعلّمته على مهل.. لا أبكيه، لكن كلّ هذا الحنين يحدث لأنّها هناك،\nولأنّ شيئاً منّي، منذ ذلك اليوم، لم يعرف كيف يغادر!\n..\nالمقطع من لقاء مع العزيز بوعلي المكرّم @Malmarjiby", "d": "١١ فبراير ٢٠٢٦", "door": "الإنسان كرامة", "dk": "karamah", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/amplify_video_thumb/2021549880074752000/img/rshTK9D_pYwGZqiX.jpg", "f": "2021551578927218906-rshTK9D_pYwGZqiX.jpg", "v": true, "vf": "2021551578927218906-pl-4xHGF8palZeSp.mp4"}], "iso": "2026-02-11"};</script>
