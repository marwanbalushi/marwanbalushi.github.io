<script>window.__ENTRY__={"id": "2079443755946357060", "t": "لا شيءَ في هذا الكونِ يحملُ ماضِيَه معه.. إلّا #الإنسان.\nالنخلةُ لا تحِنُّ إلى فسيلةٍ اجتُثَّت، والقمرُ لا يلتفتُ إلى ندوبه، والعصفورُ المهاجر لا يترك خلفه قلباً مُعلَّقاً على غصن..\n\nوحدَه الإنسانُ يمشي إلى غدِه ووجهُه إلى أمسه؛ يحملُ في صدرِه كلَّ يدٍ أفلتت من يدِه، وكلَّ بابٍ أُغلق قبل أن يعبُرَه، وكلَّ اسمٍ صار لا يُقالُ إلّا في الدعاء.\nنحنُ الكائنُ الذي يُوجِعُه الغياب، ويُتعِبُه الحنين، وتُبلِّلُه دمعةٌ على صورةٍ باهتة.. وهذا الوجعُ ليس ضعفاً فينا؛ إنَّه أنبلُ ما فينا، وأصدقُ دليلٍ على أنَّنا قد أحببنا.\n\nومهما تقدَّمت بنا الأيام، وصار العلمُ يقرأُ أجسادَنا كما تُقرأُ الكتب، فلن يصنعَ أحدٌ آلةً تشتاق، ولا جهازاً يحفظُ رائحةَ البيتِ الأول. يظلُّ القلبُ آخِرَ أرضٍ لم يبلُغها العلم؛ فيها وحدَها نُخبِّئُ مَن فقدناهم، ونُبقيهم أحياءً.\n\nفأجملُ ما في هذا الكائنِ العجيب.. أنا وأنت.. أنَّه يُحبُّ ليتذكَّر لا ليملكَ. وأنَّنا حين نمضي، لا نأخذُ معنا شيئاً.. سوى أنَّنا مررنا من هنا فأحببنا، وأنَّنا تركنا في قلوبِ مَن أحبُّونا دفئاً لا تُطفئُه السنون.\n\nما يبقى منّا؟ لا شيءَ تُمسِكُه قبضتُنا.\n..\nكلمة البرفيسور يحيى بن محمد الفارسي، عميد كلية الطب والعلوم الصحية بجامعة السلطان قابوس-الأسبق، ألقاها في حفل افتتاح المؤتمر العلمي العالمي الثامن لطلبة الطب بدول مجلس التعاون الخليجي 2017م.", "d": "٢١ يوليو ٢٠٢٦", "door": "الإنسان كرامة", "dk": "karamah", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/amplify_video_thumb/2079340210958008320/img/atO8YKutlPNEveZf.jpg", "f": "2079443755946357060-atO8YKutlPNEveZf.jpg", "v": true, "vf": "2079443755946357060-z9DuAkqa497I_yGe.mp4"}], "iso": "2026-07-21"};</script>
