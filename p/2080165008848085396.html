<script>window.__ENTRY__={"id": "2080165008848085396", "t": "٢٣ يوليو ١٩٧٠..\nفي صلالة، والخريفُ يُرخي رذاذه على السهل، يزحف الضبابُ من البحر إلى الجبل، فيُورق ما كان قَيْظاً..\nومن بابٍ لم يكن يدري أنّه سيصير تاريخاً، دخله #قابوس_بن_سعيد رجلاً وخرج منه سلطاناً.. فخرجت معه عُمان.\n\nكانت البلادُ يومَها ضيّقةً على أهلها، لا صغيرةً في تاريخها..\nبلادٌ عرفتِ البحرَ قبل أن تعرفه الخرائط، لكنّ الزمنَ تأخّر عنها.\n\nكان نهارُ مسقطَ يُقاس بالشمس، وليلُها بالبوّابة والسُّور..\nوفي بيتٍ من طين، أمٌّ تُنزل (الهاندوة) عن رأسها وتُفرغها في (الجَحْلةِ) المعلّقة..\nتُشعل النارَ في حرٍّ لا يحتمل ناراً.. فيندى جبينُها، تعجن طحينها ثم تمسح به وجه (الطُّوبج) لتصعد رائحةُ الخبز وتهرب من بين يديها إلى الباب..\nبابٌ لبيتٍ لم يكن فيه ما يُشترى، وكان فيه كلُّ ما يكفي.\n\nوحين تنسحب الشمسُ عن الجبل، تُغلَق البوّابة على المدينة، فمن تأخّر عن سورها.. أسندَ ظهرَه إليه، ونام في انتظار الصباح.\n\nولا يبقى في الليل إلا اهتزازُ سِراجٍ في يدِ ماشٍ يعرف أنّ ضوءه هو إذنُه بالمرور، يرفعه أمام وجهه ليُرى، لا ليرى..\nتكبر نقطةُ الضوء على الجدار ثمّ تصغر، حتى تبتلعها السِّكّة.\n\nوعلى سطوح البيوت.. همساتٌ صغيرة، وصغارٌ مستلقون يَعُدُّون زخّاتِ الشُّهْبِ حتى تغلبهم أعينُهم، لا يعرفون أنّ في تلك السماء نفسِها.. كان يُكتَب لهم فجرٌ آخر.\n\nوفي الغُربة، أبناءٌ يحفظون اسمَ بلدٍ لم يرَوْه، يسألون آباءهم عنه كلَّ مساء، وينتظرون كلمةً واحدة: عودوا.\nفنُودُوا.. فعادوا.. وبنَوا.\n\nولأوّل مرّة.. بقيت أبوابُ مسقط مفتوحةً بعد المغيب.\n\nوصار للسهل والجبل والبحر اسمٌ واحد.. سلطنة #عُمان.\n\nرحم الله سلطاننا الراحل وطيّب ثراه.. أعطانا وطناً، ومضى.. وما مضى منّا.\n\nواليومَ يبني سلطاننا المُفدّى #هيثم_بن_طارق عُمانَ الغد..\nالباني على ما بُني، الوفيُّ لمن أسّس.\n\nنُعلي أصواتنا ونرفع أكُفَّنا.. حفظه الله، وأدام على عُمان عزَّها، فما أرساه الأعزُّ.. يزيده الأوفى رسوخاً.", "d": "٢٣ يوليو ٢٠٢٦", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/amplify_video_thumb/2080129099826184193/img/DPDwwgnvSg-cgetZ.jpg", "f": "2080165008848085396-DPDwwgnvSg-cgetZ.jpg", "v": true, "vf": "2080165008848085396-iKNBJeoVS2AA5HVS.mp4"}], "iso": "2026-07-23"};</script>
