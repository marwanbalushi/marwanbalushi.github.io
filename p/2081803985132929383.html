<script>window.__ENTRY__={"id": "2081803985132929383", "t": "من يتابع المنصّات المختصّة في الشأن السياسي والعلاقات الدولية، يجدُ كلمةً واحدةً تتنقّلُ بين المتحدّثين.. \"#ضبط_النفس\".\n\nمنابرُ تعلو، ولغاتٌ تختلف، والنداءُ واحد..\nوأنا أُصغي جيداً، أستحضرُ أنّ أهدأَ المنعطفاتِ التي مرّت بها الأُمَمُ.. لم تُعلَن؛ فأبلغُ الكلامِ ما لا يُقال، وأقوى الردِّ ألّا تَرُدّ.\n\nفي هدوءِ غرفِ التفاوض تُصنع #التهدئة.. دون إعلانٍ ولا إعلام،\nوالامتناع عن الردّ فعلٌ لا فراغ، وأصعب ما يفعله القويّ؛ أن يملك الردَّ، فيختار الصمت.\nومن رأى في هذا الصمتِ ضعفاً، فإنّما عجزَ عن قراءته؛ فالصمتُ نصٌّ، والعجزُ عن قراءته أُميّةٌ أمام لغةٍ أرقى.\n\nفحين نرى دولةً تصمُت.. قد نتعجّلُ الحكمَ على ضعفِها، أو ربما نُنصِتُ جيّداً لما تقول وتشير إليه!", "d": "٢٧ يوليو ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HOQNIb2WwAADiHa.jpg", "f": "2081803985132929383-HOQNIb2WwAADiHa.jpg", "v": false}], "iso": "2026-07-27"};</script>
