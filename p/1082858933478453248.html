<script>window.__ENTRY__={"id": "1082858933478453248", "t": "الحديث عن القطاع الخاص، وجاذبيته للشباب العماني من خلال @ShabibaFM\n\nسأترك مجموعة تغريدات متتابعة عن أهم النقاط التي ذكرتها، وأرجو أن يكون القصد منها هي مصلحة الوطن بإنسانه ومؤسساته.. فقط لا غير.\n\n...\n..\n.\n\nوهذا مقطع يتضمّن المداخلات.. يتبع/1\n\nhttps://www.youtube.com/watch?v=c1Yl534cZrw\n\n1.لم يكن هناك أي عزوف من العُماني، وإنما المرحلة السابقة من بناء الدولة، جعل القطاع العام يتحمّل عبء البناء وحده، فاستوعب أعداد الباحثين عن عمل.\n2.باستقرار الدولة، بدأ القطاع الخاص يأخذ دوره في البناء شريكاً للعام.\n3.العُماني عنده رغبة أكيدة في بناء بلده، في كل الأعمال.. يتبع/2\n\n4.المؤسسة في القطاع الخاص.. هل لديها رغبة في استقطاب الكفاءة العُمانية؟\n5.المؤسسة يلزمها بناء علاقات عامة داخلية متماسكة وبيئة عمل جاذبة، وصناعة انتماء وولاء للمؤسسة، وهذا بالتدريب والحوافز والعديد من الأساليب والإجراءات التي تجعل الشاب يبقى لديها.. يتبع/3\n\n6.إشكالية التأمينات لما بعد التقاعد والفجوة المالية المترتَّبة، قد يعوّضها الأجر والحوافز والامتيازات العديدة أثناء فترة الخدمة.\n7.هناك مؤسسات في القطاع الخاص.. قادرة على الحفاظ على موظفيها بتطوير العلاقة بينها وبين العامل.. يتبع/4\n\n8.الجلوس على طاولة واحدة للحوار وتبادل القناعات والأفكار بين المشرّع والباحث عن العمل، وصاحب المؤسسة في القطاع الخاص.\n9.هل نريد قطاع خاص حقيقي وناجح أم أننا نريد تحقيق نسبة التعمين شكلياً؟!.. يتبع/5\n\n10.المؤسسة في القطاع الخاص ستتحمّل عبء توظيف شاب دون كفاءة لتغطية نسبة التعمين، فهو سيحتاج إلى تأهيل ورفع كفاءة وهذه تكاليف مالية وإدارية.\n11.الوظائف الدنيا انتهت مرحلتها بالنسبة للعُماني، هم كفاءات ذات جودة عالية جاهزة للوظائف العليا.. يتبع/6\n\n12.عُمان لن يبنيها إلّا العُماني، وبالتأكيد بمساندة من خبرات الوافدين الأصدقاء.\n13.ليس بالإمكان، استقدام رأس مال خارجي وأفرض عليه اشتراطاتي، لكن أفرض عليه كفاءاتي.. ينتقي الأفضل منها.. يتبع/7\n\n14.الكفاءات العُمانية في الخارجة أثبتت نجاحاً، ونفس البيئة التي أنتجت تلك الكفاءات للخارج، هي نفسها تنتج للداخل.\n15.الاستثمار من المؤسسات في القطاعين مهم بالتدريب والتأهيل.. والتمكين.. يتبع/ 8\n\n16.الكفاءة تأتي قبل الخبرة والتدريب، وثقتنا موجودة في القطاع الشريك الحقيقي في بناء البلد ويدرك حقيقة الكفاءات العُمانية.\n17.يلزمنا أن نصدّر إلى العالم الكفاءة العُمانية، مثلما نصدّر السياحة العُمانية للخارج.. ليعرفه المستثمر ويكسب ثقته قبل قدومه إلى السلطنة.. يتبع/ 9\n\n18.صناعة التعليم في عُمان هي أساس بناء الكفاءات والقدرات، وهذا ما تعمل الجهات المعنيّة.\n19.اللجنة الوطنيّة للشباب (وحسب صلاحياتها واختصاصاتها بالمرسوم السلطاني) قدّمت العديد من التوصيات ومن أهمها.. الإعلان عن السياسة الوطنيّة للتشغيل سنوياً..يتبع/10\n\n20.الإعلام العمُاني قائم على الكفاءات الوطنيّة، وهذا نجاح وفخر.\n21.التدريب على رأس العمل ملتزمة به اللجنة الوطنية للشباب، وذلك بتدريب عشرة من الباحثين عن عمل لديها ولمدة عام كامل، بأجرٍ شهري ثابت، وجميع الامتيازات الممنوحة للموظفين..يتبع/11\n\n22.قيام المؤسسات والقطاعات بتدريب عشرة ولمدة عام سيُوجد القدرات والكفاءات المتمكنة من شغل الوظائف مستقبلياً.\n23.عدم استمرارية علاقة الخرّيج بما درسه وأحبه بالتدريب والعمل، سيفقده المهارات والمعارف التي كسبها..يتبع/12\n\n24.الباحث عن عمل لا يركن إلى الظلّ، بل عليه تطوير مهاراته ومعارفه، ليُبقي شغفه بما درسه، ولو تأخّر التوظيف.\n25.يجب على أولياء الأمور والمعلمين في المدارس.. إبعاد الطلاب عن الإحباط من الحصول على الوظيفة مستقبلاً..يتبع/13\n\n26.اتركوا للطالب أن يعيش تجربة المدرسة بكل تفاصيلها، دون إرهاقه بفكرة البحث عن عمل مستقبلاً.\n27.هناك جهود مخلصة لتجاوز هذه المشكلة وإيجاد الحلول المناسبة للجميع.\n\n.. انتهى..", "d": "٩ يناير ٢٠١٩", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [], "iso": "2019-01-09"};</script>
