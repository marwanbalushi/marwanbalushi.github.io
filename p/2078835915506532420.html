<script>window.__ENTRY__={"id": "2078835915506532420", "t": "في أروقة العمل الدبلوماسيّ #العُمانيّ تعلّمتُ أنّ الكلمةَ تُوزَن قبل أن تُقال، وأنّ من يُنصت أطولَ يقرأ أعمقَ، ومن يقرأ أعمقَ يصل أبعدَ.\nودوليّاً؛ في خرائطِ الدبلوماسيّة مساراتٌ عديدةٌ ومفاتيحُ وصولٍ شتّى؛ ويفوز فيها من يقرأ الموقفَ بهدوءٍ، ويتكلّم بصوتٍ واثقٍ وهادئٍ.\n\nتقول الجغرافيا السياسيّة ما تقوله الحياة؛ المشاعرُ ليست حقائقَ. وتؤكّد السياسةُ أنّ العواطفَ ليست ما يحرّك العلاقاتِ بين الدول.\n\nالدولُ لا تحبّ ولا تكره؛ إنّها ترصد وتحسُب. حين تسمع عن \"صداقةٍ تاريخيّةٍ\" أو \"عداءٍ أزليٍّ\"، فتلك كلماتٌ تُجمّل المصلحةَ وتُخفي المكتومَ من تقاطعٍ وتباينٍ. وتحت الكلمات تبقى الحقيقةُ واحدةً.. أمنٌ ومكانةٌ وميزانُ قوى.\n\nمع اليقين أنّ للعاطفةِ ثأرَها وثمنَها، فحين تتراكم العواطفُ الشعبيّة كإهانةٍ للوطن أو حماسةٍ للفكرة، تدفع دولاً بأكملها إلى قراراتٍ تُؤذي مصلحتَها قبل خصمها. وكثيرٌ من الحروب تُشعِلها الكبرياءُ الجريحة. وصانع القرار، في نهاية المطاف، إنسانٌ لا آلةٌ.\n\nوهذا الدرس هيّنٌ على الدول الراسخة، القادرة على احتواء انفعالها وإن فاض فأغرق غيرها؛ لكنّه ثقيلٌ على دولٍ صاعدةٍ لا تملك هامشاً للخطأ. قوّتها في حُسن تقديرها؛ أن تفرّق بين ما تشعر به وما ينفعها، وأن تجعل الحوارَ جسراً لا منبراً.\n\nالعاطفةُ قد تكون الشرارةَ والخطوةَ الأولى؛ أمّا المصلحةُ فهي البوصلة والمنتهى.. تُقرَأ بهدوءٍ، وتُدار بحكمةٍ، فالأحكمُ أبعدُنا نظراً، لا أسرعُنا غضباً.", "d": "١٩ يوليو ٢٠٢٦", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HNmCKSEXQAA87Ru.jpg", "f": "2078835915506532420-HNmCKSEXQAA87Ru.jpg", "v": false}], "iso": "2026-07-19"};</script>
