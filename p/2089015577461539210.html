<script>window.__ENTRY__={"id": "2089015577461539210", "t": "ما إن يحتدم النقاش حتى يقول أحدهم: \"صارحني القول، لا تكن دبلوماسيّاً\"، وكأنّهما لا يجتمعان.. من هنا يبدأ سوءُ فهمِ هذا الجانب من العمل السياسي.\n\nفي المحافل الرسميّة، يزِنُ #الدبلوماسيُّ كلماته ليقول المعنى كاملاً.. هدفه وضوح الرسالة وتجنّب الضبابية؛ فتأويلٌ واحدٌ غامضٌ قد يوتّر العلاقات بين الدول.\n\nيحسبه بعضهم ليّناً لأنه يميل إلى التهدئة، لكنّ الهدوءَ نفسَه قوّةٌ وأعلى درجات الانضباط.. صبرٌ محسوبٌ، وصمتٌ في وقته، وجرأةٌ على المكاشفةِ الصَّادقةِ بلا مُواربةٍ حين يلزم.. وقد يكون أهدأُ الأصوات أصلبَها موقفاً.\n\nهو يتكلّم باسم دولته، لا باسمه.. وما يحسبه بعضهم تلوّناً هو هذا الفصل الاحترافيّ نفسه؛ رأيٌ شخصيٌّ مُدارًى، وموقفُ الدولةِ واضحُ البيانِ.\n\nويحسبُه بعضُهم وجهاً مبتسماً في الاستقبالات، وما الابتسامةُ إلّا واجهة؛ خلفَها تُدارُ حساباتُ الدول، وتُنسَجُ تحالفاتٌ صامتة، وتُصاغُ في غرفٍ مغلقةٍ كلماتٌ قد تُقرّرُ مصائرَ لعقود.\n\nوأثمنُ أعماله لا تُرى؛ أزمةٌ لم تقع، وتوتّرٌ خفَّ قبل أن يتفاقم، من دون أن ينتظر تصفيقاً.\n\nوهو ابنُ هُوِيّةٍ وثقافةٍ لا أسيرُ مراسمَ؛ يقرأ أدبَ الشعوب ليقرأ نفوسَها، ويرى في الفنّ جسراً يصِلُ حيث تعثُر السياسة، فرُبَّ قصيدةٍ قرّبت ما باعدته المفاوضات.\n\nوحضورُه في الفضاءات المفتوحة والافتراضية امتدادٌ للمحفل الرسميّ الرصين لا نقيضٌ له؛ يتبدّل الفضاءُ وتثبُت المرجعية.\n\nالدبلوماسيةُ فنُّ إدارة الكلمة، وموازنةُ الأمور بنظرةٍ واسعةٍ وعميقةٍ، والإصغاءُ بانتباهٍ عالٍ قبل الردّ.", "d": "١٦ أغسطس ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HP2mKbfWcAAPYSs.jpg", "f": "2089015577461539210-HP2mKbfWcAAPYSs.jpg", "v": false}], "iso": "2026-08-16"};</script>
