<script>window.__ENTRY__={"id": "2089232533279928819", "t": "الكتابةُ عن الفيلم بوصفه حكاية حبٍّ وذاكرة، لا بوصفه ملفَّ تاريخٍ ولا محكمةً لأحد؛ فما يعنينا هو ما يبقى في الإنسان بعد أن تنتهي الخرائط من عملها.\n..\n\n\"لو كان لديّ الخيارُ بين تركِ بيتي والموتِ، لاخترتُ الموتَ بنفسٍ راضيةٍ.. للأسفِ، لم يكن لديّ خيارٌ مثلُ هذا\".. لاجئٌ مجهول.\n\nالبيتُ رائحةٌ وظلالٌ وصوتٌ معلّق في سقفه، والخروج منه خروجٌ من النسخة الأولى منّا، وما يليها نسخٌ باهتة.\n\nوتقسيم الأرض يشطر الجيرة والعادة واللسان الذي كان يسع الجميع. خطٌّ يُرسَم في غرفةٍ بعيدة، ويدفع ثمنَه من لم يُستشَر، والطائفية تأتي بعد الخط. قُسِّم الناس أولاً، ثم تكارهوا.. والكراهية تبحث عن الأضعف لتثبت نفسها، ولهذا كانت النساء أوّلَ الثمن.\n\nولا يُسمّي الفيلم طائفة القاتل. يجرّده من دينه ويترك الجريمة عاريةً بلا عنوان، لأن من يمنح الكراهية اسماً؛ يمنحها ذريعةً للتكرار.\n\nنحسب أن التهجير يأخذ البيت والأرض.. الأصدق أنه يأخذ القدرة على الحنان.\nمن يُجبَر على دفن ماضيه يدفن معه جزءاً من قلبه ليبقى حيّاً، فينجو بلا دفء.. وبه ينتقل المنفى من جيلٍ إلى جيل، ليس في الحكايات وحدها بل حتى في الصمت.\n\nولهذا يخاف الكبار من الرواية.. يقولون إن الحكاية إذا رُوِيت صارت سلاحاً في يدٍ لم تعشها.. والتاريخ الذي يُروى بلا إنسانية يترسّب في النفوس سُمّاً.. والحبُّ إذا مات مع أصحابه، صارت الكراهية وحدها ميراث الأجيال.\n\nفي الفيلم رجلٌ يحمل على معصمه وشماً باسم من أحبّ وبلغة أرضٍ كانت تسكنه.. حين تُصادَر الأوراق كلها، الهُوِيّات وصكوك البيوت، يكتب الإنسان وثيقتَه على جسده.. فالذاكرة آخرُ مستندٍ يعجز خطُّ التقسيم عن إبطاله.\n\nوحين تنتهي القصّة وتبدأ أغنية النهاية، تظهر وجوه المهجَّرين، من فلسطين وغيرها من الأوطان التي قطعها الألم ولم يستطع الأمل أن يجمع شتاتها.. تهجيرٌ وقصفٌ وانتهاكاتٌ لا تُحصى، نصيبُهم من حدودٍ لم يرسمها أهلُها.\n\n\"سأعود\" (Main Vaapas Aaunga).. فيلمٌ هنديٌّ يمنحك المتعة، ويترك بريق أسئلةٍ في عينيك عن الحبّ والذاكرة والأرض الأولى. شاهده، ولا تدع أحداً يحكيه لك قبل ذلك.\n\nوكما قالت (جيا): \"القصيدة أفضل بصوت الشاعر\"، فقرأها (إيشار سينغ) قبل الرحيل الأخير.\n\nالحدود تُرسَم في ساعات.. والجراح تُداوى في أجيال، إذا دُووِيت.", "d": "١٧ أغسطس ٢٠٢٦", "door": "الإنسان كرامة", "dk": "karamah", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HP5h6ixXIAAW9-N.jpg", "f": "2089232533279928819-HP5h6ixXIAAW9-N.jpg", "v": false}], "iso": "2026-08-17"};</script>
