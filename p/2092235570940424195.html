<script>window.__ENTRY__={"id": "2092235570940424195", "t": "نكتب عن الفقدِ خشيةَ أن ننسى شوقَنا، وأن تتحجّرَ في قلوبنا ذكراهم!\n..\nالخامسة مساءً/ الخميس ٢٥ أغسطس ٢٠٢٢/ المستشفى السلطاني.مسقط\n\nأربعُ سنينَ..\nوكأنّ الفقدَ طريُّ الوجعِ..\nوكأنّ صوتَ الموتِ أكثرُه تسبيحٌ، وأقلُّه أنِينٌ..\n\nأربعُ سنينَ..\nموجةُ صمتٍ..\nتتبعها موجةٌ عاصفةٌ تكسر أنفاسي.. مع كلِّ خاطرٍ بها يأتي،\nويهزمني الشَّوقُ إليها مع كلِّ صلاةٍ.\n\nمع كلِّ مساءٍ أنتظرُ صوتَها..\nأستحثُّ الهاتفَ أن يطرقَ قلبي،\nأن ينتشلَني من غرقِ الانتظار.. سؤالُها عنّي.\n\nكلّ مرّة..\nأنتظركِ لأقول: أحبّكِ.\n\nأمّي..\nمن بعدكِ القلبُ..\nتهشّمت سماؤه،\nواعتلّت في السديمِ غُرَفُه،\nوانغلقت على اللاشيء.. شبابيكُه الصغيرة.\n\nأمّي..\nلم أتجاوز ألمكِ الأخير..\nوعطرَ الوردِ الأخير..\nوهدوءَ رحيلكِ الأخير.\n\nرحمكِ ربي.. وألحقني بكِ مشتاقاً.\n..\n\nلأمّي، ولموتاكم ولموتانا جميعاً..\nدعوةٌ في ظهرِ الغيبِ.. علّها تصلُ.", "d": "٢٥ أغسطس ٢٠٢٦", "door": "الإنسان كرامة", "dk": "karamah", "f": "waqfah", "m": [], "iso": "2026-08-25"};</script>
