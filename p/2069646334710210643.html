<script>window.__ENTRY__={"id": "2069646334710210643", "t": "[المعلّمُ مهندسُ الوعي، وحارسُ الوجدان]\n\nأستاذي العزيز عليّ العامري.. من جملةِ الأساتذةِ الصادقين فيمن علّمونا،\nالمؤمنين بأنّ في التعليمِ رسالةً فوق الوظيفةِ وراتبها.\n\nحينَ انتقلنا إلى الثانويةِ في مدرسةِ \"المهنّا بن جيفر\" @muhnna6301 بولايةِ #المضيبي..\nلم يخفَ على زملائي أنّي الطالبُ الأثيرُ لإدارةِ المدرسةِ..\nكوني من الأوائلِ، ورئيسَ جماعةِ الإذاعةِ، والمتحدّثَ في المناسباتِ التربويةِ واحتفالاتِ الولايةِ،\nوكان ذلك يحميني من عصا أستاذِنا العزيزِ طارقِ أبي الطيّبِ مديرِ المدرسةِ،\nحين يظهرُ منّي في بعضِ المواقفِ شيءٌ من شقاوةِ الطفولةِ قد تسرّبَ إلى شبابي،\nأو ربّما شَغَبِ المراهقين، بحثاً عن ذاتٍ في خِضَمِّ يومٍ دراسيٍّ مزدحمٍ بالتفاصيلِ والأحلامِ والدهشاتِ..\n\nوفي أوّلِ حصّةٍ -إن لم تخنّي الذاكرةُ - لمادةِ الرياضياتِ، وأمام مشاكستي، وقف وحدَه بشدّةٍ وحزمٍ وصوتٍ غاضبٍ لا أنساه،\nكان عقابُه درساً مختلفاً لم يكن في الكتابِ؛ توجيهاً وإرشاداً أكرمني به،\nوأرحمَ من أن تعلمَ أسرتي ببعضِ مشاغباتي.\n\nولعلّ ما جعل توجيهَه الصارمَ لي في ذلك الصباحِ ذا أثرٍ في تعامله معي لاحقاً،\nأنّي كنتُ متيّماً بمسائلِ الرياضياتِ، ومعادلاتِ الكيمياءِ، وقياساتِ الفيزياءِ.\nلذلك جعل بكلِّ روحٍ مخلصةٍ مسائلَ الرياضياتِ مساحةَ تحدٍّ لا تنتهي، خاصّةً تلك التي تنتهي بالبرهانِ.\n..\nأستاذي العزيز.. فخورٌ بك.\nأستاذي العزيز.. شكراً لك.\nأستاذي العزيز.. نحن بعضُ ما غرستَ.\n\nأسألُ اللهَ أن تكونَ في ميزانِ حسناتك.", "d": "٢٤ يونيو ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HLjFCCtWMAE3faC.jpg", "f": "2069646334710210643-HLjFCCtWMAE3faC.jpg", "v": false}], "iso": "2026-06-24"};</script>
