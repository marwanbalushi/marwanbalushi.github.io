<script>window.__ENTRY__={"id": "2082118620885160029", "t": "بدأ هذا من تواصلٍ مع الباحث الأكاديمي العزيز @abdullahmaani حول صورةٍ من اجتماعٍ لوزراء الخارجية.\n\nفي \"الاتصالات السياسية\"، كلُّ مفردةٍ في المشهد قد تُوصِل رسالة، ولها غايةٌ كما للمواقف.\nومعالي السيّد @badralbusaidi يختار أن يُعرّف بعُمان عبر موقعها.. اختيارٌ في الإطار، ورسالةٌ في الاتصال السياسي، لتصل الرسالة العُمانية واضحةً مع تقليل التأويلات التي تشوّه القصد وتشوّش المتلقّي.\n\nفي الصورةِ، كلُّ جزءٍ قابلٌ للقراءة المتأنية. وهي وجهٌ من \"إدارة الانطباع\"، وأداةٌ من أدوات الاتصال الإستراتيجي.\n\nالدولُ تُصمّم حضورها البصري مثلما تصيغ بيانها، ضمن حضورها الاتصاليّ.. فالقيمةُ في قراءة المشهد.. وفي زمن الصورة، من أهمل الإطار أهمل نصف الرسالة. \nوقراءةُ الصور مهارةٌ في العمل الدبلوماسي، تُكتسب بالتأمّل والانتباه.\n..\nالعزيز الأنيق عبدالله المعني من الكفاءات الأكاديمية الرائعة في العلاقات الدولية والعلوم السياسية؛ ومن مثله يُثري الحوار.", "d": "٢٨ يوليو ٢٠٢٦", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HOUrDtYXEAAP4h2.jpg", "f": "2082118620885160029-HOUrDtYXEAAP4h2.jpg", "v": false}], "iso": "2026-07-28"};</script>
