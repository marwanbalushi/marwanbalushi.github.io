<script>window.__ENTRY__={"id": "2079090420101919131", "t": "على نقحةِ (دقّةِ) طبلِ #فرقةِ_الشهامةِ، تتهادى أقدامُ العرسان.. يصطفّون على منصّةِ الفرح،\nويُطلقونها ثلاثاً من القلب: قبلتُ.. قبلتُ.. قبلتُ،\nوهنّ بخجلٍ وصوتٍ خافت: ق..ب..لتْ.\n\nوبين القبولِ والطبولِ في (العرس الجماعي الثامن)..\nستكبُرُ الألفةُ كلما قُسِّمَت، وسيبقى الخيرُ أجملَ حين يجتمعُ عليه الناس..\nلذلك يقول أخي العزيز @HabsiAhmed رئيس @almudhaibiwedd1:\n\"لم ندعمْ فعاليةً فقط، بل ساهمنا في بناءِ بيوت، وتخفيفِ أعباء، وصناعةِ فرحٍ حقيقي\".\n\nكان العرسُ في #المضيبي بسيطاً، وإن أثقلته الأيامُ بتكاليفها..\nصاحبُ السيارةِ يُزيّنها لعريسٍ لا تجمعه به إلّا تحيّةُ الطريق،\nوالنساءُ لا يتأخّرنَ عن تجهيزِ ولائمِ الفرح..\nورائحةُ القبوليِّ الزكيّةُ تسبقُ الضيفَ إلى البيت، تتسلّلُ من شبابيكِ الأزقّةِ كأنها تُنادي: تعالَوا، ها هنا فرح.\n\nفباركَ اللهُ للعرسان، وأدامَ على ولايتي هذا العطاءَ والفرح..\nفالبركةُ في اجتماعِ الناسِ على الخيرِ والعطاء. \n\n#خطوة_الخير_تتبارك", "d": "٢٠ يوليو ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/amplify_video_thumb/2078936657927995392/img/qv8sWfca8a3P-euz.jpg", "f": "2079090420101919131-qv8sWfca8a3P-euz.jpg", "v": true, "vf": "2079090420101919131-EVM8E-JeQzCMvr5c.mp4"}], "iso": "2026-07-20"};</script>
