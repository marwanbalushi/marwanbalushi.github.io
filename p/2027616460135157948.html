<script>window.__ENTRY__={"id": "2027616460135157948", "t": "به باور من، این خلط از آن‌جا ناشی می‌شود که پرهیز از مداخله با جانبداری یکسان انگاشته می‌شود. \n\nسیاست خارجی عمان بر احترام به آنچه جوامع برای خود برمی‌گزینند و تعامل با دولت‌ها بر پایه اصل حاکمیت و حسن همجواری استوار است، و از مهندسی نظام‌ها یا جهت‌دهی به انتخاب ملت‌ها فاصله دارد.\n\nاین رویکردی ثابت است که با تغییر نظام‌ها دگرگون نشده است؛ در سال ۱۹۷۹ عمان از اثرگذاری بر روند داخلی ایران خودداری کرد و روابط خود را بر اساس آنچه مردم ایران برگزیدند حفظ نمود، همان‌گونه که پیش و پس از آن نیز با همه کشورها چنین کرده است.\n\nقرار دادن نقش عمان در چارچوب جانبداری، خوانشی نادقیق پدید می‌آورد. عمان با ملت‌ها با احترام و با دولت‌ها با واقع‌گرایی مبتنی بر حاکمیت تعامل می‌کند و می‌کوشد از لغزش منطقه به سوی درگیری آشکار جلوگیری کند؛ درگیری‌ای که هزینه‌اش را همگان می‌پردازند.\n\nثابت در این مسیر، اصل است نه جابه‌جایی موقعیت‌ها؛ اصلِ احترام به حاکمیت و پاسداشت ثبات. جنگ زندگی مردم را بر ویرانه‌های سیاست بازچینش می‌کند؛ بهای آن خون، شهرهای ویران و خانواده‌های آواره است، و پیامدهایش فراتر از طرف‌های درگیر رفته و ملت‌ها را دربرمی‌گیرد. \nجلوگیری از این لغزش مسئولیتی است مقدم بر هر محاسبه‌ای، زیرا هزینه رویارویی در نهایت بر دوش انسان است، نخست و واپسین.", "d": "٢٨ فبراير ٢٠٢٦", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HCOKak_WUAAz0hT.jpg", "f": "2027616460135157948-HCOKak_WUAAz0hT.jpg", "v": false}], "iso": "2026-02-28"};</script>
