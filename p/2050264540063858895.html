<script>window.__ENTRY__={"id": "2050264540063858895", "t": "21 سبتمبر 1833.. في #مسقط؛ وُقِّعت أوّل معاهدة بين الولايات المتّحدة #الأمريكية ودولة عربية.\n\nأبريل 1840.. في ميناء #نيويورك؛ رست السفينة العُمانية \"#سلطانة\"، أوّل سفينة عربية تعبر المحيط تبلغ الضِّفّة الأخرى.\n\nقرنان ونَيِّف.. في أمريكا تعاقبت الإدارات والأحزاب والحِقب، وما اهتزّت الصِّلة بعُمان، لأنها مبنيّةعلى الدولة، وعلى مؤسّساتها الرّصينة.\n\nفي سلطنة #عُمان.. رسوخُ السياسة الخارجية وثباتُ صداقاتها ليسا رَدَّ فعل.. إنّهما إرث،\nإرثٌ تواصل البناء عليه مع الولايات المتّحدة #الأمريكية، خِدمَةً للسلام والاستقرار الدوليّ.", "d": "١ مايو ٢٠٢٦", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HHQAuswWAAAwcLv.jpg", "f": "2050264540063858895-HHQAuswWAAAwcLv.jpg", "v": false}, {"u": "https://pbs.twimg.com/media/HHQAf6iXIAEzIsp.jpg", "f": "2050264540063858895-HHQAf6iXIAEzIsp.jpg", "v": false}], "iso": "2026-05-01"};</script>
