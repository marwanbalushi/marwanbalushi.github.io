<script>window.__ENTRY__={"id": "1723377983266988426", "t": "برغم أن الكلمات فقدت الكثير من بريقها وهي مغموسة بدماء أهلنا في فلسطين، لكننا موجودون في المحافل الدولية من أجل إعلاء صوتنا بالحقّ والعدل الذي يستحقه الفلسطيني في وطنه وبين أهله، وليس مهجّراً في غير أرضه.. غريباً!\n\nمن عاصمة المملكة العربية السعودية الشقيقة؛ الرياض، معالي @badralbusaidi  يلقي كلمة وطننا العزيز سلطنة #عُمان في القمة العربية الإسلامية #قمة_التضامن_مع_فلسطين.\n\nإننا نألم لألم أهلنا، ونساند خياراتهم الوطنية الإنسانية والأخلاقية لاستعادة حقوقهم المشروعة في وطن اسمه \"تاريخياً\" #دولة_فلسطين!\n\nوما يحدث في قطاع غزّة هو مجزرة وحشيّة تفوق تصوراتنا عن مصطلح #الإبادة_الجماعية وقد طفح الكيل بما يأثمون ويجرمون، وكلّ هذا بدعم دولٍ نحسبها تحمي القانون الدولي وحقوق الإنسان، ناسفةً القيم العالمية والقرارات الأممية.\n\nفهي لا تجد السلام والاعتراف بدولة فلسطين حلّاً جديراً باهتمامها، بينما قوات الاحتلال تدّك المستشفيات والمدارس ودور العبادة، وتقصف المدنيين الأبرياء، وتقتّل بكلّ صلف الأطفال والنساء، متجاهلةً القوانين الدولية.", "d": "١١ نوفمبر ٢٠٢٣", "door": "دبلوماسيّة", "dk": "diblomasi", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/F-qrGanaYAAoe1j.jpg", "f": "1723377983266988426-F-qrGanaYAAoe1j.jpg", "v": false}, {"u": "https://pbs.twimg.com/media/F-qrGdZaAAARCoP.jpg", "f": "1723377983266988426-F-qrGdZaAAARCoP.jpg", "v": false}, {"u": "https://pbs.twimg.com/media/F-qrGkUbgAAZ_GW.jpg", "f": "1723377983266988426-F-qrGkUbgAAZ_GW.jpg", "v": false}], "iso": "2023-11-11"};</script>
