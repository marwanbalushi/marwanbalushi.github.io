<script>window.__ENTRY__={"id": "2032904941472469183", "t": "في #فزح، الفجر يأتي متأخراً قليلاً .. يتعثّر بين الجبال قبل أن يصل، والماء يجري قبله، والنخل يعرف الضوء قبل أن يراه. \nفي تلك اللحظة الهادئة بين الليل والنهار.. حيث الجبل لا يزال نائماً، والفلج لا يزال يُحدّث نفسه.. يشبه المكان الإنسان الذي أنجبه؛ #هزاّع_الريسي من هناك.\n\nذهبتَ بعيداً يا بومحمد.. إلى حيث تُبنى علاقات الدول وتلتقي المصالح، وتجلس الأمم في غرفة واحدة محاولةً أن تتفاهم، وكنتَ هناك تحمل #عُمان في صوتك، وفزح في قلبك، دون أن تعلن أياً منهما.\n\nكان المستقبل يتجهّز لك يا بومحمد، وكنتَ تستحقه؛ كفاءة بنيتَها بصبر، وأداء دبلوماسي لفت من هو أكبر منك ومن هو أبعد، وشيء في طريقتك يجعل الناس يثقون قبل أن تتكلّم.\n\nوفي وزارة الخارجية قبل ذلك، كنتَ تعرف متى ينتهي النهار.. ليس بالساعة، إنما بموعد الصلاة، وكان في العديد من المرّات.. نوّاف البلوشي ينتظرك في المصلى كما اعتدتَ أن تؤكّد عليه ثمّ تلحقه لتصلّيان معاً، نوّاف الآن يقف في المصلى ويتذكّر يا أبا محمد.\n\nآخر مرة سمعتُ صوتك يا هزّاع قبل أسابيع، كنتَ تشكر الله.. لا تتذمّر، ولا تُثقل الشكوى.. فارقتني بالدعوات ووعد مني بزيارتك في \"أول فرصة أرجع عُمان.\" \nأعرف الآن أنك كنتَ تعطيني شيئاً أحمله، لا وعداً تنتظره.\n\nرحمك الله يا بومحمد.. نمّ في سلام وعيدك مبارك في الجنّة.", "d": "١٤ مارس ٢٠٢٦", "door": "الإنسان كرامة", "dk": "karamah", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/amplify_video_thumb/2032904739281842181/img/V9UU2xzBQ_UEwFQI.jpg", "f": "2032904941472469183-V9UU2xzBQ_UEwFQI.jpg", "v": true, "vf": "2032904941472469183-Q0hmkMep7E7ztzfG.mp4"}], "iso": "2026-03-14"};</script>
