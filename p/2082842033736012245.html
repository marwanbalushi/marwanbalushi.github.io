<script>window.__ENTRY__={"id": "2082842033736012245", "t": "استوقفتني الصورةُ في حساب سفارتنا بالقاهرة (@OmanEmbassyEG)..\nفعلى ضفّة النيل بالزمالك، استقبل العزيزُ سعادةُ @anrahbi1  سعادةَ سفيرِ الهند،\nتحت قوسٍ إسلاميٍّ مدبَّبٍ على الطراز العُمانيّ؛ قوسٍ تحمل ذائقتُه روحَ العمارة التي نعرفها من قصر جبرين.\nولعلّ ما يجمع هذا المشهدَ ليس المكانَ وحده، بل رائحةٌ قديمة.. اللُّبان.\nفمن جبال ظفار في جنوب عُمان، خرج اللُّبانُ منذ آلاف السنين، يعبُر البحارَ والقوافلَ على ما عُرف بـ\"طريق اللبان\".\nبلغ عبيرُه معابدَ الفراعنة على ضفاف هذا النيل نفسِه، ووصلت تجارتُه إلى سواحل الهند.\nعطرٌ واحدٌ لامس الأرضَ الثلاث؛ نبتَ في عُمان، وتقدّس في مصر، وعبَر إلى الهند.\nفوقوفُ سفيرِ عُمان وسفيرِ الهند على ضفّة النيل ليس التقاءً أوّلَ؛ إنّما هو استئنافُ طريقٍ عطّره اللُّبانُ قبل أن تُرسَم الحدود الحديثة.\nوما كان يحمله شراعُ التاجر قديماً، تحمله اليوم كلمةُ السفير.. ودٌّ يصل بين الحضارات.\nومن خلفهما يمتدّ النيلُ هادئاً كأنّه يُصغي؛ فتلتقي في اللحظة مياهٌ مصرية، وعطرٌ عُماني، وفلسفةٌ هندية.\nثلاثتُها عريقةٌ يجمعها اليوم قوسٌ واحد، كما جمعها قديماً عطرٌ واحد.\nلقاءٌ قصير، لكنّه استئنافٌ لصداقةٍ أقدمَ من الأجندة الدبلوماسية.", "d": "٣٠ يوليو ٢٠٢٦", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HOe9EvcXkAE-m4A.jpg", "f": "2082842033736012245-HOe9EvcXkAE-m4A.jpg", "v": false}], "iso": "2026-07-30"};</script>
