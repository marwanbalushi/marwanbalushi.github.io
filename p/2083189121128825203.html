<script>window.__ENTRY__={"id": "2083189121128825203", "t": "اقترِبوا يا صغاري.. تعالَوا. اجلِسوا قربي، على مَهَل.\nفي صندوقي الخشبيِّ العتيقِ صورةٌ صفراءُ، نامَتْ بجانبِه سنينَ طِوالاً، حتى فاحَتْ منها رائحةُ الزمنِ وأنفاسُ العابرين.\n\nفيها طفلة. طفلةٌ نبتَتْ من سنديانةٍ بقِدَمِ الوطن.\nخلفَها مدينةٌ لم تترُكْ منها آلاتُهم غيرَ الغبار.\nلكنّ الشمسَ - وحدَها الشمسُ - نزلَتْ على خدِّها الأسيل، فأزهرَ، وحلا كبرتقالِ يافا.\n\nأترَون عينَها الصغيرة؟\nانظروا.\nعينٌ واحدة.. حجبَتْ مدينةً كاملة.\nحجبَتْ حيّاً ينهار.. جداراً. جداراً. جداراً.\nوجسداً يسقط.. لكنّها بقيَتْ!\n\nجزءٌ من وجهٍ صغيرٍ.. بقي!\nكأنّ العدسةَ عرفَتْ. عرفَتْ ما لم نعرفْه بعد.\nقالتْ يومَها: سيُكنَسُ الدمار. وقد كُنِس.\n\nانظروا! من النافذة! الآن!\n\nلم يبقَ من ذلك كلِّه إلّا هذه الصورةُ الصفراءُ بين يديّ،\nووجهٌ صغيرٌ كبِرَ على مَهَلٍ، عبرَ سنينَ طوالٍ ثقال.\nوالخدُّ الذي أزهرَ في شمسِ ذلك الصباحِ البعيد، تجعّدَ على مُهلةٍ طويلة.\n\nمرّتِ السنون. ذهبَ الغبار. بقيَتِ الصورةُ. وبقيَتْ سنديانةٌ.. لا تزالُ خضراءَ.\nوبقيَتْ تلك الطفلةُ الجميلةُ.. هي أنا!\n..\nالصورة من حساب الكريم. @OliveZaytoun", "d": "٣١ يوليو ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HOjlQrxWIAAyBVR.jpg", "f": "2083189121128825203-HOjlQrxWIAAyBVR.jpg", "v": false}], "iso": "2026-07-31"};</script>
