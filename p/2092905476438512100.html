<script>window.__ENTRY__={"id": "2092905476438512100", "t": "القراءةُ أولاً، ثم القراءة، ثم القراءة وبعدها تأتي الكتابة.\nهي التي تؤسّس الطفلَ وتبني معارفَه وتُنمّي خيالَه وتُغذّي لغتَه، وأثرُها في الصِّغَر يبقى العمرَ كلّه.\n\nفي بعض مدارس سويسرا عنايةٌ بالطفل تستحقّ التقدير.. أربعةُ كتبٍ يستعيرها كلّ أسبوعين من #مكتبة_المدرسة، يقرؤها ثم يحدّث زملاءه عنها؛ وورقةٌ واحدة في مطلع الأسبوع يسرد فيها أنشطته في العطلة الأسبوعية.\n\nقراءةٌ يعقبها حديث، وحديثٌ تعقبه كتابة..\nهكذا تُبنى اللُّغة.. عادةً يوميّة تُعاش.\nوهذه العادةُ يصنعها #المعلّم الذي يفتح الكتاب أمام تلاميذه أولاً.\n\nومن هنا تحيّةٌ وشكرٌ للمعلّمين والمعلّمات في وطني العزيز سلطنة #عُمان،\nالذين يحثّون أطفالنا على القراءة ويزرعون فيهم شغفَ السؤال.\n\nما تصنعونه اليوم في صفوفكم يُقرأ أثرُه بعد عشرين عاماً..\nبُوركت الجهود المخلصة.", "d": "٢٧ أغسطس ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HQt-bktXYAAoHJN.jpg", "f": "2092905476438512100-HQt-bktXYAAoHJN.jpg", "v": false}], "iso": "2026-08-27"};</script>
