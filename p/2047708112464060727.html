<script>window.__ENTRY__={"id": "2047708112464060727", "t": "يدٌ تمتد نحو يدٍ نحتها الزمن وأثقلها العمر،\nتمسكها كمن وجد ما كان يبحث عنه..\nتنحني حتى تلتقيا في مستوى واحد،\nوتنصت بعينين تقرآن في التجاعيد حكايةً كتبتها الحياة بأطول سطورها..\nومن جلست أمامها أدركت، في تلك اللحظة وحدها،\nأنها أمام قلبٍ أتى إليها، قبل أن يكون أمامها مقام [#السيدة_الجليلة #عهد بنت عبدالله البوسعيدية قرينة مولانا السلطان #هيثم_بن_طارق المُفدّى].\n\nدرست الناسَ علماً، وأحبّتهم طبعاً..\nوحين تجلس بين أبناء الوطن في مجالسهم،\nتُنصت قبل أن تتكلم، وتسأل قبل أن تُجيب،\nلا يشعر من أمامها أنه يُحدّث السيدة الجليلة،\nيشعر أنه يُحدّث وطنه،\nومن يحمل الوطن بهذا الصدق..\nيستحق أن يُحمل بأعلى ما فينا من نبل!\n\nإنّ حضور سيدّة عُمان الجليلة يُعمّق المعنى الحقيقي.. حيث العطاء يسبق الكلام في التعليم والمرأة والأسرة والبيئة، والأثر يبقى بعده.\n\nفي ديننا الحنيف، وفي أعرافنا العربية..\nقبل القانون، وقبل الخطاب..\n(حرمة المرأة مقدّسة)،\nفكيف بمن تحمل اسم الوطن؟!\nوالمروءة لا تكتمل بصون المقام وحده،\nإنما بما يحمله القلب من تقدير قبل أن يُملي عليه العرف!\n\nمجتمعٌ يعرف قدر رموزه،\nيعرف قدر نفسه..\nوحين يصون كرامة من يحملون اسمه\nيصون ما تبقّى من معنى الانتماء،\n[ومن ينسى حين يُقصَّر في حق رموزه لا يحمي قِيَمه.. إنّه يتخلّى عنها!]\n\n[لكِ سيدتي الجليلة.. كلّ التوقير.]\n\nوعُمان التي تحملين اسمها..\nترى في صدق عطائك، وعمق حضورك.. ما لا تُحيط به العبارات.\nمقامك راسخٌ.. كما رسخت هذه الأرض،\nلا تهزّه الكلمات،  يعلو على كلّ ما قيل.\n\nاليد الكريمة التي تمتد نحو الناس..\nبهذا الصدق،\nلا تحتاج من يرفع قدرها..\nفقدرها يسبقها أينما حلّت!", "d": "٢٤ أبريل ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HGrrq0ebUAAMTlp.jpg", "f": "2047708112464060727-HGrrq0ebUAAMTlp.jpg", "v": false}], "iso": "2026-04-24"};</script>
