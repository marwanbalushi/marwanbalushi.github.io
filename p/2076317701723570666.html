<script>window.__ENTRY__={"id": "2076317701723570666", "t": "\"من وحي المدرسةِ السياسيّةِ العُمانيّةِ..\"\n\nنبني سياستنا الخارجيّةَ على استقلاليّةِ القرارِ والنأيِ عن سياسةِ المحاورِ.\nوهو خيارٌ إستراتيجيٌّ محسوبُ الكلفةِ والعائدِ، اتّسق مع نفسه عبر العقودِ.\nومعيارُ فاعليّتِها أثرُها العمليُّ وقُدرتُها على الفعلِ؛ فالحفاظُ على قنواتِ اتّصالٍ مفتوحةٍ مع الأطرافِ كافّةً -بمن فيهم المتخاصمون- يجعل من عُمانَ مساحةً موثوقةً للتلاقي، ووسيطاً هادئاً يُطلَبُ.\n\nوالوساطةُ والمساعي الحميدةُ عندنا ثمرةُ ثقةٍ متراكمةٍ تنضج حين تسمح الظروفُ، لا منصّةٌ نتصدّرها؛ نُصغي دون أن نفرضَ أجندةً، ونلزم قضايا جوارِنا دون أن نطلبَ صدارةَ كلِّ ملفٍّ.\nوندعم مساعيَ السلامِ حيثما انعقدت وأيّاً كان القائمُ بها، بصرفِ النظرِ عن مصدرِها.\n\nأمّا التوازنُ فهو في جوهرِه تموضعٌ نَشِطٌ؛ يحفظ حُرِّيّةَ القرارِ الوطنيِّ، ويُبقِي هامشَ المناورةِ مفتوحاً، ويُجنِّبُنا كلفةَ الاصطفافِ.\nوبهذا يَبقى حيادُنا موقفاً فاعلاً في خدمةِ الاستقرارِ الإقليميِّ، ورصيداً قيمتُه في دوامِه واتّساقِه.", "d": "١٢ يوليو ٢٠٢٦", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HNCOguBXUAAfknx.jpg", "f": "2076317701723570666-HNCOguBXUAAfknx.jpg", "v": false}, {"u": "https://pbs.twimg.com/media/HNCOcMzXwAApZqh.jpg", "f": "2076317701723570666-HNCOcMzXwAApZqh.jpg", "v": false}], "iso": "2026-07-12"};</script>
