<script>window.__ENTRY__={"id": "2073331351848174027", "t": "في المجلسِ #العُمانيّ،\nنُصعِدُ الخلافَ إلى الأنأى هوىً لا إلى الأعلى صوتاً؛\nفمَن تنزّهَ عن الخصومةِ، استحقَّ أن يَزِنَها.\n\nوالمجلسُ وطنٌ مُصغَّر، والوطنُ مجلسٌ اتّسعَ؛ فلمّا امتدّتِ العائلةُ حتى صارت عُمان،\nلم تُبدِّل سجيّتَها، وإنّما سَمَتْ بها من زاويةِ البيتِ إلى مقامِ الدولةِ.\n\nمن هذا الجذرِ نبتَ الحيادُ العُمانيّ..\nضميرٌ توارثَتْهُ المجالسُ قبل أن تُمليَه الطاولاتُ،\nيتجرّدُ ليَعدِلَ، ويحضُرُ ليُنصِفَ؛ حياده عن أدواتِ الخصومةِ، ورسوخُهُ على قضايا الحقِّ.\n\nلا يُكثِرُ خصومَهُ ليبدوَ قويّاً، فمَن جمعَ الأعداءَ إنّما جمعَ خوفاً يتوارى خلف صخبِهم؛\nأمّا الراسخُ على الحقِّ، فكالجذرِ.. كلّما عَتَتِ العاصفةُ فوقه، ازداد في الأرض تجذّراً.\n\nهي حكمةُ الشيخِ في مجلسهِ، اتّسع مجلسهُ حتى وسِعَ أمّةً!\n\nالصورة الجميلة لمولاي السلطان #هيثم_بن_طارق أعزّه الله في زيارةٍ سابقةٍ إلى دولة الإمارات العربية المتّحدة الشقيقة.. ومن التقاطة أخي الكريم.@Mohammad_ae", "d": "٤ يوليو ٢٠٢٦", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HMXz31oXMAATuCL.jpg", "f": "2073331351848174027-HMXz31oXMAATuCL.jpg", "v": false}], "iso": "2026-07-04"};</script>
