<script>window.__ENTRY__={"id": "2057765901420650701", "t": "تواردت الرسائل عن مآثر الشيخ محمد بن أكرم البلوشي ومناقبه،\nوأدركتُ أن الناس.. أكثر من فقد رجل، وجدوه  نموذجاً عُمانياً؛\nآمن بوطنه فحوَّل إيمانَه إلى فعل،\nصان حدودَه بجسده جندياً،\nثم عاد ليبنيَه بعلمه معلِّماً،\nالوطنُ عنده تكليفٌ يُنفَّذ.\n\nففي العاشر من يناير 2020، رحل سلطاننا #قابوس..\nوفي العشرين منه وضع الشيخ محمد قلمه على الورق،\nوكتب كتابه \"حقوق الحاكم والمحكوم\"،\nعلى صفحة الإهداء، لم يجد كلمةً أصدقَ من:\n\"إلى روحِ أبي قابوسَ بن سعيد الغالي\".\n\nلكنَّ بين التاريخين قصةً يجهلها كثيرون..\nفي نوفمبر 1985، منحه السّلطان الراحل الوسام السّلطانيَّ الخاصّ \"الطُّغرائيَّةَ السُّلطانيَّة\"..\nتوقيع السلطان بيده على صدرِ هذا الرجل.\n\nكلٌّ منهما أهدى الآخرَ ما يملك..\nالسلطان وضع طُغراءَه على صدرِه،\nوالشيخ وضع اسمه على قلبه.\n\nرحمهما الله وألحقَهما بمن أحبَّا.", "d": "٢٢ مايو ٢٠٢٦", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/HI6nLBoWgAEx_l1.jpg", "f": "2057765901420650701-HI6nLBoWgAEx_l1.jpg", "v": false}, {"u": "https://pbs.twimg.com/media/HI6nLCyXgAAjr1U.jpg", "f": "2057765901420650701-HI6nLCyXgAAjr1U.jpg", "v": false}, {"u": "https://pbs.twimg.com/media/HI6nLFpXYAAotxn.jpg", "f": "2057765901420650701-HI6nLFpXYAAotxn.jpg", "v": false}, {"u": "https://pbs.twimg.com/media/HI6nLIhXcAEbynh.jpg", "f": "2057765901420650701-HI6nLIhXcAEbynh.jpg", "v": false}], "iso": "2026-05-22"};</script>
