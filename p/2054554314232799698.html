<script>window.__ENTRY__={"id": "2054554314232799698", "t": "في صورة جلسة \"من الطبيب توماس إلى التعايش\" للأعزّاء في @culturaloman تكوينٌ بصري يقول الكثير..\nرجلٌ في المركز، ذراعاه متشابكتان، يحيط به الآخرون.\nوهذا يحيلني لمصطلحاتٍ اعتدنا تداولها أفراداً ومؤسسات؛ تسامح، وتعايش، وتعارف..\nوبين المفاهيم الثلاثة مسافات أوسع مما يبدو؛\n\nوأبدأ بالأدنى، #التسامح جذره \"سَمَحَ\".. بمعنى أذن وتجاوز، وهي علاقة مشروطة يملك فيها طرف القدرة على الرفض فيختار التجاوز؛ وما يُمنَح قابل للسحب،\nودبلوماسياً؛ هدنة، أمّا اجتماعياً هي أشبه بحالة جيران لا يتشاجرون ولا يتزاورون.\n\nأمّا #التعايش فهو مسار أفقيٌّ لا عموديّ، لكنه في جوهره حياد،\nنعيش معاً دون أن يسعى أيٌّ منا إلى معرفة الآخر..\nوهذا يصمد في الرخاء، ويتصدّع حين تضغط الأزمات؛ لأنه لا يرتكز على رصيد إنساني مشترك،\nودبلوماسياً؛ استقرار، واجتماعياً؛ مجتمعات متجاورة، لا متداخلة.\n\nوالأعمق هو #التعارف فوزنه الصرفي \"تَفاعَل\" يقتضي طرفين فاعِلين..\nبمعنى ليس صبراً على الآخر ولا قبولاً به،\nإنمّا حركةٌ نحوه وفضولٌ حقيقي وذاكرة مشتركة تصمد..\nوالقرآن الكريم اختاره بدقة \"لتعارفوا\" لا لتتسامحوا، ولا لتتعايشوا.\nدبلوماسياً؛ سلام، واجتماعياً؛ نسيج لا يتصدّع.\n\nسلطنة #عُمان مارست التعارف قبل أن يُصاغ مصطلحاً؛\nفعبر الملاحة البحرية.. إنّ الميناء ينتج معرفةً قبل أن ينتج تعايشاً.\n\nلذا حين [نستعير \"التسامح\" من معجم غيرنا ظنّاً أنه أرقى،\nفنحن نتخلّى طَوعاً عن مفهوم أعمق وأصدق انتساباً إلى هُوِيّتنا.]\n\nالمسافة بين التسامح والتعايش والتعارف هي السؤال الذي يستحق أن يُطرح فيما بيننا!!", "d": "١٣ مايو ٢٠٢٦", "door": "غير مصنّف", "dk": "", "f": "waqfah", "m": [], "iso": "2026-05-13"};</script>
