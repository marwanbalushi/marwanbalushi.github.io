<script>window.__ENTRY__={"id": "1905932042006622683", "t": "[نحن في وطني العزيز سلطنة #عُمان 🇴🇲 لسنا سعاة بريد، بل نحن #سعاة_خير_وسلام للعالم أجمع وفقاً لثوابتنا ورسوخ مبادئنا.]\n\nمن الذاكرة؛ في إحدى صباحات العاصمة #واشنطن 🇺🇸، كان بيني وبين أحد الصحفيين الدوليين نقاشاً لا يخلو من الشراسة حول دور وطني العزيز عُمان في تهدئة الأوضاع الإقليمية، واختيارنا عدم مزاحمة غيرنا في الصورة واستجداء الضوء.\n\nوأدركتُ حينها أن أبجديات العمل الدبلوماسي لتسوية النزاعات الدولية غير حاضرة في نقاشه، فلم يستطع حينها فهم أن قيام بلادي العزيزة بـ #المساعي_الحميدة بين الفرقاء، وكذلك بين الدول المؤثرة إقليمياً يختلف بالكليّة عن دور بعض الوساطات النزقة أو المدفوعة بمصالح تتجاوز طاولة الحوار.\n\nولمحاولته إنهاء النقاش، ذيّل حديثه بتشنّج ويأس وتقزيم مواقفنا (🔻مدفوع السعر 🔻) بأن دورنا بين المتخاصمين مجرد ساعي بريد‼️،\nلأقابل تعليقه المتوتر بابتسامة (الهدوء العُماني🇴🇲) تعلوها علامات الشفقة عليه من هروبه،\n\nلأنهي حديثي بهدوء: إننا وبكلّ #نزاهة و #شرف دولة يحترمها الجميع، ويدرك البعيد قبل القريب أننا #سعاة_خير_وسلام،\nوأختم لك؛ سلاماً!", "d": "٢٩ مارس ٢٠٢٥", "door": "عُمان", "dk": "oman", "f": "waqfah", "m": [{"u": "https://pbs.twimg.com/media/GnM7FbeWoAAElY8.jpg", "f": "1905932042006622683-GnM7FbeWoAAElY8.jpg", "v": false}], "iso": "2025-03-29"};</script>
